<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1660">
<title>젤리팝 젤리마을 대소동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#2a1660;
  --bg-2:#5a2aa8;
  --panel:#ffffff;
  --ink:#2b1650;
  --ink-soft:#5e4a86;
  --text:#ffffff;
  --text-muted:#eadfff;
  --brand:#7b3fe4;
  --brand-deep:#4b1fa8;
  --pink:#ff5fa8;
  --pink-dark:#c8246b;
  --star:#ffc93c;
  --glass:rgba(255,255,255,.16);
  --radius:18px;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(130% 90% at 50% 0%,var(--bg-2),var(--bg) 70%);background-color:var(--bg);color:var(--text);font-family:var(--font-body)}
button{font-family:var(--font-display);cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--star);outline-offset:3px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}

/* 공통 버튼 */
.btn{min-height:54px;padding:0 26px;border-radius:99px;font-size:21px;background:var(--pink);color:#fff;
  box-shadow:0 6px 0 var(--pink-dark),0 10px 22px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-dark)}
.btn.soft{background:var(--glass);box-shadow:0 5px 0 rgba(0,0,0,.25);font-size:18px}
.btn.light{background:#fff;color:var(--brand-deep);box-shadow:0 5px 0 #c9b6ff}
.icon-btn{width:48px;height:48px;border-radius:14px;background:var(--glass);display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}
.mj{display:block}

/* 타이틀 */
#title{align-items:center;justify-content:center;text-align:center;gap:10px;
  background:radial-gradient(120% 70% at 50% 100%,#ff8cc0 0%,transparent 60%),radial-gradient(130% 90% at 50% 0%,var(--bg-2),var(--bg) 70%)}
.logo{font-family:var(--font-display);font-size:min(22vw,92px);line-height:.9;margin:0;
  background:linear-gradient(180deg,#fff 0%,#ffe0f2 35%,#ff8cc8 70%,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #6a2bb8) drop-shadow(0 12px 24px rgba(0,0,0,.4))}
.logo-sub{font-family:var(--font-display);font-size:26px;color:var(--star);text-shadow:0 3px 0 #8a3d00}
.title-cast{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:110px;margin:6px 0 4px}
.title-cast svg{animation:hop 1.3s ease-in-out infinite}
.title-cast svg:nth-child(2){animation-delay:.15s}.title-cast svg:nth-child(3){animation-delay:.3s}.title-cast svg:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.94)}40%{transform:translateY(-18px) scale(.95,1.05)}70%{transform:translateY(0) scale(1.1,.9)}}
.title-actions{display:grid;gap:14px;width:min(100%,300px);margin-top:12px}
.title-note{font-size:13px;color:var(--text-muted);margin-top:8px}

/* 프롤로그 */
#intro{padding:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 22px)}
.slide .scene{position:absolute;inset:0;overflow:hidden}
.slide .scene svg.full{position:absolute;inset:0;width:100%;height:100%}
.slide .caption{position:relative;background:rgba(24,10,56,.82);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.55}
.slide .caption b{display:block;font-family:var(--font-display);font-weight:400;color:var(--star);font-size:19px;margin-bottom:2px}
.slide .say{position:relative;align-self:flex-start;background:#fff;color:var(--ink);border-radius:16px;padding:9px 13px;margin-bottom:12px;font-size:15px;max-width:85%}
.slide .say.dark{background:#1b0d38;color:#ffd1e6;border:2px solid #ff4f8f}
.slide .say i{display:block;font-style:normal;font-family:var(--font-display);font-size:13px;color:var(--pink)}
.intro-bar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;display:flex;gap:8px;z-index:2}
.intro-next{position:relative;margin-top:14px;align-self:stretch}
.dots{position:absolute;top:calc(env(safe-area-inset-top) + 26px);left:18px;display:flex;gap:6px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#fff}

/* 지도 */
#map{padding:0;background:linear-gradient(180deg,#9fd8ff 0%,#ffe3f1 55%,#c8f5d0 100%)}
.map-head{position:relative;z-index:2;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.map-title{flex:1;min-width:0;background:rgba(43,22,80,.82);border-radius:16px;padding:6px 12px;line-height:1.15}
.map-title small{display:block;font-size:12px;color:var(--text-muted)}
.map-title b{font-family:var(--font-display);font-weight:400;font-size:20px}
.map-head .icon-btn{background:rgba(43,22,80,.82)}
.map-field{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  box-shadow:inset 0 10px 14px -8px rgba(43,22,80,.35),inset 0 -10px 14px -8px rgba(43,22,80,.35)}
.map-world{position:relative;width:100%;aspect-ratio:360/1200}
.map-world svg.village{position:absolute;inset:0;width:100%;height:100%;display:block}
.village .drift{animation:drift 9s ease-in-out infinite alternate}
.village .drift.slow{animation-duration:14s}
.village .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.village .flow{stroke-dasharray:6 10;animation:flow .8s linear infinite}
.village .twinkle{animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;z-index:2;
  font-family:var(--font-display);font-size:24px;color:var(--brand);border:3px solid #fff;
  background:radial-gradient(circle at 38% 30%,#fff 0%,#efe8ff 45%,#c9b6ff 100%);
  box-shadow:0 7px 0 #8f74d6,0 13px 14px rgba(43,22,80,.38)}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 #8f74d6,0 6px 8px rgba(43,22,80,.3)}
.node.done{background:radial-gradient(circle at 38% 30%,#fffbe0 0%,#ffd75a 50%,#f2a900 100%);color:var(--brand-deep);box-shadow:0 7px 0 #b97800,0 13px 14px rgba(43,22,80,.38)}
.node.boss{background:radial-gradient(circle at 38% 30%,#6a3aa8 0%,#3a1d6e 60%,#1d0f3a 100%);color:#ffb3d4;border-color:#ff4f8f;font-size:16px;box-shadow:0 7px 0 #12082a,0 13px 14px rgba(0,0,0,.45)}
.node.boss.done{background:radial-gradient(circle at 38% 30%,#fffbe0 0%,#ffd75a 50%,#f2a900 100%);color:var(--brand-deep)}
.node.next::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid #fff;animation:ping 1.4s ease-out infinite;pointer-events:none}
.node:disabled{filter:grayscale(.7) brightness(.95);opacity:.85;cursor:default}
.node:disabled:active{transform:none}
.node .st{position:absolute;top:-18px;font-size:13px;color:var(--star);text-shadow:0 1px 0 #8a3d00,0 0 4px #fff;letter-spacing:-1px;white-space:nowrap}
.node .nm{position:absolute;top:58px;font-size:12px;white-space:nowrap;background:rgba(43,22,80,.8);color:#fff;border-radius:99px;padding:1px 8px}
.walker{position:absolute;width:64px;height:50px;transform:translate(-50%,-112%);pointer-events:none;z-index:4;filter:drop-shadow(0 7px 3px rgba(43,22,80,.35))}
.walker svg,.follower svg{display:block}
.walker.walking svg,.follower.walking svg{animation:hop .45s ease-in-out infinite}
.follower{position:absolute;width:26px;height:24px;transform:translate(-50%,-95%);pointer-events:none;z-index:3;filter:drop-shadow(0 4px 2px rgba(43,22,80,.3))}
.sign{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:13px;color:#fff;background:rgba(43,22,80,.78);
  border-radius:99px;padding:2px 10px;white-space:nowrap;pointer-events:none;z-index:1}
.map-foot{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;padding:8px 12px calc(env(safe-area-inset-bottom) + 14px)}
.map-foot .btn{font-size:17px;min-height:48px;padding:0 18px}
.map-deco{position:absolute;inset:0;pointer-events:none}

/* 플레이 */
#play{padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
.hud{display:flex;align-items:center;gap:8px}
.chip{background:var(--glass);border-radius:14px;padding:5px 10px;min-height:48px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;min-width:0}
.chip small{font-size:11px;color:var(--text-muted)}
.chip b{font-family:var(--font-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.grow{flex:1}
.chip.friends b{color:var(--star)}
#stageWrap{flex:1;min-height:0;display:grid;place-items:center;margin-top:8px;position:relative}
#canvas{display:block;touch-action:none;border-radius:18px}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;text-align:center;
  font-family:var(--font-display);font-size:30px;color:var(--star);text-shadow:0 3px 0 #8a3d00,0 6px 16px rgba(0,0,0,.45);transition:all .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tip{position:absolute;left:12px;right:12px;bottom:32%;background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:15px;
  text-align:center;pointer-events:none;transition:opacity .3s}
.tip b{font-family:var(--font-display);font-weight:400;color:var(--pink)}
.tip.hide{opacity:0}

/* 결과 */
#result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(26,10,56,.7);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.result-card{width:min(100%,340px);background:var(--panel);color:var(--ink);border-radius:26px;padding:22px 20px 20px;text-align:center;
  box-shadow:0 14px 40px rgba(0,0,0,.4)}
.result-card h2{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;color:var(--brand-deep)}
.result-stars{font-size:40px;letter-spacing:4px;color:#e4dcf5;line-height:1.1;margin:4px 0}
.result-stars .on{color:var(--star);text-shadow:0 3px 0 #c98a00}
.sticker{width:96px;height:96px;margin:6px auto 6px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 5px var(--star),0 8px 18px rgba(43,22,80,.3);transform:rotate(-8deg);animation:stick .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stick{from{transform:rotate(-200deg) scale(.2)}to{transform:rotate(-8deg) scale(1)}}
.result-msg{margin:6px 0 16px;color:var(--ink-soft);font-size:15px;line-height:1.5}
.result-msg b{color:var(--ink)}
.result-actions{display:grid;gap:12px}
.result-actions .btn{font-size:19px}

/* 스티커 북 */
#book{background:linear-gradient(#fff6fd,#efe4ff);color:var(--ink)}
.book-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.book-head h2{flex:1;margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--brand-deep)}
.book-head .count{font-family:var(--font-display);background:var(--brand);color:#fff;border-radius:99px;padding:2px 12px}
.book-head .icon-btn{background:#e7dcff;color:var(--brand-deep)}
.book-rows{display:grid;gap:10px;overflow:auto;padding-bottom:10px}
.book-row{position:relative;background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 #e2d4fb}
.book-row h3{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--brand)}
.book-row h3 small{font-family:var(--font-body);font-size:12px;color:var(--ink-soft);margin-left:6px}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:50%;border:2px dashed #c9b6ff;display:grid;place-items:center;color:#b9a6e6;font-family:var(--font-display);font-size:16px;position:relative}
.cell.got{border:3px solid var(--star);background:#fffbe9}
.cell .nm{position:absolute;bottom:-14px;font-size:10px;color:var(--ink-soft);white-space:nowrap;font-family:var(--font-body)}
.book-row .cells{padding-bottom:12px}
.stamp{position:absolute;right:8px;top:6px;font-family:var(--font-display);color:#ff4f8f;border:3px solid #ff4f8f;border-radius:10px;padding:0 8px;transform:rotate(10deg);font-size:15px;background:#fff}
.book-foot{margin-top:auto;text-align:center;font-size:13px;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){.title-cast svg,.walker.walking svg,.follower.walking svg,.sticker,.village *,.node.next::after{animation:none!important}}
</style>
</head>

</svg>

<div id="app">
  <!-- 타이틀 -->
  <section class="screen" id="title">
    <div class="title-cast" aria-hidden="true">
      <svg viewBox="0 0 40 36" width="56" height="50" style="color:#3fa9ff"><use href="#j"/></svg>
      <svg viewBox="0 0 56 44" width="92" height="72"><use href="#m"/></svg>
      <svg viewBox="0 0 40 36" width="56" height="50" style="color:#ffcf33"><use href="#j"/></svg>
      <svg viewBox="0 0 40 36" width="50" height="45" style="color:#5fd36a"><use href="#j"/></svg>
    </div>
    <h1 class="logo">JELLY<br>POP!</h1>
    <div class="logo-sub">젤리마을 대소동</div>
    <div class="title-actions">
      <button class="btn" id="startBtn">시작하기</button>
      <button class="btn soft" id="bookBtn1">스티커 북</button>
      <button class="btn soft" id="storyBtn">이야기 다시 보기</button>
    </div>
    <div class="title-note" id="titleNote"></div>
  </section>

  <!-- 프롤로그 -->
  <section class="screen" id="intro" hidden>
    <div class="dots" id="dots"></div>
    <div class="intro-bar"><button class="btn soft" id="skipBtn" style="min-height:44px;font-size:16px;padding:0 16px">건너뛰기</button></div>
    <div id="slides"></div>
  </section>

  <!-- 지도 -->
  <section class="screen" id="map" hidden>
    <div class="map-head">
      <button class="icon-btn" id="mapHome" aria-label="처음 화면으로"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
      <div class="map-title"><small>월드 1</small><b>젤리마을</b></div>
      <div class="map-title" style="flex:none"><small>스티커</small><b id="mapStickers">0 / 30</b></div>
    </div>
    <div class="map-field" id="mapField">
      <div class="map-world" id="mapWorld"></div>
    </div>
    <div class="map-foot">
      <button class="btn" id="mapPlay">스테이지 1 시작</button>
      <button class="btn light" id="bookBtn2">스티커 북</button>
    </div>
  </section>

  <!-- 플레이 -->
  <section class="screen" id="play" hidden>
    <div class="hud">
      <button class="icon-btn" id="playMap" aria-label="지도로"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
      <div class="chip grow"><small id="hudStage">스테이지 1</small><b id="hudName">마을 광장</b></div>
      <div class="chip friends"><small id="hudGoalLabel">구할 친구</small><b id="hudGoal">0 / 1</b></div>
      <button class="icon-btn" id="soundBtn" aria-label="소리 켜기/끄기"></button>
    </div>
    <div id="stageWrap">
      <canvas id="canvas" tabindex="0" aria-label="게임 판. 끌어서 조준하고 떼면 발사. 키보드는 왼쪽·오른쪽 화살표로 조준, 스페이스로 발사, X로 순서 바꾸기"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="tip hide" id="tip"></div>
    </div>
  </section>

  <!-- 스티커 북 -->
  <section class="screen" id="book" hidden>
    <div class="book-head">
      <button class="icon-btn" id="bookBack" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>친구 스티커 북</h2><span class="count" id="bookCount">0 / 30</span>
    </div>
    <div class="book-rows" id="bookRows"></div>
    <div class="book-foot">월드 한 줄을 다 채우면 월드 스탬프가 찍혀요</div>
  </section>
</div>

<!-- 결과 -->
<div id="result" hidden>
  <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">스테이지 클리어!</h2>
    <div class="result-stars" id="resultStars"><span>★</span><span>★</span><span>★</span></div>
    <div id="resultSticker"></div>
    <p class="result-msg" id="resultMsg"></p>
    <div class="result-actions">
      <button class="btn" id="resultMain">지도로</button>
      <button class="btn light" id="resultSub">다시 하기</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ============================================================

// 거품 판 규칙 (순수 함수 → 테스트에서 직접 확인)
// ============================================================
const Board = {
  // parity: 판 맨 위에 줄이 새로 생기면 홀짝이 바뀐다
  odd(b, r) { return ((r + b.parity) & 1) === 1; },
  cols(b, r) { return Board.odd(b, r) ? 9 : 10; },
  pos(b, r, c) { return { x: R + c * D + (Board.odd(b, r) ? R : 0), y: b.y0 + R + r * ROW_H }; },
  get(b, r, c) { return r >= 0 && r < b.rows.length && c >= 0 && c < Board.cols(b, r) ? b.rows[r][c] : null; },
  neighbors(b, r, c) {
    const o = Board.odd(b, r);
    const list = o ? [[r-1,c],[r-1,c+1],[r,c-1],[r,c+1],[r+1,c],[r+1,c+1]] : [[r-1,c-1],[r-1,c],[r,c-1],[r,c+1],[r+1,c-1],[r+1,c]];
    return list.filter(([y, x]) => y >= 0 && x >= 0 && x < Board.cols(b, y));
  },
  ensureRow(b, r) { while (b.rows.length <= r) b.rows.push(new Array(Board.cols(b, b.rows.length)).fill(null)); },
  fromRows(strs, y0) {
    const b = { rows: [], parity: 0, y0, friendCount: 0 };
    strs.forEach((s, r) => {
      const row = new Array(Board.cols(b, r)).fill(null);
      [...s].forEach((ch, c) => {
        if (ch === '.' || c >= row.length) return;
        const lower = ch.toLowerCase();
        row[c] = ch !== lower ? { c: lower, friend: b.friendCount++ } : { c: lower };
      });
      b.rows.push(row);
    });
    return b;
  },
  group(b, r, c) {
    const start = Board.get(b, r, c); if (!start) return [];
    const seen = new Set([r + ',' + c]), out = [[r, c]], stack = [[r, c]];
    while (stack.length) {
      const [y, x] = stack.pop();
      for (const [ny, nx] of Board.neighbors(b, y, x)) {
        const k = ny + ',' + nx, n = Board.get(b, ny, nx);
        if (!seen.has(k) && n && n.c === start.c) { seen.add(k); out.push([ny, nx]); stack.push([ny, nx]); }
      }
    }
    return out;
  },
  // 천장(0번 줄)과 이어지지 않은 거품 목록
  floating(b) {
    const seen = new Set(), stack = [];
    for (let c = 0; c < Board.cols(b, 0); c++) if (Board.get(b, 0, c)) { seen.add('0,' + c); stack.push([0, c]); }
    while (stack.length) {
      const [y, x] = stack.pop();
      for (const [ny, nx] of Board.neighbors(b, y, x)) {
        const k = ny + ',' + nx;
        if (!seen.has(k) && Board.get(b, ny, nx)) { seen.add(k); stack.push([ny, nx]); }
      }
    }
    const out = [];
    b.rows.forEach((row, r) => row.forEach((cell, c) => { if (cell && !seen.has(r + ',' + c)) out.push([r, c]); }));
    return out;
  },
  colorsOnBoard(b) { const s = new Set(); b.rows.forEach(row => row.forEach(cell => cell && s.add(cell.c))); return s; },
  count(b) { let n = 0; b.rows.forEach(row => row.forEach(cell => cell && n++)); return n; },
  lowestY(b) { let y = -1; b.rows.forEach((row, r) => row.forEach((cell, c) => { if (cell) y = Math.max(y, Board.pos(b, r, c).y); })); return y; },
  // 붙을 칸 찾기: 부딪힌 자리에서 가장 가까운 빈칸 (천장 줄이거나 이웃이 있는 칸)
  snap(b, x, y) {
    const r0 = Math.max(0, Math.round((y - b.y0 - R) / ROW_H));
    let best = null, bd = Infinity;
    for (let r = Math.max(0, r0 - 1); r <= r0 + 1; r++) {
      for (let c = 0; c < Board.cols(b, r); c++) {
        if (Board.get(b, r, c)) continue;
        const p = Board.pos(b, r, c), d = (p.x - x) ** 2 + (p.y - y) ** 2;
        const ok = r === 0 || Board.neighbors(b, r, c).some(([ny, nx]) => Board.get(b, ny, nx));
        if (ok && d < bd) { bd = d; best = [r, c]; }
      }
    }
    return best;
  },
  // 발사 길 따라가기: 벽에 튕기고, 천장이나 거품에 닿으면 멈춤 → 멈춘 자리와 지나간 점들
  trace(b, angle, maxLen = 2400) {
    let x = PIVOT.x + Math.cos(angle) * 34, y = PIVOT.y + Math.sin(angle) * 34;
    let vx = Math.cos(angle), vy = Math.sin(angle), len = 0;
    const pts = [], hitR2 = (D * 0.82) ** 2;
    const bubbles = [];
    b.rows.forEach((row, r) => row.forEach((cell, c) => cell && bubbles.push(Board.pos(b, r, c))));
    while (len < maxLen) {
      x += vx * 3; y += vy * 3; len += 3;
      if (x < R) { x = 2 * R - x; vx = -vx; }
      if (x > W - R) { x = 2 * (W - R) - x; vx = -vx; }
      if (len % 15 < 3) pts.push({ x, y });
      if (y - R <= b.y0) return { x, y, pts };
      for (const p of bubbles) if ((p.x - x) ** 2 + (p.y - y) ** 2 < hitR2) return { x, y, pts };
    }
    return { x, y, pts };
  },
  clone(b) { return { rows: b.rows.map(row => row.map(c => c && { ...c })), parity: b.parity, y0: b.y0, friendCount: b.friendCount }; },
  // 놓기 + 터뜨리기 + 떨어뜨리기 (판을 바꾸고 결과를 돌려줌)
  place(b, r, c, color) {
    Board.ensureRow(b, r);
    b.rows[r][c] = { c: color };
    const group = Board.group(b, r, c);
    let popped = [], dropped = [];
    if (group.length >= 3) {
      popped = group.map(([y, x]) => ({ r: y, c: x, cell: b.rows[y][x] }));
      group.forEach(([y, x]) => { b.rows[y][x] = null; });
      dropped = Board.floating(b).map(([y, x]) => ({ r: y, c: x, cell: b.rows[y][x] }));
      dropped.forEach(d => { b.rows[d.r][d.c] = null; });
    }
    while (b.rows.length && b.rows[b.rows.length - 1].every(x => !x)) b.rows.pop();
    return { popped, dropped };
  },
  // 맨 위에 새 줄 추가 (보스가 던지는 거품)
  pushTop(b, colors) {
    b.parity ^= 1;
    const row = new Array(Board.cols(b, 0)).fill(null).map(() => ({ c: colors[Math.floor(rand() * colors.length)] }));
    b.rows.unshift(row);
  },
};

let G = null;
function newGame(stageNo) {
  const st = STAGES[stageNo - 1];
  const b = Board.fromRows(st.rows, st.boss ? 84 : 10);
  G = {
    st, b, shotsLeft: st.shots, queue: [], angle: -Math.PI / 2, crank: 0, aiming: false,
    state: 'aim', moving: null, fx: [], falls: [], pops: [], texts: [], rescues: [],
    saved: 0, need: st.boss ? 1 : b.friendCount, bossHp: st.boss ? st.boss.hp : 0, bossHit: 0,
    shotCount: 0, score: 0, settleT: 0, queueShift: 0, y0Target: b.y0, swapT: 0, outcome: null, time: 0,
  };
  fillQueue();
}
function boardColors() { const s = Board.colorsOnBoard(G.b); const arr = [...s]; return arr.length ? arr : [...G.st.colors]; }
function randomColor() { const a = boardColors(); return a[Math.floor(rand() * a.length)]; }
function fillQueue() { const want = Math.min(G.shotsLeft, 6); while (G.queue.length < want) G.queue.push(randomColor()); G.queue.length = Math.min(G.queue.length, want); }
function refreshQueueColors() {
  const s = Board.colorsOnBoard(G.b); if (!s.size) return;
  G.queue = G.queue.map(c => s.has(c) ? c : randomColor());
}

function shoot() {
  if (!G || G.state !== 'aim' || G.shotsLeft <= 0 || !G.queue.length) return false;
  const color = G.queue.shift();
  G.shotsLeft--;
  fillQueue();
  const a = G.angle;
  G.moving = { x: PIVOT.x + Math.cos(a) * 34, y: PIVOT.y + Math.sin(a) * 34, vx: Math.cos(a) * SPEED, vy: Math.sin(a) * SPEED, c: color };
  G.state = 'flying';
  G.queueShift = 1;
  hideTip();
  sfx('shoot');
  return true;
}
function swapQueue() {
  if (!G || G.state !== 'aim' || G.queue.length < 2) return false;
  [G.queue[0], G.queue[1]] = [G.queue[1], G.queue[0]];
  G.swapT = 1; sfx('swap');
  return true;
}
function setAngle(a) {
  if (!G) return;
  a = Math.max(MIN_A, Math.min(MAX_A, a));
  G.crank += (a - G.angle) * 6;   // 말랑이가 핸들을 돌린 만큼 대포가 돈다
  G.angle = a;
}

function stepMoving(dt) {
  const m = G.moving, b = G.b, steps = Math.ceil(SPEED * dt / 3), hitR2 = (D * 0.82) ** 2;
  for (let i = 0; i < steps; i++) {
    m.x += m.vx * dt / steps; m.y += m.vy * dt / steps;
    if (m.x < R) { m.x = 2 * R - m.x; m.vx = -m.vx; sfx('bounce'); }
    if (m.x > W - R) { m.x = 2 * (W - R) - m.x; m.vx = -m.vx; sfx('bounce'); }
    let hit = m.y - R <= b.y0;
    if (!hit) for (let r = 0; r < b.rows.length && !hit; r++) for (let c = 0; c < b.rows[r].length; c++) {
      if (!b.rows[r][c]) continue;
      const p = Board.pos(b, r, c);
      if ((p.x - m.x) ** 2 + (p.y - m.y) ** 2 < hitR2) { hit = true; break; }
    }
    if (hit) { land(m); return; }
  }
}

function land(m) {
  const b = G.b;
  const cell = Board.snap(b, m.x, m.y) || Board.snap(b, m.x, m.y + ROW_H);
  G.moving = null;
  if (!cell) { G.state = 'settle'; G.settleT = .2; return; }
  const [r, c] = cell;
  const res = Board.place(b, r, c, m.c);
  const n = res.popped.length, d = res.dropped.length;
  if (n) {
    G.score += n * 10 + d * 20;
    res.popped.forEach((p, i) => { const q = Board.pos(b, p.r, p.c); G.pops.push({ x: q.x, y: q.y, c: p.cell.c, t: -i * .03 }); burst(q.x, q.y, p.cell.c, 6); });
    res.dropped.forEach(p => { const q = Board.pos(b, p.r, p.c); G.falls.push({ x: q.x, y: q.y, vy: -60 - rand() * 80, vx: (rand() - .5) * 60, c: p.cell.c, friend: p.cell.friend }); });
    [...res.popped, ...res.dropped].forEach(p => { if (p.cell.friend !== undefined) rescue(p.cell.friend, Board.pos(b, p.r, p.c)); });
    if (G.st.boss) { const dmg = n + d; G.bossHp = Math.max(0, G.bossHp - dmg); G.bossHit = 1; G.texts.push({ x: 180, y: 70, text: '-' + dmg, life: 1, color: '#ff8ab8' }); }
    const p0 = Board.pos(b, r, c);
    G.texts.push({ x: p0.x, y: p0.y, text: '+' + (n * 10 + d * 20), life: 1 });
    if (d >= 4) showToast('우르르 쿵!'); else if (n >= 6) showToast('굉장해요!');
    sfx('pop', n); if (d) setTimeout(() => sfx('drop'), 120);
    try { navigator.vibrate && navigator.vibrate(n >= 5 ? 30 : 12); } catch (e) {}
  } else {
    sfx('stick');
  }
  G.state = 'settle'; G.settleT = n ? .45 : .12;
  updateHud();
}

function rescue(idx, at) {
  const f = G.st.friends[idx] || G.st.friends[0];
  G.saved++;
  G.rescues.push({ x: at.x, y: at.y, t: 0, color: f.color, name: f.name });
  showToast(f.name + ' 구출!');
  sfx('rescue');
}

function afterSettle() {
  const st = G.st, b = G.b;
  G.shotCount++;
  if (st.boss && G.bossHp <= 0) {
    rescue(0, { x: 180, y: 60 });
    return finish(true);
  }
  if (!st.boss && G.saved >= G.need) return finish(true);
  if (st.drop && G.shotCount % st.drop === 0) { G.y0Target += ROW_H; showToast('천장이 내려와요!'); }
  if (st.boss && G.shotCount % st.boss.every === 0) { Board.pushTop(b, [...st.colors]); G.texts.push({ x: 180, y: 70, text: '뭉치의 거품 공격!', life: 1.2, color: '#ffb3d4' }); sfx('boss'); }
  if (st.boss && Board.count(b) === 0) { Board.pushTop(b, [...st.colors]); Board.pushTop(b, [...st.colors]); }
  b.y0 = G.y0Target;
  if (Board.lowestY(b) + R > DEADLINE) return finish(false, 'line');
  if (G.shotsLeft <= 0) return finish(false, 'shots');
  refreshQueueColors();
  G.state = 'aim';
}

function finish(win, reason) {
  G.state = 'done';
  G.outcome = { win, reason };
  const st = G.st;
  let stars = 0, newSticker = false;
  if (win) {
    const ratio = G.shotsLeft / st.shots;
    stars = ratio >= .35 ? 3 : ratio >= .15 ? 2 : 1;
    P.stars[st.id - 1] = Math.max(P.stars[st.id - 1] || 0, stars);
    if (!P.stickers[st.id]) { P.stickers[st.id] = true; newSticker = true; }
    saveP();
    sfx('win');
  } else sfx('lose');
  G.outcome.stars = stars; G.outcome.newSticker = newSticker;
  const game = G;
  setTimeout(() => { if (G === game) showResult(); }, win ? 1100 : 600);
}

const canvas = $('canvas'), ctx = canvas.getContext('2d');
let scale = 1, dpr = 1;
const sprites = {};
function bubbleSprite(color) {
  const key = color + '@' + dpr;
  if (sprites[key]) return sprites[key];
  const s = Math.ceil(D * dpr * 1.1), cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'); g.scale(s / (D * 1.1), s / (D * 1.1)); g.translate(D * .55, D * .55);
  const col = COLORS[color];
  const grad = g.createRadialGradient(-R * .35, -R * .4, R * .1, 0, 0, R);
  grad.addColorStop(0, col.light); grad.addColorStop(.55, col.base); grad.addColorStop(1, col.dark);

  g.fillStyle = 'rgba(40,12,50,.75)';
  g.beginPath(); g.arc(-R * .28, R * .08, R * .11, 0, 7); g.fill(); g.beginPath(); g.arc(R * .28, R * .08, R * .11, 0, 7); g.fill();

  g.beginPath(); g.arc(0, R * .2, R * .16, .2 * Math.PI, .8 * Math.PI); g.stroke();
  g.fillStyle = 'rgba(255,110,150,.35)';
  g.beginPath(); g.ellipse(-R * .5, R * .3, R * .13, R * .08, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(R * .5, R * .3, R * .13, R * .08, 0, 0, 7); g.fill();

}

// 젤리 몸통 (친구·말랑이)
function jellyPath(x, y, w, h) {
  ctx.beginPath();

  ctx.bezierCurveTo(x - w / 2, y - h * .55, x - w * .25, y - h / 2, x, y - h / 2);

function resize() {
  const box = $('stageWrap').getBoundingClientRect();
  if (!box.width || !box.height) return;
  scale = Math.min(box.width / W, box.height / H);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = Math.floor(W * scale) + 'px'; canvas.style.height = Math.floor(H * scale) + 'px';
  canvas.width = Math.floor(W * scale * dpr); canvas.height = Math.floor(H * scale * dpr);
  dpr = dpr * scale;   // 스프라이트·배경을 실제 픽셀 크기로
}
window.addEventListener('resize', () => { if (!$('play').hidden) resize(); });

function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = rand() * 6.283, sp = 60 + rand() * 160;
    G.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, r: 2 + rand() * 3.5, c: COLORS[c] ? COLORS[c].base : c, life: 1 });
  }
}

function render(dt) {
  const t = G.time;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(background(G.st.theme), 0, 0, W, H);
  const b = G.b;
  // 바닥 선
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, DEADLINE); ctx.lineTo(W, DEADLINE); ctx.stroke(); ctx.setLineDash([]);
  // 천장 (내려오는 스테이지)
  if (b.y0 > 12 && !G.st.boss) {
    ctx.fillStyle = 'rgba(90,40,140,.75)'; ctx.fillRect(0, 0, W, b.y0);
    ctx.fillStyle = '#ffb347'; for (let x = 0; x < W; x += 24) { ctx.beginPath(); ctx.moveTo(x, b.y0); ctx.lineTo(x + 12, b.y0 + 8); ctx.lineTo(x + 24, b.y0); ctx.fill(); }
  }
  // 보스
  if (G.st.boss) drawBoss(t);
  // 거품
  for (let r = 0; r < b.rows.length; r++) for (let c = 0; c < b.rows[r].length; c++) {
    const cell = b.rows[r][c]; if (!cell) continue;
    const p = Board.pos(b, r, c);
    if (cell.friend !== undefined) drawFriendBubble(p.x, p.y, cell, t);
    else drawBubble(p.x, p.y, cell.c);
  }
  // 조준선
  if (G.state === 'aim' && G.queue.length && G.cancelAim) {
    ctx.fillStyle = 'rgba(20,8,48,.7)'; roundRect(W / 2 - 80, 440, 160, 26, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '14px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('여기서 떼면 발사 취소', W / 2, 458);
  } else if (G.state === 'aim' && G.queue.length) {
    const tr = Board.trace(b, G.angle, G.aiming ? 2400 : 260);
    tr.pts.forEach((p, i) => { ctx.globalAlpha = Math.max(.15, 1 - i / 60); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    if (G.aiming) {
      const cell = Board.snap(b, tr.x, tr.y);
      if (cell) { const p = Board.pos(b, cell[0], cell[1]); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(p.x, p.y, R - 2, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    }
  }

  for (const p of G.pops) { if (p.t < 0) { drawBubble(p.x, p.y, p.c); continue; } const k = p.t / .3; drawBubble(p.x, p.y, p.c, 1 + k * .5, 1 - k); }

  drawCannonArea(t, dt);

    const k = Math.min(1, r.t / 1.4), tx = 74, ty = 560;

    drawJelly(x, y, 30, 27, r.color, { happy: true });

  }
  // 파티클
  G.fx = G.fx.filter(p => (p.life -= dt * 1.6) > 0);
  for (const p of G.fx) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.font = '20px Jua, sans-serif';
  for (const x of G.texts) { const y = x.y - (1 - x.life) * 40; ctx.globalAlpha = Math.min(1, x.life * 2); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,10,80,.85)'; ctx.strokeText(x.text, x.x, y); ctx.fillStyle = x.color || '#fff'; ctx.fillText(x.text, x.x, y); }
  ctx.globalAlpha = 1;
  // 키보드 조작 표시
  if (document.activeElement === canvas && kbUsed) { ctx.strokeStyle = '#ffc93c'; ctx.lineWidth = 3; ctx.strokeRect(2, 2, W - 4, H - 4); }
}

function drawFriendBubble(x, y, cell, t) {
  const f = G.st.friends[cell.friend] || G.st.friends[0];
  drawBubble(x, y, cell.c, 1.08, .55);
  drawJelly(x, y + 2, 24, 22, f.color, {});
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, R + 1, 0, 7); ctx.stroke();

  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = (i % 2 ? 2.5 : 6) * (0.8 + tw * .3); ctx.lineTo(x + R * .7 + Math.cos(a) * rr, y - R * .75 + Math.sin(a) * rr); } ctx.fill();
}

function drawBoss(t) {
  const hpRatio = G.bossHp / G.st.boss.hp;
  G.bossHit = Math.max(0, G.bossHit - .03);
  const shake = G.bossHit * Math.sin(t * 60) * 4;
  const x = 180 + shake, y = 42 + Math.sin(t * 2) * 3;
  ctx.save(); ctx.translate(x, y);
  const angry = hpRatio < .5;
  ctx.fillStyle = angry ? '#5a1d5e' : '#3a1d6e';
  ctx.beginPath(); ctx.moveTo(-34, -14); ctx.lineTo(-40, -36); ctx.lineTo(-20, -24); ctx.fill();
  ctx.beginPath(); ctx.moveTo(34, -14); ctx.lineTo(40, -36); ctx.lineTo(20, -24); ctx.fill();
  jellyPath(0, 0, 92, 66); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.ellipse(-18, -18, 14, 7, -.4, 0, 7); ctx.fill();
  ctx.fillStyle = G.bossHit > .2 ? '#fff' : '#ff4f8f';
  ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(-8, 0); ctx.lineTo(-26, 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, -6); ctx.lineTo(8, 0); ctx.lineTo(26, 6); ctx.fill();
  ctx.strokeStyle = '#ff4f8f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-12, 16); ctx.quadraticCurveTo(0, angry ? 8 : 22, 12, 16); ctx.stroke();
  ctx.restore();

  ctx.font = '13px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffb3d4'; ctx.fillText('보스 ' + G.st.boss.name, 59, 21);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(260, 12, 82, 8);
  ctx.fillStyle = '#ff4f8f'; ctx.fillRect(260, 12, 82 * hpRatio, 8);
  ctx.fillStyle = '#fff'; ctx.font = '11px Jua, sans-serif'; ctx.fillText(G.bossHp + ' / ' + G.st.boss.hp, 301, 36);
}

  if (G.queue.length && G.state !== 'done') {
    const mx = PIVOT.x + Math.cos(G.angle) * 30, my = PIVOT.y + Math.sin(G.angle) * 30;

  }
  // 받침대
  ctx.fillStyle = '#9b7be6'; ctx.strokeStyle = '#5a2bb8'; ctx.lineWidth = 3;

  ctx.strokeStyle = '#d9c8ff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(PIVOT.x - 28, cy); ctx.stroke();

function unlockedCount() { let n = 1; for (let i = 0; i < 6; i++) if (P.stars[i] > 0) n = i + 2; return Math.min(n, 6); }
let walkFrom = null, mapAnim = 0;
function renderMap() {
  cancelAnimationFrame(mapAnim);
  const field = $('mapField'), world = $('mapWorld');
  $('mapStickers').textContent = totalStickers() + ' / 30';
  const open = unlockedCount(), at = open - 1;
  world.innerHTML = villageSVG(open) + `<div class="sign" style="left:${176 / MAP_W * 100}%;top:${34 / MAP_H * 100}%">↑ 시럽 숲 (준비 중)</div>`;
  const pct = (x, y, node) => { node.style.left = x / MAP_W * 100 + '%'; node.style.top = y / MAP_H * 100 + '%'; };
  STAGES.forEach((st, i) => {
    const btn = document.createElement('button');
    btn.className = 'node' + (P.stars[i] ? ' done' : '') + (st.boss ? ' boss' : '') + (i === at && !P.stars[i] ? ' next' : '');
    pct(MAP_NODES[i][0], MAP_NODES[i][1], btn);
    btn.disabled = i >= open;
    btn.setAttribute('aria-label', `스테이지 ${i + 1} ${st.name}` + (P.stars[i] ? ` 별 ${P.stars[i]}개` : i >= open ? ' 잠김' : ''));
    btn.innerHTML = (st.boss ? '보스' : (i + 1)) + (P.stars[i] ? `<span class="st">${'★'.repeat(P.stars[i])}${'☆'.repeat(3 - P.stars[i])}</span>` : '') + `<span class="nm">${st.name}</span>`;
    btn.onclick = () => startStage(i + 1);
    btn.dataset.stage = i + 1;
    world.appendChild(btn);
  });
  // 각 칸이 길 위 어디쯤인지 (길 길이 기준)
  const road = world.querySelector('#roadLine'), total = road.getTotalLength();
  const nodeLen = MAP_NODES.map(([x, y]) => {
    let best = 0, bd = Infinity;
    for (let l = 0; l <= total; l += 3) { const p = road.getPointAtLength(l), dd = (p.x - x) ** 2 + (p.y - y) ** 2; if (dd < bd) { bd = dd; best = l; } }
    return best;
  });
  // 말랑이 + 구한 친구들이 줄지어 길을 따라 걷는다
  const walker = document.createElement('div'); walker.className = 'walker';
  walker.innerHTML = '<svg viewBox="0 0 56 44" width="64" height="50"><use href="#m"/></svg>';
  const fols = STAGES.filter((s, i) => P.stars[i]).map(s => s.friends[0].color).slice(-5).reverse().map(c => {
    const f = document.createElement('div'); f.className = 'follower';
    f.innerHTML = `<svg viewBox="0 0 40 36" width="26" height="24" style="color:${c}"><use href="#j"/></svg>`;
    return f;
  });
  world.append(...fols, walker);
  const put = (node, l) => { const p = road.getPointAtLength(Math.max(0, Math.min(total, l))); pct(p.x, p.y, node); return p; };
  const place = len => { fols.forEach((f, k) => put(f, len - 40 * (k + 1))); return put(walker, len); };
  const follow = p => { field.scrollTop = p.y / MAP_H * world.offsetHeight - field.clientHeight * .6; };
  const from = walkFrom !== null && walkFrom < at ? walkFrom : at;
  follow(place(nodeLen[from]));
  if (from !== at) {
    [walker, ...fols].forEach(n => n.classList.add('walking'));
    const a = nodeLen[from], b = nodeLen[at], t0 = performance.now(), dur = 900;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      follow(place(a + (b - a) * e));
      if (k < 1) mapAnim = requestAnimationFrame(step); else [walker, ...fols].forEach(n => n.classList.remove('walking'));
    };
    mapAnim = requestAnimationFrame(step);
  }
  walkFrom = null;
  P.at = at; saveP();
  $('mapPlay').textContent = P.stars[at] && at === 5 ? '보스 다시 하기' : `스테이지 ${at + 1} 시작`;
  $('mapPlay').onclick = () => startStage(at + 1);
}

// 결과 창: 포커스를 창 안에 가두고, Esc는 지도로
$('result').addEventListener('keydown', e => {
  const btns = [$('resultMain'), $('resultSub')];
  if (e.key === 'Tab') {
    const i = btns.indexOf(document.activeElement);
    btns[(i + (e.shiftKey ? btns.length - 1 : 1)) % btns.length].focus(); e.preventDefault();
  } else if (e.key === 'Escape') {
    const win = G && G.outcome && G.outcome.win;
    $('result').hidden = true; G = null;
    if (win) walkFrom = Number($('resultMain').dataset.stage) - 1;
    go('map');
  }
});

    }
    const complete = wi === 0 && STAGES.every(s => P.stickers[s.id]);
    return `<div class="book-row"><h3>월드 ${wi + 1} · ${w}${wi > 0 ? '<small>준비 중</small>' : ''}</h3><div class="cells">${cells}</div>${complete ? '<span class="stamp">젤리마을 완주!</span>' : ''}</div>`;
  }).join('');
}
$('bookBack').onclick = () => go(bookReturn);

// ============================================================
updateSoundBtn();
go('title');
requestAnimationFrame(frame);

// 테스트용 손잡이 (화면에는 영향 없음)
window.__jp = {
  get G() { return G; }, P, STAGES, Board, R, ROW_H, W, H, PIVOT, DEADLINE,
  startStage, shoot, swapQueue, setAngle, go, seedRandom,
  reset() { Object.assign(P, { stars: [0, 0, 0, 0, 0, 0], stickers: {}, seenIntro: false, at: 0 }); saveP(); },
  // 날아가는 중·정리 중인 시간을 한 번에 넘기기 (자동 플레이 테스트용)
  advance() { let n = 0; while (G && (G.state === 'flying' || G.state === 'settle') && n++ < 2000) update(1 / 60); return G && G.state; },
  // 이 각도로 쏘면 어디에 붙고 몇 개가 터지는지 (판은 바꾸지 않음)
  evalShot(angle, color) {
    const b = Board.clone(G.b), tr = Board.trace(b, angle), cell = Board.snap(b, tr.x, tr.y);
    if (!cell) return null;
    const res = Board.place(b, cell[0], cell[1], color || G.queue[0]);
    const friends = [...res.popped, ...res.dropped].filter(p => p.cell.friend !== undefined).length;
    return { cell, popped: res.popped.length, dropped: res.dropped.length, friends, lowest: Board.lowestY(b) };
  },
};
})();
</script>
