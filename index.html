<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1446">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>젤리팝</title>
<style>
:root{
  color-scheme:dark;
  --color-bg:#2a1446;
  --color-bg-2:#55237a;
  --color-surface:rgba(255,255,255,.10);
  --color-surface-strong:rgba(255,255,255,.18);
  --color-text:#ffffff;
  --color-text-muted:#e8dcff;
  --color-primary:#ff4f9a;
  --color-primary-dark:#c8246b;
  --color-on-primary:#ffffff;
  --color-accent:#ffd23f;
  --color-success:#5ee38a;
  --radius-lg:22px;
  --radius-md:14px;
  --font-family-base:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  --shadow-pop:0 6px 0 var(--color-primary-dark),0 10px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(130% 90% at 50% 0%,var(--color-bg-2),var(--color-bg) 70%);background-color:var(--color-bg);
  color:var(--color-text);font-family:var(--font-family-base)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}

#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}

/* HUD */
.hud{display:flex;align-items:center;gap:8px}
.chip{background:var(--color-surface);border-radius:var(--radius-md);padding:8px 12px;min-height:48px;
  display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.chip small{font-size:12px;color:var(--color-text-muted)}
.chip b{font-size:20px}
.moves{margin-left:auto;align-items:center;min-width:76px}
.moves b{font-size:28px;color:var(--color-accent)}
.moves.low b{color:#ff8a8a;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.icon-btn{width:48px;height:48px;border-radius:var(--radius-md);background:var(--color-surface);display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}
.progress{margin:10px 2px 8px;height:16px;border-radius:99px;background:var(--color-surface);overflow:hidden;position:relative}
.progress i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ff7bb5,var(--color-primary));transition:width .35s ease}
.progress span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}

#board{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#canvas{display:block;touch-action:none}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
  font-size:28px;font-weight:900;color:var(--color-accent);text-shadow:0 3px 0 #b5520f,0 6px 16px rgba(0,0,0,.4);
  transition:all .25s ease;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hint{text-align:center;font-size:13px;color:var(--color-text-muted);margin-top:8px}

/* Screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:24px;
  background:rgba(26,10,46,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .25s}
.screen.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#title{background:radial-gradient(130% 90% at 50% 0%,var(--color-bg-2),var(--color-bg) 70%)}
.card{width:100%;max-width:360px;text-align:center}
.logo{font-size:64px;font-weight:900;letter-spacing:-2px;margin:8px 0 0;line-height:1;
  background:linear-gradient(180deg,#fff2a8,#ffd23f 45%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #b5300f) drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.sub{color:var(--color-text-muted);margin:10px 0 22px;font-size:15px}
.blobs{display:flex;justify-content:center;gap:12px;height:84px;align-items:flex-end;margin-bottom:6px}
.blob{width:56px;height:52px;border-radius:42% 42% 36% 36%/50% 50% 40% 40%;position:relative;animation:hop 1.2s ease-in-out infinite}
.blob:nth-child(2){animation-delay:.15s}.blob:nth-child(3){animation-delay:.3s}.blob:nth-child(4){animation-delay:.45s}
.blob::before{content:"";position:absolute;left:12px;top:8px;width:16px;height:9px;border-radius:50%;background:rgba(255,255,255,.7)}
.blob::after{content:"• ‿ •";position:absolute;left:0;right:0;top:22px;font-size:14px;font-weight:900;color:rgba(40,10,40,.75)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.08,.92)}40%{transform:translateY(-26px) scale(.94,1.06)}70%{transform:translateY(0) scale(1.12,.88)}}
.btn{display:block;width:100%;min-height:56px;border-radius:var(--radius-lg);font-size:20px;font-weight:800;
  background:var(--color-primary);color:var(--color-on-primary);box-shadow:var(--shadow-pop);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--color-primary-dark)}
.btn.secondary{background:var(--color-surface-strong);box-shadow:0 5px 0 rgba(0,0,0,.25);margin-top:14px;font-size:17px}
.howto{margin-top:22px;background:var(--color-surface);border-radius:var(--radius-md);padding:14px 16px;text-align:left;font-size:14px;line-height:1.6;color:var(--color-text-muted)}
.howto b{color:var(--color-text)}
.best{margin-top:14px;font-size:14px;color:var(--color-text-muted)}
.result-title{font-size:40px;font-weight:900;margin:0 0 6px}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0 10px;color:rgba(255,255,255,.2)}
.stars .on{color:var(--color-accent);text-shadow:0 3px 0 #b5520f}
.result-score{font-size:18px;margin-bottom:22px;color:var(--color-text-muted);line-height:1.6}
.result-score b{color:var(--color-text);font-size:24px}
@media (max-width:360px){#app{padding-left:6px;padding-right:6px}.chip{padding:6px 9px}.hud{gap:6px}}
@media (max-height:620px){.hint{display:none}.progress{margin:8px 2px 6px}}
@media (prefers-reduced-motion:reduce){.blob,.moves.low b{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="chip"><small>레벨</small><b id="level">1</b></div>
    <div class="chip"><small>점수</small><b id="score">0</b></div>
    <div class="chip moves" id="movesChip"><small>남은 터치</small><b id="moves">20</b></div>
    <button class="icon-btn" id="soundBtn" aria-label="소리 켜기/끄기"></button>
    <button class="icon-btn" id="menuBtn" aria-label="처음 화면으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </button>
  </div>
  <div class="progress" aria-label="목표 점수 진행률"><i id="bar"></i><span id="barText">0 / 1200</span></div>
  <div id="board"><canvas id="canvas"></canvas><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
  <div class="hint">같은 색 2개 이상 터치 · 7개 이상이면 💣 폭탄 젤리</div>
</div>

<section class="screen" id="title">
  <div class="card">
    <div class="blobs" aria-hidden="true">
      <div class="blob" style="background:linear-gradient(#ff9bb4,#ff4f7b)"></div>
      <div class="blob" style="background:linear-gradient(#fff09a,#ffcf2e)"></div>
      <div class="blob" style="background:linear-gradient(#a8f5b6,#4ed36a)"></div>
      <div class="blob" style="background:linear-gradient(#a6dbff,#3fa9ff)"></div>
    </div>
    <h1 class="logo">젤리팝</h1>
    <p class="sub">톡톡 터뜨리는 말랑 젤리 퍼즐</p>
    <button class="btn" id="playBtn">플레이</button>
    <div class="howto">
      <b>놀이 방법</b><br>
      ① 붙어 있는 <b>같은 색 젤리</b>를 터치하면 한꺼번에 터져요.<br>
      ② 많이 모아 터뜨릴수록 점수가 커져요.<br>
      ③ <b>7개 이상</b> 터뜨리면 💣 폭탄 젤리가 생겨요.<br>
      ④ 터치 횟수 안에 <b>목표 점수</b>를 넘기면 다음 레벨!
    </div>
    <div class="best" id="bestText"></div>
  </div>
</section>

<section class="screen hidden" id="result">
  <div class="card">
    <h2 class="result-title" id="resultTitle">클리어!</h2>
    <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="result-score" id="resultScore"></div>
    <button class="btn" id="nextBtn">다음 레벨</button>
    <button class="btn secondary" id="retryBtn">다시 하기</button>
  </div>
</section>

<script>
(() => {
'use strict';
const COLS = 7, ROWS = 9, BOMB = -1;
const COLORS = [
  { base:'#ff4f7b', light:'#ffb3c6', dark:'#c41f4f' }, // 딸기
  { base:'#ffcf2e', light:'#fff4b0', dark:'#d18a00' }, // 레몬
  { base:'#4ed36a', light:'#b8f7c4', dark:'#1f8f38' }, // 라임
  { base:'#3fa9ff', light:'#b5e0ff', dark:'#1665c7' }, // 소다
  { base:'#a65bff', light:'#dcc2ff', dark:'#6526c4' }, // 포도
];

// ---------- 순수 규칙 (테스트에서 직접 호출) ----------
const Logic = {
  levelConfig(lv) {
    return { colors: lv === 1 ? 4 : 5, moves: 20, target: 1200 + (lv - 1) * 400 };
  },
  inside(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; },
  group(grid, r, c) {
    const t = grid[r][c];
    if (!t) return [];
    if (t.c === BOMB) return Logic.blast(grid, r, c);
    const seen = new Set([r * COLS + c]), out = [], stack = [[r, c]];
    while (stack.length) {
      const [y, x] = stack.pop();
      out.push([y, x]);
      for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const ny = y + dy, nx = x + dx, k = ny * COLS + nx;
        if (!Logic.inside(ny, nx) || seen.has(k)) continue;
        const n = grid[ny][nx];
        if (n && n.c === t.c) { seen.add(k); stack.push([ny, nx]); }
      }
    }
    return out;
  },
  // 폭탄: 주변 3x3을 터뜨리고, 범위 안의 다른 폭탄도 연쇄로 터진다
  blast(grid, r, c) {
    const seen = new Set([r * COLS + c]), out = [[r, c]], queue = [[r, c]];
    while (queue.length) {
      const [y, x] = queue.shift();
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const ny = y + dy, nx = x + dx, k = ny * COLS + nx;
        if (!Logic.inside(ny, nx) || seen.has(k)) continue;
        seen.add(k);
        const n = grid[ny][nx];
        if (!n) continue;
        out.push([ny, nx]);
        if (n.c === BOMB) queue.push([ny, nx]);
      }
    }
    return out;
  },
  score(n, isBomb) { return isBomb ? n * 30 : 10 * n * (n - 1); },
  hasMove(grid) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (!t) continue;
      if (t.c === BOMB) return true;
      if (c + 1 < COLS && grid[r][c + 1] && grid[r][c + 1].c === t.c) return true;
      if (r + 1 < ROWS && grid[r + 1][c] && grid[r + 1][c].c === t.c) return true;
    }
    return false;
  },
  stars(score, target) { return score >= target * 1.6 ? 3 : score >= target * 1.3 ? 2 : score >= target ? 1 : 0; },
};

// ---------- 상태 ----------
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let grid = [], particles = [], floaters = [], cell = 48, dpr = 1, nextId = 1, resultTimer = 0;
const state = { mode: 'title', level: 1, score: 0, moves: 20, target: 1200, colors: 4, busy: false, sound: true, cleared: false };

const store = {
  get(k, d) { try { const v = localStorage.getItem('jellypop.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jellypop.' + k, JSON.stringify(v)); } catch (e) {} },
};
state.sound = store.get('sound', true);

function newTile(color, r, startY) {
  return { id: nextId++, c: color, y: startY === undefined ? r : startY, vy: 0, squash: 0, wob: 0, grow: 1, phase: Math.random() * 6.28 };
}
function randColor() { return Math.floor(Math.random() * state.colors); }

function fillBoard() {
  do {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid.push([]);
      for (let c = 0; c < COLS; c++) grid[r].push(newTile(randColor(), r, r - ROWS - 1));
    }
  } while (!Logic.hasMove(grid));
}

function startLevel(lv) {
  const cfg = Logic.levelConfig(lv);
  Object.assign(state, { level: lv, score: 0, moves: cfg.moves, target: cfg.target, colors: cfg.colors, busy: true, mode: 'play', cleared: false });
  clearTimeout(resultTimer);
  particles = []; floaters = [];
  fillBoard();
  hide('result'); hide('title');
  updateHud();
}

// ---------- 입력 ----------
function tap(r, c) {
  if (state.busy || state.mode !== 'play') return false;
  const t = grid[r] && grid[r][c];
  if (!t) return false;
  const isBomb = t.c === BOMB;
  const cells = Logic.group(grid, r, c);
  if (!isBomb && cells.length < 2) { t.wob = 1; sfx('nope'); return false; }

  state.moves--;
  const gained = Logic.score(cells.length, isBomb);
  state.score += gained;
  for (const [y, x] of cells) { burst(grid[y][x], y, x); grid[y][x] = null; }
  if (!isBomb && cells.length >= 7) { const b = newTile(BOMB, r); b.grow = 0; grid[r][c] = b; showToast('폭탄 젤리!'); }
  else if (cells.length >= 12) showToast('대박!');
  else if (cells.length >= 8) showToast('굉장해요!');
  floaters.push({ x: (c + .5) * cell, y: (r + .5) * cell, text: '+' + gained, life: 1 });
  sfx(isBomb ? 'boom' : 'pop', cells.length);
  try { navigator.vibrate && navigator.vibrate(isBomb ? 40 : 15); } catch (e) {}
  applyGravity();
  state.busy = true;
  updateHud();
  return true;
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) { const t = grid[r][c]; grid[r][c] = null; grid[write][c] = t; write--; }
    }
    for (let r = write, k = 1; r >= 0; r--, k++) grid[r][c] = newTile(randColor(), r, -k - .3);
  }
}

function afterSettle() {
  if (state.mode !== 'play') return;
  if (state.score >= state.target && !state.cleared) return endLevel(true);
  if (state.moves <= 0) return endLevel(state.score >= state.target);
  if (!Logic.hasMove(grid)) shuffle();
}

function shuffle() {
  showToast('섞는 중!');
  let tries = 0;
  do {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t.c !== BOMB) { t.c = randColor(); t.wob = 1; }
    }
  } while (!Logic.hasMove(grid) && ++tries < 50);
  if (!Logic.hasMove(grid)) { fillBoard(); state.busy = true; } // 거의 없는 경우: 판을 새로 채움
}

function endLevel(win) {
  state.cleared = win;
  state.mode = 'result';
  let bonus = 0;
  if (win) { bonus = state.moves * 50; state.score += bonus; }
  const stars = Logic.stars(state.score, state.target);
  const best = store.get('best', { level: 0, score: 0 });
  if (win && state.level > best.level) best.level = state.level;
  if (state.score > best.score) best.score = state.score;
  store.set('best', best);

  $('resultTitle').textContent = win ? '레벨 ' + state.level + ' 클리어!' : '아쉬워요!';
  [...$('stars').children].forEach((s, i) => s.className = i < stars ? 'on' : '');
  $('resultScore').innerHTML = '점수 <b>' + state.score.toLocaleString() + '</b> / 목표 ' + state.target.toLocaleString() +
    (bonus ? '<br>남은 터치 보너스 +' + bonus : '');
  $('nextBtn').style.display = win ? '' : 'none';
  $('retryBtn').textContent = win ? '이 레벨 다시' : '다시 도전';
  $('retryBtn').classList.toggle('secondary', win);
  sfx(win ? 'win' : 'lose');
  updateHud();
  resultTimer = setTimeout(() => { show('result'); ($('nextBtn').style.display === 'none' ? $('retryBtn') : $('nextBtn')).focus(); }, 450);
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / (rect.width / COLS));
  const r = Math.floor((e.clientY - rect.top) / (rect.height / ROWS));
  if (Logic.inside(r, c)) tap(r, c);
});

// 키보드: 방향키로 이동, Enter/Space로 터뜨리기
const cursor = { r: Math.floor(ROWS / 2), c: Math.floor(COLS / 2), on: false };
canvas.tabIndex = 0;
canvas.setAttribute('aria-label', '젤리 판. 방향키로 고르고 Enter로 터뜨려요');
canvas.addEventListener('keydown', e => {
  const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (mv) { cursor.on = true; cursor.r = Math.max(0, Math.min(ROWS - 1, cursor.r + mv[0])); cursor.c = Math.max(0, Math.min(COLS - 1, cursor.c + mv[1])); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { cursor.on = true; unlockAudio(); tap(cursor.r, cursor.c); e.preventDefault(); }
});
canvas.addEventListener('blur', () => cursor.on = false);

// ---------- 효과 ----------
function burst(t, r, c) {
  const col = t.c === BOMB ? { base:'#ffffff', light:'#ffffff' } : COLORS[t.c];
  const cx = (c + .5) * cell, cy = (r + .5) * cell;
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1.5 + Math.random() * 3) * cell;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - cell * 2, r: cell * (.08 + Math.random() * .1), color: i % 2 ? col.base : col.light, life: 1 });
  }
}
let toastTimer;
function showToast(text) {
  const el = $('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 800);
}

let audio = null;
function unlockAudio() {
  if (audio || !state.sound) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function tone(freq, to, dur, type, vol, delay) {
  const t0 = audio.currentTime + (delay || 0);
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0); o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur);
}
function sfx(kind, n) {
  if (!state.sound || !audio) return;
  try {
    if (audio.state === 'suspended') audio.resume();
    if (kind === 'pop') { const f = 420 + Math.min(n, 14) * 45; tone(f, f * 2.2, .12, 'sine', .25); tone(f * 1.5, f * .8, .08, 'triangle', .12, .04); }
    else if (kind === 'boom') { tone(180, 40, .35, 'sawtooth', .25); tone(900, 200, .2, 'square', .06); }
    else if (kind === 'nope') tone(200, 150, .08, 'square', .05);
    else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, .22, 'triangle', .2, i * .11));
    else if (kind === 'lose') [392, 330, 262].forEach((f, i) => tone(f, f * .98, .3, 'triangle', .18, i * .16));
  } catch (e) {}
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, rad) {
  ctx.beginPath();
  ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
}
// 색마다 모양도 달리해서 색을 구분하기 어려운 사람도 알아볼 수 있게 한다
function jellyShape(kind, s) {
  const h = s / 2;
  if (kind === 1) { ctx.beginPath(); ctx.arc(0, 0, h * .98, 0, 6.283); return; }
  if (kind === 2) { ctx.beginPath(); ctx.moveTo(-h, h * .75); ctx.lineTo(-h, 0); ctx.arc(0, 0, h, Math.PI, 0); ctx.lineTo(h, h * .75);
    ctx.quadraticCurveTo(h, h, h * .75, h); ctx.lineTo(-h * .75, h); ctx.quadraticCurveTo(-h, h, -h, h * .75); ctx.closePath(); return; }
  if (kind === 3) { roundRect(-h, -h, s, s, s * .12); return; }
  if (kind === 4) { ctx.beginPath(); ctx.moveTo(-h, -h * .1); ctx.lineTo(-h * .82, -h * 1.02); ctx.lineTo(-h * .3, -h * .62);
    ctx.quadraticCurveTo(0, -h * .72, h * .3, -h * .62); ctx.lineTo(h * .82, -h * 1.02); ctx.lineTo(h, -h * .1);
    ctx.bezierCurveTo(h * 1.04, h * 1.02, -h * 1.04, h * 1.02, -h, -h * .1); ctx.closePath(); return; }
  roundRect(-h, -h, s, s, s * .34);
}
function drawJelly(t, cx, cy, time) {
  const s = cell * .86;
  const breathe = Math.sin(time * 2.4 + t.phase) * .025;
  const sx = (1 + t.squash * .16 - breathe) * t.grow, sy = (1 - t.squash * .2 + breathe) * t.grow;
  ctx.save();
  ctx.translate(cx, cy + s * .5);
  if (t.wob) ctx.rotate(Math.sin(t.wob * 18) * .12 * t.wob);
  ctx.scale(sx, sy);
  ctx.translate(0, -s * .5);
  if (t.c === BOMB) {
    const g = ctx.createRadialGradient(-s * .15, -s * .18, s * .05, 0, 0, s * .5);
    g.addColorStop(0, '#6b5a8a'); g.addColorStop(1, '#1b1030');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, s * .04, s * .42, 0, 6.283); ctx.fill();
    ctx.lineWidth = s * .07;
    const ring = ctx.createLinearGradient(-s / 2, 0, s / 2, 0);
    COLORS.forEach((col, i) => ring.addColorStop(i / (COLORS.length - 1), col.base));
    ctx.strokeStyle = ring; ctx.stroke();
    ctx.strokeStyle = '#d7c39b'; ctx.lineWidth = s * .06; ctx.beginPath();
    ctx.moveTo(s * .18, -s * .3); ctx.quadraticCurveTo(s * .3, -s * .5, s * .38, -s * .42); ctx.stroke();
    const spark = .6 + Math.sin(time * 20) * .4;
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(s * .4, -s * .44, s * .08 * (1 + spark * .5), 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-s * .16, -s * .12, s * .1, s * .06, -.6, 0, 6.283); ctx.fill();
  } else {
    const col = COLORS[t.c];
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, s * .46, s * .4, s * .07, 0, 0, 6.283); ctx.fill();
    const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
    g.addColorStop(0, col.light); g.addColorStop(.45, col.base); g.addColorStop(1, col.dark);
    ctx.fillStyle = g; jellyShape(t.c, s); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-s * .18, -s * .28, s * .16, s * .08, -.35, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(s * .26, -s * .3, s * .045, 0, 6.283); ctx.fill();
    // 얼굴
    const blink = (Math.sin(time * 1.3 + t.phase * 3) > .985) ? .15 : 1;
    ctx.fillStyle = 'rgba(40,12,40,.8)';
    ctx.beginPath(); ctx.ellipse(-s * .14, s * .02, s * .055, s * .07 * blink, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * .14, s * .02, s * .055, s * .07 * blink, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(40,12,40,.8)'; ctx.lineWidth = s * .045; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, s * .12, s * .08, .25 * Math.PI, .75 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,150,.35)';
    ctx.beginPath(); ctx.ellipse(-s * .27, s * .14, s * .06, s * .035, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * .27, s * .14, s * .06, s * .035, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function resize() {
  const box = $('board').getBoundingClientRect();
  cell = Math.max(24, Math.floor(Math.min(box.width / COLS, box.height / ROWS)));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = cell * COLS + 'px'; canvas.style.height = cell * ROWS + 'px';
  canvas.width = cell * COLS * dpr; canvas.height = cell * ROWS * dpr;
}
window.addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const time = now / 1000;
  let moving = false;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r] && grid[r][c];
    if (!t) continue;
    if (t.y < r) {
      moving = true;
      t.vy += 60 * dt; t.y += t.vy * dt;
      if (t.y >= r) { t.y = r; if (t.vy > 4) t.squash = 1; t.vy = 0; }
    }
    if (t.squash > 0) t.squash = Math.max(0, t.squash - dt * 5);
    if (t.wob > 0) t.wob = Math.max(0, t.wob - dt * 2.5);
    if (t.grow < 1) { t.grow = Math.min(1, t.grow + dt * 4); moving = true; }
  }
  if (state.busy && !moving) { state.busy = false; afterSettle(); }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cell * COLS, cell * ROWS);
  ctx.fillStyle = 'rgba(255,255,255,.07)'; roundRect(0, 0, cell * COLS, cell * ROWS, cell * .4); ctx.fill();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if ((r + c) % 2) { ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(c * cell, r * cell, cell, cell); }
  }
  ctx.save(); roundRect(0, 0, cell * COLS, cell * ROWS, cell * .4); ctx.clip();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r] && grid[r][c];
    if (t && t.y > -1.2) drawJelly(t, (c + .5) * cell, (t.y + .5) * cell, time);
  }
  ctx.restore();
  if (cursor.on && document.activeElement === canvas) {
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3;
    roundRect(cursor.c * cell + 2, cursor.r * cell + 2, cell - 4, cell - 4, cell * .3); ctx.stroke();
  }
  particles = particles.filter(p => (p.life -= dt * 1.8) > 0);
  for (const p of particles) {
    p.vy += cell * 9 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  floaters = floaters.filter(f => (f.life -= dt * 1.2) > 0);
  ctx.textAlign = 'center'; ctx.font = '900 ' + Math.round(cell * .5) + 'px ' + getComputedStyle(document.body).fontFamily;
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    const y = Math.max(cell * .5, f.y - (1 - f.life) * cell * 1.2);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,10,60,.8)'; ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = '#fff'; ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ---------- 화면 ----------
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function updateHud() {
  $('level').textContent = state.level;
  $('score').textContent = state.score.toLocaleString();
  $('moves').textContent = state.moves;
  $('movesChip').classList.toggle('low', state.mode === 'play' && state.moves <= 5);
  $('bar').style.width = Math.min(100, state.score / state.target * 100) + '%';
  $('barText').textContent = state.score.toLocaleString() + ' / ' + state.target.toLocaleString();
}
function updateSoundBtn() {
  $('soundBtn').innerHTML = state.sound
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
  $('soundBtn').setAttribute('aria-pressed', String(state.sound));
}
function showTitle() {
  clearTimeout(resultTimer);
  state.mode = 'title';
  const best = store.get('best', { level: 0, score: 0 });
  $('bestText').textContent = best.score ? '최고 기록 · 레벨 ' + best.level + ' 클리어 · ' + best.score.toLocaleString() + '점' : '';
  $('playBtn').textContent = best.level ? '레벨 ' + (best.level + 1) + ' 이어하기' : '플레이';
  hide('result'); show('title');
}

$('playBtn').onclick = () => { unlockAudio(); const b = store.get('best', { level: 0 }); startLevel((b.level || 0) + 1); };
$('nextBtn').onclick = () => startLevel(state.level + 1);
$('retryBtn').onclick = () => startLevel(state.level);
$('menuBtn').onclick = showTitle;
$('soundBtn').onclick = () => { state.sound = !state.sound; store.set('sound', state.sound); if (state.sound) unlockAudio(); updateSoundBtn(); };

state.colors = 4; fillBoard();
updateSoundBtn(); updateHud(); resize(); showTitle();
requestAnimationFrame(frame);

window.__jelly = { state, get grid() { return grid; }, tap, Logic, COLS, ROWS, BOMB, startLevel };
})();
</script>
</body>
