<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd1e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="젤리팝">
<title>젤리팝 젤리마을 대소동</title>
<script src="i18n.js"></script>
<script src="lang-en.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
/* 투명 구미 젤리 스타일 (design/mockups-2.5d/png/gummy-*.png 기준) */
:root{
  color-scheme:light;
  --bg:#ffe6f1;
  --bg-2:#ffd1e8;
  --cream:#fff6e8;
  --green:#7fdc9a;
  --green-deep:#6ad28b;
  --panel:#d9548a;
  --ink:#7a2d5e;
  --ink-soft:#a04a7a;
  --text:#ffffff;
  --text-muted:#ffd1e8;
  --pink:#ff5f9d;
  --pink-dark:#b8386f;
  --purple:#6a3bbf;
  --purple-deep:#4a1d7a;
  --star:#ffd54a;
  --gold-dark:#e9a52a;
  --radius:18px;
  --font-display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Baloo 2","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#ffd1e8 0%,#ffe6f1 35%,#fff6e8 62%,#c9f3d6 73%,#7fdc9a 100%);background-color:var(--bg);color:var(--ink);font-family:var(--font-body)}
button{font-family:var(--font-display);font-weight:900;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
[hidden]{display:none!important}
img{-webkit-user-drag:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.art{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.art>img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 70%}

/* 공통 3D 사탕 버튼 */
.btn{position:relative;min-height:54px;padding:0 26px;border-radius:99px;font-size:20px;color:#fff;
  background:linear-gradient(180deg,#ff8fbd 0%,#ff5f9d 50%,#f24d8c 100%);
  box-shadow:0 7px 0 var(--pink-dark),0 12px 18px rgba(42,11,78,.22);text-shadow:0 2px 2px rgba(42,11,78,.4);transition:transform .08s,box-shadow .08s}
.btn::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:42%;border-radius:99px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pink-dark),0 4px 8px rgba(42,11,78,.2)}
.btn.light,.btn.soft{background:linear-gradient(180deg,#ffffff,#fdf6ff);color:var(--purple);text-shadow:none;
  box-shadow:0 7px 0 #d8c8ee,0 12px 18px rgba(42,11,78,.16);font-size:18px}
.btn.light:active,.btn.soft:active{box-shadow:0 2px 0 #d8c8ee}
.icon-btn{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;
  background:rgba(217,84,138,.88);border:1.5px solid rgba(255,255,255,.35);box-shadow:0 3px 6px rgba(26,10,58,.22)}
.icon-btn::before,.chip::before,.map-title::before{content:"";position:absolute;left:4px;right:4px;top:2px;height:45%;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.icon-btn svg{width:24px;height:24px;position:relative}

/* 타이틀 */
#title{align-items:center;justify-content:flex-end;text-align:center;gap:8px;padding-top:calc(env(safe-area-inset-top) + 8vh)}
#title .art img.cover{object-position:center 55%}
.title-logo{position:relative;font-family:var(--font-num);font-weight:800;line-height:.92;margin:0;transform:rotate(-3deg);
  filter:drop-shadow(0 10px 10px rgba(42,11,78,.25))}
.title-logo span{display:block;color:transparent;-webkit-text-stroke:0;
  background:linear-gradient(180deg,#fff3f8 0%,#ff8fbd 45%,#ff6fa3 50%,#ff4f8b 100%);-webkit-background-clip:text;background-clip:text;
  text-shadow:none;position:relative}
.title-logo .l1{font-size:min(23vw,92px);
  filter:drop-shadow(0 2px 0 #c2457a) drop-shadow(0 2px 0 #c2457a) drop-shadow(0 2px 0 #a33a68) drop-shadow(0 2px 0 #7a2d5e) drop-shadow(0 1px 0 #4a1d7a)}
.title-logo .l2{font-size:min(26vw,104px);margin-top:-2px;
  background:linear-gradient(180deg,#fffbe0 0%,#ffd45a 45%,#ffc53d 50%,#ff8f1f 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 0 #c2457a) drop-shadow(0 2px 0 #c2457a) drop-shadow(0 2px 0 #a33a68) drop-shadow(0 2px 0 #7a2d5e) drop-shadow(0 1px 0 #4a1d7a)}
.ribbon{position:relative;font-family:var(--font-display);font-weight:900;font-size:19px;color:#fff;padding:7px 26px;margin-top:6px;
  background:linear-gradient(180deg,#ffb3c9,#ff8fb1);text-shadow:0 2px 2px rgba(42,11,78,.45);
  box-shadow:0 6px 10px rgba(42,11,78,.25);filter:drop-shadow(0 4px 0 #c2457a)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:6px;width:18px;height:100%;background:#c2457a;z-index:-1}
.ribbon::before{left:-14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,45% 50%)}
.ribbon::after{right:-14px;clip-path:polygon(0 0,100% 0,55% 50%,100% 100%,0 100%)}
.title-cast{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;height:min(28vh,210px);margin-top:auto;width:100%}
.title-cast img{position:absolute;bottom:0;height:auto;animation:hop 1.4s ease-in-out infinite;transform-origin:50% 100%}
.title-cast img.mal{width:min(54%,220px);left:50%;margin-left:min(-27%,-110px);z-index:3;animation-duration:1.7s}
.title-cast img.f1{width:min(30%,112px);left:4%;bottom:4%;z-index:2;animation-delay:.15s}
.title-cast img.f2{width:min(31%,116px);right:3%;bottom:3%;z-index:2;animation-delay:.3s}
.title-cast img.f3{width:min(22%,84px);left:17%;bottom:38%;z-index:1;animation-delay:.45s}
.title-cast img.f4{width:min(23%,88px);right:16%;bottom:40%;z-index:1;animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.96)}40%{transform:translateY(-14px) scale(.96,1.04)}70%{transform:translateY(0) scale(1.06,.94)}}
.title-actions{position:relative;display:grid;gap:12px;width:min(100%,300px);margin-top:-8px}
.title-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.title-actions .row .btn{padding:0 10px;font-size:16px;min-height:48px}
.title-actions .btn.big{min-height:60px;font-size:24px}
.lang-btn{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 10px);right:12px;min-height:44px;padding:0 14px;border:0;border-radius:22px;
  font:900 14px var(--font-body);color:var(--pink-dark,#c2245a);background:rgba(255,255,255,.88);box-shadow:0 3px 0 rgba(90,45,145,.25);cursor:pointer}
.title-note{position:relative;font-size:13px;color:var(--ink-soft);margin-top:4px;font-weight:700}
#title.f3d .title-note{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* 프롤로그 */
#intro{padding:0}
.slide{position:absolute;inset:0;cursor:pointer}
.slide .scene{position:absolute;inset:0;overflow:hidden}
.slide .scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%}
.slide .scene img.bg3d{object-position:center 40%}
/* 해설은 위쪽 반투명 띠, 대사는 캐릭터 옆 작은 말풍선 — 그림(숲·젤리)을 가리지 않게 */
.slide .narr{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 58px);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-radius:14px;padding:7px 12px 8px;font-size:14px;line-height:1.45;color:var(--ink);box-shadow:0 4px 12px rgba(42,11,78,.12);word-break:keep-all;animation:narrIn .5s ease both}
.slide .narr b{display:block;font-family:var(--font-display);font-weight:900;color:#ff4f8b;font-size:16px}
.slide .say{position:absolute;left:12px;top:0;max-width:min(260px,calc(100% - 24px));width:max-content;background:rgba(255,255,255,.93);color:#5a2d91;border-radius:16px;padding:7px 12px 8px;font-size:15px;line-height:1.4;font-weight:700;
  box-shadow:0 6px 14px rgba(42,11,78,.22);word-break:keep-all;visibility:hidden;--tx:30px}
.slide .say.on{visibility:visible;animation:sayPop .45s cubic-bezier(.3,1.5,.5,1) .35s both}
.slide .say::after{content:"";position:absolute;left:var(--tx);margin-left:-7px;bottom:-9px;border:7px solid transparent;border-top-color:rgba(255,255,255,.93);border-bottom:0}
.slide .say.below::after{bottom:auto;top:-9px;border-top:0;border-bottom:7px solid rgba(255,255,255,.93)}
.slide .say.dark{background:rgba(58,29,110,.92);color:#ffd1e6;border:2px solid #ff4f8f}
.slide .say.dark::after{border-top-color:rgba(58,29,110,.92)}
.slide .say.dark.below::after{border-top-color:transparent;border-bottom-color:rgba(58,29,110,.92)}
.slide .say i{display:block;font-style:normal;font-family:var(--font-display);font-size:12px;color:#ff4f8b}
@keyframes sayPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes narrIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide .say.on,.slide .narr{animation:none}}
.intro-bar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;display:flex;gap:8px;z-index:2}
.intro-next{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);min-height:50px;padding:0 24px;font-size:18px;opacity:.95}
.dots{position:absolute;top:calc(env(safe-area-inset-top) + 26px);left:18px;display:flex;gap:6px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(122,45,94,.3)}.dots i.on{background:#ff4f8b}

/* 지도 (마을 로드맵) */
#map{padding:0;background:linear-gradient(180deg,#ffd7ea 0%,#fff1f6 25%,#d4f5de 30%,#8ae2a4 100%)}
.map-head{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.map-title{position:relative;flex:1;min-width:0;background:rgba(217,84,138,.88);border:1.5px solid rgba(255,255,255,.35);border-radius:16px;padding:5px 12px;line-height:1.15;color:#fff;
  box-shadow:0 3px 6px rgba(26,10,58,.22)}
.map-title small{display:block;font-size:11px;color:var(--text-muted);font-weight:700}
.map-title b{font-family:var(--font-display);font-weight:900;font-size:19px;text-shadow:0 2px 2px rgba(42,11,78,.45)}
.world-nav{position:absolute;top:50%;margin-top:-24px;z-index:6;border-radius:50%}
#mapPrev{left:6px}#mapNext{right:6px}
.map-title b.num{font-family:var(--font-num);font-weight:800;color:var(--star)}
.map-field{position:absolute;inset:0;overflow:hidden}
.map-world{position:absolute;overflow:visible}
.map-world img.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-world img.bg3d{object-fit:cover;object-position:center 45%}
.map-world svg.village{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.node{position:absolute;width:60px;height:56px;margin:-28px 0 0 -30px;display:grid;place-items:center;z-index:2;padding:0;
  font-family:var(--font-num);font-weight:800;font-size:26px;color:#5a2d91;text-shadow:0 2px 2px rgba(255,255,255,.6);transition:transform .08s}
.node img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node .n{position:relative;margin-top:-2px}
.node:active{transform:translateY(3px)}
.node.boss{width:62px;height:58px;margin:-29px 0 0 -31px}
.node.boss img.bj{position:absolute;left:50%;top:-30px;width:46px;height:auto;margin-left:-23px}
.node.next::after{content:"";position:absolute;left:-2px;right:-2px;top:0;bottom:6px;border-radius:50%;border:3px solid #fff;animation:ping 1.4s ease-out infinite;pointer-events:none;filter:drop-shadow(0 0 4px #fff)}
.node:disabled{cursor:default}
.node:disabled:active{transform:none}
.node .st{position:absolute;top:-16px;font-size:13px;color:var(--star);text-shadow:0 1px 0 #b36b00,0 0 4px #fff;letter-spacing:-1px;white-space:nowrap;font-family:var(--font-body)}
.node .nm{position:absolute;top:54px;font-size:11px;white-space:nowrap;background:#7a4bd8;color:#fff;border-radius:99px;padding:2px 9px;font-family:var(--font-display);font-weight:700;opacity:.92}
.node.boss .nm{background:#5a2d91}
.walker{position:absolute;width:64px;transform:translate(-50%,-100%);pointer-events:none;z-index:4}
.walker img{position:relative;left:-30px;top:-4px}
.walker img,.follower img{display:block;width:100%;height:auto;animation:hop 1.6s ease-in-out infinite;transform-origin:50% 100%}
.follower:nth-of-type(2n) img{animation-delay:.4s}.follower:nth-of-type(3n) img{animation-delay:.8s}
.walker.walking img,.follower.walking img{animation:hop .45s ease-in-out infinite}
.follower{position:absolute;width:30px;transform:translate(-50%,-85%);pointer-events:none;z-index:3}
.sign{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:700;font-size:12px;color:#fff;background:rgba(90,45,145,.8);
  border-radius:99px;padding:2px 10px;white-space:nowrap;pointer-events:none;z-index:1}
.hint{position:absolute;transform:translate(0,-100%);font-family:var(--font-display);font-weight:700;font-size:12px;color:#5a2d91;background:#fff;border-radius:99px;padding:5px 11px;white-space:nowrap;pointer-events:none;z-index:3;
  box-shadow:0 5px 10px rgba(42,11,78,.22)}
.hint::after{content:"";position:absolute;left:10px;bottom:-7px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;transform:skewX(20deg)}
.map-foot{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;justify-content:center;padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(180deg,rgba(46,31,122,0),rgba(46,31,122,.4))}
.map-foot .btn{font-size:19px;min-height:54px;padding:0 22px;flex:1;max-width:260px}
.map-foot .btn.light{flex:none;padding:0 18px;font-size:22px}

/* 플레이 */
#play{padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
#play.f3d{isolation:isolate;background:#16300f}
#play.f3d::before{content:"";position:absolute;inset:-24px;z-index:-1;background:var(--bg3d) center 30%/cover;filter:blur(10px) brightness(.72) saturate(1.1)}
#play.f3d #canvas{box-shadow:0 0 0 1.5px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.35)}
.hud{display:flex;align-items:center;gap:8px}
.chip{position:relative;background:rgba(217,84,138,.88);border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:4px 10px;min-height:48px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;min-width:0;color:#fff;
  box-shadow:0 3px 6px rgba(26,10,58,.22)}
.chip small{font-size:11px;color:var(--text-muted);font-weight:700;position:relative}
.chip b{font-family:var(--font-display);font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 2px rgba(42,11,78,.45);position:relative}
.chip.grow{flex:1}
.chip.friends{align-items:center;min-width:92px}
.chip.friends b{color:var(--star);font-family:var(--font-num);font-weight:800;font-size:20px}
/* 위쪽 배너 (내용은 banner.js) + 천장 하강 시간 게이지 */
#banner{flex:none;margin-top:8px;height:64px;border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;
  background:linear-gradient(180deg,rgba(255,240,248,.96),rgba(255,206,228,.94));border:2px solid rgba(255,255,255,.8);color:#5a2d91;
  box-shadow:0 4px 12px rgba(26,10,58,.3),inset 0 -4px 0 rgba(217,84,138,.18),inset 0 3px 0 rgba(255,255,255,.9)}
#banner[hidden]{display:none}
#banner::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:10px;border-radius:8px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
#banner .bimg{flex:none;width:60px;height:54px;display:grid;place-items:center}
#banner .bimg img{width:60px;height:54px;object-fit:contain}
#banner .btxt{flex:1;min-width:0;line-height:1.15}
#banner .btxt small{display:inline-block;font:800 10px var(--font-body);color:#fff;background:#ff4f8b;border-radius:8px;padding:2px 7px;margin-bottom:2px}
#banner .btxt b{display:block;font:900 15px var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner .btxt span{display:block;font:700 12px var(--font-body);color:#a0457a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner .bgo{flex:none;font:900 14px var(--font-body);color:#fff;background:linear-gradient(#ffd23f,#ff9f1c);border:0;border-radius:14px;padding:8px 12px;min-height:44px;min-width:52px;
  box-shadow:0 3px 0 #c76b0a,inset 0 2px 0 rgba(255,255,255,.6);text-shadow:0 1px 1px rgba(122,45,10,.5)}
#banner .bgo[hidden]{display:none}
#banner .bdots{position:absolute;right:12px;top:6px;display:flex;gap:4px}
#banner .bdots i{width:5px;height:5px;border-radius:50%;background:rgba(194,69,122,.3)}#banner .bdots i.on{width:12px;border-radius:3px;background:#ff4f8b}
#tbar{flex:none;margin-top:8px;height:28px;display:flex;align-items:center;gap:8px;padding:0 2px}
#tbar .tmeter{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#tbar .tic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:radial-gradient(circle at 35% 30%,#fff,#ffd1e8 60%,#f59ac4);box-shadow:0 2px 4px rgba(26,10,58,.35)}
#tbar .track{flex:1;height:16px;border-radius:9px;background:rgba(42,11,78,.55);border:2px solid rgba(255,255,255,.75);position:relative;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
#tbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(#bff7d0,#3fd27a 55%,#25a85c)}
#tbar .fill::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:3px;border-radius:2px;background:rgba(255,255,255,.7)}
#tbar.hot .fill{background:linear-gradient(#ffd0de,#ff4f8b 55%,#d81b5e)}
#tbar.hot .track{animation:tshake .18s linear infinite}
@keyframes tshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
#tbar .lbl{flex:none;min-width:92px;text-align:center;font:900 13px var(--font-body);color:#fff;background:rgba(90,45,145,.88);border-radius:12px;padding:4px 8px;border:1.5px solid rgba(255,255,255,.4)}
#tbar.hot .lbl{background:#ff4f8b}
#lives{flex:none;display:flex;align-items:center;gap:1px;height:28px;padding:0 6px;border-radius:14px;background:rgba(90,45,145,.88);border:1.5px solid rgba(255,255,255,.4)}
#lives svg{width:19px;height:18px;display:block;filter:drop-shadow(0 1px 1px rgba(42,11,78,.5))}
#lives .off{opacity:.35;filter:grayscale(1)}
#lives .lost{animation:hplost .9s ease-out}
#lives .gain{animation:hpgain .9s ease-out}
@keyframes hplost{0%{transform:scale(1.5);opacity:1;filter:none}40%{transform:scale(1.2) rotate(-12deg)}100%{transform:none}}
@keyframes hpgain{0%{transform:scale(0)}60%{transform:scale(1.5)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){#lives .lost,#lives .gain{animation:none}}
@media (max-height:700px){#banner{display:none}}
@media (prefers-reduced-motion:reduce){#tbar.hot .track{animation:none}}
#stageWrap{flex:1;min-height:0;display:grid;place-items:center;margin-top:8px;position:relative}
#canvas{display:block;touch-action:none;border-radius:18px;background:linear-gradient(180deg,#ffd1e8,#ffe6f1 40%,#fff6e8 80%,#7fdc9a 82%)}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7) rotate(-2deg);opacity:0;pointer-events:none;text-align:center;
  font-family:var(--font-display);font-weight:900;font-size:30px;color:#fff;width:max-content;max-width:94%;white-space:normal;line-height:1.15;word-break:keep-all;transition:all .25s;
  background:linear-gradient(180deg,#fff0f6 0%,#ff8fbd 45%,#ff6fa3 50%,#ff3f8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #4a1d7a) drop-shadow(0 2px 0 #4a1d7a) drop-shadow(0 6px 10px rgba(42,11,78,.35))}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
/* 첫 판 안내: 말랑이 머리 위 작은 반투명 말풍선 (판·조준선을 가리지 않게 왼쪽 아래, 몇 초 뒤 저절로 사라짐) */
.tip{position:absolute;left:10px;bottom:31%;max-width:min(52%,210px);background:rgba(255,255,255,.86);color:#5a2d91;border-radius:14px;padding:7px 11px;font-size:13px;line-height:1.4;font-weight:700;
  text-align:left;word-break:keep-all;pointer-events:none;transition:opacity .4s;box-shadow:0 6px 14px rgba(42,11,78,.2)}
.tip::after{content:"";position:absolute;left:86px;bottom:-8px;margin-left:-6px;border:7px solid transparent;border-top-color:rgba(255,255,255,.86);border-bottom:0}
.tip b{font-family:var(--font-display);font-weight:900;color:#ff4f8b}
.tip.hide{opacity:0}
/* 새 거품·방해 설명: 화면 아래쪽 말랑이 말풍선 (위쪽 거품 판이 그대로 보이게) */
.hzcard{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 150px);max-width:420px;margin:0 auto;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#5a2d91;border-radius:20px;padding:10px 12px 10px;z-index:6;
  box-shadow:0 8px 22px rgba(42,11,78,.3),inset 0 0 0 2px #ffd1e8;animation:sayPop .4s cubic-bezier(.3,1.5,.5,1) both;transform-origin:70px 100%}
.hzcard::after{content:"";position:absolute;left:76px;margin-left:-8px;bottom:-9px;border:9px solid transparent;border-top-color:rgba(255,255,255,.9);border-bottom:0}
#hzList{max-height:max(90px,calc(46vh - 110px));overflow:auto}
.hzcard h3{margin:0 0 4px;font:900 16px var(--font-body);color:#ff4f8b;text-align:center}
.hzitem{display:flex;gap:10px;align-items:center;padding:6px 2px;border-top:1px dashed #f5b8d6}
.hzitem .ic{flex:none;width:46px;height:46px;border-radius:16px;background:#fff0f7;display:grid;place-items:center;font-size:26px;overflow:hidden}
.hzitem .ic img{width:46px;height:auto}
.hzitem b{display:block;font:900 15px var(--font-body);color:#5a2d91}
.hzitem p{margin:2px 0 0;font-size:13px;line-height:1.35;color:#6a4a8a}
.hzitem p.how{color:#c2245a;font-weight:800}
.hzcard .btn{display:block;width:100%;margin-top:6px;min-height:46px}
.world-banner{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,209,232,.6) 60%,rgba(90,45,145,.5));animation:wbIn 2.2s ease forwards}
.world-banner div{text-align:center;font:900 34px var(--font-body);color:#fff;text-shadow:0 3px 0 #c2457a,0 6px 12px rgba(42,11,78,.4);animation:wobble 1s ease 2}
.world-banner small{display:block;font:800 18px var(--font-num);color:#ffd54a;text-shadow:0 2px 0 #7a2d5e}
@keyframes wbIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes wobble{0%,100%{transform:scale(1,1)}30%{transform:scale(1.15,.88)}60%{transform:scale(.92,1.08)}}

/* 결과 (클리어 / 실패) */
#result{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(180deg,#ffc2e0 0%,#ffe3ef 50%,#fff6e8 72%,#c9f3d6 73%,#7fdc9a 100%);overflow:hidden}
#result::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from -6deg at 50% 32%,rgba(255,255,255,.45) 0deg 12deg,rgba(255,255,255,0) 12deg 30deg);pointer-events:none}
#result.lose::before{opacity:.35}
#result .confetti{position:absolute;inset:0;pointer-events:none}
#result .confetti img{width:100%;height:100%;object-fit:cover;opacity:.9}
.result-hero{position:relative;display:flex;flex-direction:column;align-items:center;flex:0 1 auto;min-height:0}
.result-stars{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:min(120px,15vh)}
.result-stars span{display:block;height:80%;transition:filter .3s}
.result-stars span:nth-child(2){height:100%}
.result-stars span img{height:100%;width:auto}
.result-stars span:not(.on){filter:grayscale(1) opacity(.5)}
.result-mascot{height:min(170px,20vh);margin:4px 0 -14px}
.result-mascot img{height:100%;width:auto}
.result-card{position:relative;width:min(100%,340px);background:linear-gradient(180deg,#fff,#ffe6f1);color:var(--ink);border:3px solid #ffb3d1;border-radius:26px;padding:18px 18px 18px;text-align:center;
  box-shadow:0 14px 40px rgba(122,45,94,.28)}
.result-card h2{font-family:var(--font-display);font-weight:900;font-size:30px;margin:0;line-height:1.2;
  background:linear-gradient(180deg,#fff3f8 0%,#ff8fbd 45%,#ff6fa3 50%,#ff4f8b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #7a2d5e) drop-shadow(0 1px 0 #7a2d5e)}
.sticker{width:88px;height:88px;margin:8px auto 4px;border-radius:50%;background:linear-gradient(180deg,#fff6c8,#ffd54a);display:grid;place-items:center;border:4px solid var(--gold-dark);
  box-shadow:0 8px 18px rgba(122,45,94,.25);transform:rotate(-8deg);animation:stick .7s cubic-bezier(.3,1.6,.5,1) both}
.sticker .in{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center}
.sticker img{width:84%;height:auto}
@keyframes stick{from{transform:rotate(-200deg) scale(.2)}to{transform:rotate(-8deg) scale(1)}}
.result-msg{margin:6px 0 14px;color:var(--ink-soft);font-size:15px;line-height:1.5;font-weight:700}
.result-msg b{color:#ff7a4f;font-weight:900}
.result-score{font-size:14px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.result-score b{font-family:var(--font-num);font-weight:800;font-size:20px;color:#ff4f8b}
.result-actions{display:grid;gap:10px}
/* 점수표: 줄마다 숫자가 촤라락 올라가며 합계로 모인다 */
.tally{width:100%;max-width:290px;margin:6px auto 0;font-size:14px;font-weight:800;color:var(--ink-soft);cursor:pointer}
.trow{display:flex;justify-content:space-between;align-items:baseline;padding:1px 6px;opacity:0;transform:translateX(-12px);transition:opacity .2s,transform .2s}
.trow.in{opacity:1;transform:none}
.trow b,.ttotal b{font-family:var(--font-num);font-weight:800;color:#ff4f8b;font-variant-numeric:tabular-nums}
.trow b{font-size:17px}
.ttotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;padding:4px 6px 0;border-top:2px dashed #ffb3d1;font-size:16px;color:var(--ink)}
.ttotal b{font-size:28px;line-height:1.1}
.ttotal.done b{animation:wobble .5s ease;color:#ff3b7d;text-shadow:0 2px 0 #ffd54a}
.tbest{display:inline-block;margin-top:2px;padding:2px 10px;border-radius:12px;background:linear-gradient(180deg,#fff6c8,#ffd54a);color:#7a2d5e;font:900 13px var(--font-body);border:2px solid var(--gold-dark);animation:stick .6s cubic-bezier(.3,1.6,.5,1) both}
.result-stars span.on img{animation:starPop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes starPop{0%{transform:scale(.3) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
#result.win .result-mascot{height:min(130px,14vh)}
#result.win .sticker{width:70px;height:70px;margin:6px auto 2px}
#result.win .sticker .in{width:52px;height:52px}
#result.win .result-msg{margin:4px 0 10px;font-size:14px}
/* 게임 오버: 실패한 판 그대로 보이게 투명 → GAME OVER 글자가 통통 떨어지고 놈놈이 깔깔 → 아래에서 카드가 올라온다 */
#result.lose{background:rgba(30,8,58,.28)}
#result.lose::before,#result.lose .confetti{display:none}
.over-title{display:flex;justify-content:center;gap:1px;font:900 clamp(40px,13vw,60px)/1 "Baloo 2",var(--font-body);letter-spacing:1px;margin-bottom:-6px}
.over-title span{display:inline-block;color:#ffe066;text-shadow:2px 0 0 #5a1d6e,-2px 0 0 #5a1d6e,0 2px 0 #5a1d6e,0 -2px 0 #5a1d6e,2px 2px 0 #5a1d6e,-2px -2px 0 #5a1d6e,2px -2px 0 #5a1d6e,-2px 2px 0 #5a1d6e,0 5px 0 #c2457a,0 8px 0 #5a1d6e,0 12px 18px rgba(20,0,40,.5);
  animation:overDrop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
.over-title span.gap{width:.35em}
@keyframes overDrop{0%{opacity:0;transform:translateY(-120px) rotate(-20deg)}70%{opacity:1}100%{opacity:1;transform:none}}
#result.lose .result-mascot{height:min(150px,18vh);margin:0 0 -18px}
#result.lose .result-mascot img{animation:nomUp .6s cubic-bezier(.3,1.6,.5,1) .55s both,nomLaugh .32s ease-in-out 1.15s 5 alternate}
@keyframes nomUp{0%{opacity:0;transform:translateY(80px) scale(.4)}100%{opacity:1;transform:none}}
@keyframes nomLaugh{0%{transform:rotate(-6deg) scale(1,1)}100%{transform:rotate(6deg) scale(1.05,.94)}}
#result.lose .result-card{animation:cardUp .45s cubic-bezier(.3,1.3,.5,1) .9s both}
@keyframes cardUp{0%{opacity:0;transform:translateY(60px)}100%{opacity:1;transform:none}}
/* 0.15.1 (Owner): 게임 오버 창은 작게 위쪽에 → 판 아래쪽(말랑이·대포, 닿은 자리)이 그대로 보여 왜 졌는지 알 수 있게 */
#result.lose{justify-content:flex-start;background:linear-gradient(180deg,rgba(30,8,58,.5) 0%,rgba(30,8,58,.18) 45%,rgba(30,8,58,0) 60%);padding-top:calc(env(safe-area-inset-top) + 10px)}
#result.lose .result-mascot{display:none}
#result.lose .over-title{font-size:clamp(30px,10vw,42px);margin-bottom:6px}
#result.lose .over-title span{text-shadow:2px 0 0 #5a1d6e,-2px 0 0 #5a1d6e,0 2px 0 #5a1d6e,0 -2px 0 #5a1d6e,0 4px 0 #c2457a,0 6px 0 #5a1d6e,0 8px 12px rgba(20,0,40,.5)}
#result.lose .result-card{width:min(100%,320px);padding:10px 14px 12px;border-radius:20px;animation-delay:.5s}
#result.lose .result-card h2{font-size:22px}
#result.lose .result-score{margin-top:0}
#result.lose .result-msg{margin:4px 0 10px;font-size:13px;line-height:1.4}
#result.lose .result-actions{grid-template-columns:1fr 1fr;gap:8px}
#result.lose .result-actions .btn{min-height:46px;padding:0 10px;font-size:17px}
#result.lose #resultAd{grid-column:1 / -1}
/* 작은 휴대폰: 점수표가 길면 말랑이 그림을 빼고 별·스티커를 줄여 별이 가려지지 않게 */
@media (max-height:740px){#result.win .result-mascot{display:none}#result.win .result-stars{height:min(84px,13vh);margin-bottom:6px}
  #result.win .sticker{width:52px;height:52px;margin:4px auto 0}#result.win .sticker .in{width:40px;height:40px}
  #result.win .result-card{padding:12px 14px}#result.win .result-card h2{font-size:24px}.trow b{font-size:15px}.ttotal b{font-size:22px}#result.win .result-msg{margin:2px 0 8px;font-size:13px}}
@media (max-height:600px){#result.win #resultSticker{display:none}.tally{font-size:12px}}
@media (prefers-reduced-motion:reduce){.over-title span,#result.lose .result-mascot img,#result.lose .result-card{animation:none}}
.result-actions .btn{font-size:18px;min-height:50px}

/* 스티커 북 */
#book{background:linear-gradient(180deg,#ffe6f1,#fff6e8 70%,#c9f3d6);color:var(--ink)}
.book-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.book-head h2{flex:1;margin:0;font-family:var(--font-display);font-weight:900;font-size:24px;color:#ff4f8b;text-shadow:0 2px 0 #fff}
.book-head .count{font-family:var(--font-num);font-weight:800;background:var(--panel);color:#fff;border-radius:99px;padding:2px 12px}
.book-head .icon-btn{background:#fff;border-color:#ffb3d1;color:var(--purple)}
.book-rows{display:grid;gap:10px;overflow:auto;padding-bottom:10px}
.book-row{position:relative;background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 0 #ffd1e6,0 8px 16px rgba(122,45,94,.12)}
.book-row h3{margin:0 0 6px;font-family:var(--font-display);font-weight:900;font-size:16px;color:#ff4f8b}
.book-row h3 small{font-family:var(--font-body);font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:50%;border:2px dashed #ffb3d1;display:grid;place-items:center;color:#e3a7c4;font-family:var(--font-num);font-weight:800;font-size:16px;position:relative;background:#fff7fb}
.cell.got{border:3px solid var(--star);background:linear-gradient(180deg,#fffbe9,#fff)}
.cell img{width:92%;height:auto}
.cell .nm{position:absolute;bottom:-14px;font-size:10px;color:var(--ink-soft);white-space:nowrap;font-family:var(--font-body);font-weight:700}
.book-row .cells{padding-bottom:12px}
.stamp{position:absolute;right:8px;top:6px;font-family:var(--font-display);font-weight:900;color:#ff4f8f;border:3px solid #ff4f8f;border-radius:10px;padding:0 8px;transform:rotate(10deg);font-size:15px;background:#fff}
.book-foot{margin-top:auto;text-align:center;font-size:13px;color:var(--ink-soft);font-weight:700}

@media (max-height:700px){.node{width:50px;height:46px;margin:-23px 0 0 -25px;font-size:22px}.node.boss{width:52px;height:48px;margin:-24px 0 0 -26px}.node.boss img.bj{width:40px;margin-left:-20px;top:-26px}.node .nm{top:44px;font-size:10px}.walker{width:54px}.title-cast{height:min(30vh,200px)}}
@media (prefers-reduced-motion:reduce){.title-cast img,.walker img,.follower img,.sticker,.node.next::after{animation:none!important}}
.sound-hint{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:40;min-height:48px;padding:0 16px;border-radius:99px;
  font:900 16px var(--font-body);color:#fff;background:linear-gradient(#ff8fbd,#f24d8c);box-shadow:0 5px 0 var(--pink-dark),0 8px 16px rgba(42,11,78,.3);animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.sound-hint{animation:none}}
.sound-hint.calm{animation:none;opacity:.85;font-size:14px;min-height:44px}
/* 광고 보고 이어하기 · 후원 팩 (monetize.js) */
.btn.ad{background:linear-gradient(180deg,#7be495,#2fbf71);box-shadow:0 5px 0 #1d8a50,0 8px 16px rgba(42,11,78,.2)}
.btn.ad:active{box-shadow:0 2px 0 #1d8a50}
.btn.ad small{display:block;font-size:12px;line-height:1;opacity:.9}
.title-actions .shop-btn{min-height:44px;font-size:16px;padding:0 18px}
.shop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(42,11,78,.55);padding:16px}
.shop[hidden]{display:none}
.shop-card{width:min(100%,340px);background:linear-gradient(180deg,#fff,#ffe6f1);border:3px solid #ffb3d1;border-radius:24px;padding:18px;text-align:center;color:var(--ink);display:grid;gap:10px}
.shop-card h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:24px;color:#ff4f8b}
.shop-item{background:#fff;border-radius:16px;padding:12px;display:grid;gap:6px;box-shadow:0 4px 0 #ffd1e6}
.shop-item b{font-size:18px}.shop-item small{color:var(--ink-soft);font-weight:700}
.shop-card .btn{min-height:46px;font-size:17px}
.shop-note{font-size:12px;color:var(--ink-soft);font-weight:700;margin:0}
.shop-msg{font-size:14px;color:#ff4f8b;font-weight:800;margin:0;min-height:0}.shop-msg:empty{display:none}
</style>
</head>
<body>
<div id="app">
  <!-- 타이틀 -->
  <section class="screen" id="title">
    <div class="art" id="titleArt" aria-hidden="true"></div>
    <h1 class="title-logo"><span class="l1">JELLY</span><span class="l2">POP!</span></h1>
    <button class="lang-btn" id="langBtn" type="button"></button>
    <div class="ribbon">젤리마을 대소동</div>
    <div class="title-cast" id="titleCast" aria-hidden="true"></div>
    <div class="title-actions">
      <button class="btn big" id="startBtn">모험 시작!</button>
      <div class="row">
        <button class="btn light" id="bookBtn1">스티커 북</button>
        <button class="btn light" id="storyBtn">이야기 다시 보기</button>
      </div>
      <button class="btn light shop-btn" id="shopBtn" hidden>🎁 후원 팩</button>
    </div>
    <div class="title-note" id="titleNote"></div>
  </section>

  <!-- 프롤로그 -->
  <section class="screen" id="intro" hidden>
    <div class="dots" id="dots"></div>
    <div class="intro-bar"><button class="btn light" id="skipBtn" style="min-height:44px;font-size:15px;padding:0 16px">건너뛰기</button></div>
    <div id="slides"></div>
  </section>

  <!-- 지도 -->
  <section class="screen" id="map" hidden>
    <div class="map-field" id="mapField">
      <div class="map-world" id="mapWorld"></div>
    </div>
    <div class="map-head" id="mapHead">
      <button class="icon-btn" id="mapHome" aria-label="처음 화면으로"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3.5l9 7.5h-2.5v9h-5v-6h-3v6h-5v-9H3z"/></svg></button>
      <div class="map-title"><small id="mapWorldNo">월드 1</small><b id="mapWorldName">젤리마을</b></div>
      <div class="map-title" style="flex:none;text-align:center"><small>스티커</small><b class="num" id="mapStickers">0 / 30</b></div>
    </div>
    <button class="icon-btn world-nav" id="mapPrev" aria-label="이전 월드" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon-btn world-nav" id="mapNext" aria-label="다음 월드" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="map-foot" id="mapFoot">
      <button class="btn" id="mapPlay">스테이지 1 시작</button>
      <button class="btn light" id="bookBtn2" aria-label="스티커 북">📖</button>
    </div>
  </section>

  <!-- 플레이 -->
  <section class="screen" id="play" hidden>
    <div class="hud">
      <button class="icon-btn" id="playMap" aria-label="지도로"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3.5l9 7.5h-2.5v9h-5v-6h-3v6h-5v-9H3z"/></svg></button>
      <div class="chip grow"><small id="hudStage">스테이지 1</small><b id="hudName">마을 광장</b></div>
      <div class="chip friends"><small id="hudGoalLabel">구할 친구</small><b id="hudGoal">0 / 1</b></div>

<script>
(() => {
'use strict';
const Art = window.Gummy, AC = Art.C;
// 언어: 정적 HTML 글자를 사전으로 바꾸고, 타이틀의 언어 버튼은 다른 언어로 바꾼다 (i18n.js)
JellyI18n.apply(document.body);
document.title = T('젤리팝 젤리마을 대소동');
{
  const other = JellyI18n.lang === 'ko' ? 'en' : 'ko';
  const lb = document.getElementById('langBtn');
  lb.textContent = other === 'en' ? 'English' : '한국어';
  lb.lang = other;
  lb.setAttribute('aria-label', other === 'en' ? 'Play in English' : '한국어로 하기');
  lb.onclick = () => JellyI18n.set(other);
}
// ============================================================
// 기본 값
// ============================================================
const W = 360, H = 620;                       // 게임 판 논리 크기 (화면에 맞춰 확대·축소)
const R = 18, D = R * 2, ROW_H = R * Math.sqrt(3);
const PIVOT = { x: 180, y: 556 };              // 대포 회전 중심
const FLOOR_Y = 512, DEADLINE = 478;           // 바닥, 터치 구역 윗선 (대포 근처만 터치)
// 게임 오버 선 (0.15.0 Owner: "완전 바닥·말랑이·대포에 닿을 때만"): 거품 아래쪽이 말랑이 머리·대포 몸통 높이에 닿으면 생명 -1
const LOSE_Y = 532;   // 0.15.1부터는 선이 아니라 '닿으면' 실패 (touchHit). 이 값은 말랑이 머리·대포 몸통 높이 참고값
const MAX_LIVES = 5, START_LIVES = 3;
const SPEED = 820;                             // 발사 속도 (px/초)
const MIN_A = -Math.PI + 0.16, MAX_A = -0.16;  // 조준 각도 한계
const COLORS = {
  r: { base: '#ff5f8a', light: '#ffd0de', dark: '#c8245a' },
  y: { base: '#ffd23f', light: '#fff4bf', dark: '#d18a00' },
  g: { base: '#5ed46a', light: '#d2f7d6', dark: '#1f8f38' },
  b: { base: '#4fb4ff', light: '#cde9ff', dark: '#1665c7' },
  p: { base: '#a76bff', light: '#e4d2ff', dark: '#6526c4' },
  o: { base: '#ff8c3a', light: '#ffe0c4', dark: '#c45a0a' },
  w: { base: '#ffffff', light: '#ffffff', dark: '#c9b8ff' },   // 무지개(수정) — 그림은 따로
  z: { base: '#4a4466', light: '#ffb347', dark: '#2a2440' },   // 폭탄 거품 (색 없음, 닿으면 주변이 터짐)
  q: { base: '#f2eaff', light: '#ffe27a', dark: '#a76bff' },   // 랜덤 거품 (닿으면 좋은/나쁜 효과 무작위)
};
const BLAST2 = (1.8 * D) ** 2;    // 폭탄 범위: 거품 중심 사이 거리 1.8칸 안 (이웃 6개 + 그 바깥 6개)

// 스테이지 표(30개)·방해 요소 설명은 stages.js
const { STAGES, WORLDS, INFO: HZ_INFO, keysOf } = window.JellyStages;
const NST = STAGES.length;
const MAL = AC.mal;   // 말랑이 색

// 같은 결과가 나오게 하는 난수 (테스트용 ?seed=숫자)
const seedParam = new URLSearchParams(location.search).get('seed');
let rand = Math.random;
function seedRandom(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
if (seedParam !== null) seedRandom(Number(seedParam) || 1);

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('jellypop2.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jellypop2.' + k, JSON.stringify(v)); } catch (e) {} },
};
// 진행 상황: 스테이지별 별, 받은 스티커, 프롤로그 본 적 있는지
const P = Object.assign({ stars: [], stickers: {}, seenIntro: false, at: 0, seenHz: {}, seenStory: {} }, store.get('progress', {}));
while (P.stars.length < NST) P.stars.push(0);   // 월드 1(6칸)만 있던 저장도 30칸으로
P.seenHz = P.seenHz || {};
P.seenStory = P.seenStory || {};
// 생명 (0.15.0): 3개로 시작, 거품이 바닥(말랑이·대포)에 닿을 때마다 1개씩. 다 쓰면 게임 오버 → 다시 하면 3개. 보너스 스테이지로 최대 5개까지
if (!(P.lives >= 0)) P.lives = START_LIVES;
function saveP() { store.set('progress', P); }
let soundOn = store.get('sound', true);

// ============================================================
// HTML 쪽 그림 도우미 (img 태그로 굽는 구미 젤리 그림)
// ============================================================
const jellyBox = r => ({ x: -1.6 * r, y: -1.25 * r, w: 3.2 * r, h: 2.5 * r });   // 3D 그림(±1.2r)의 귀가 잘리지 않게 위로 여유
function jellyImg(color, r, opt = {}, attrs = '') { return Art.img(Art.jelly(0, 0, r, color, opt), jellyBox(r), attrs); }
const artCache = {};
function cachedArt(key, make) { return artCache[key] || (artCache[key] = make()); }

// ============================================================
// 거품 판 규칙 (순수 함수 → 테스트에서 직접 확인)
// ============================================================
const Board = {
  // parity: 판 맨 위에 줄이 새로 생기면 홀짝이 바뀐다
  odd(b, r) { return ((r + b.parity) & 1) === 1; },
  cols(b, r) { return Board.odd(b, r) ? 9 : 10; },
  pos(b, r, c) { return { x: R + c * D + (Board.odd(b, r) ? R : 0), y: b.y0 + R + r * ROW_H }; },
  get(b, r, c) { return r >= 0 && r < b.rows.length && c >= 0 && c < Board.cols(b, r) ? b.rows[r][c] : null; },
  neighbors(b, r, c) {
    const o = Board.odd(b, r);
    const list = o ? [[r-1,c],[r-1,c+1],[r,c-1],[r,c+1],[r+1,c],[r+1,c+1]] : [[r-1,c-1],[r-1,c],[r,c-1],[r,c+1],[r+1,c-1],[r+1,c]];
    return list.filter(([y, x]) => y >= 0 && x >= 0 && x < Board.cols(b, y));
  },
  ensureRow(b, r) { while (b.rows.length <= r) b.rows.push(new Array(Board.cols(b, b.rows.length)).fill(null)); },
  // 특수 칸 만들기: kind → 칸 (c: 색, k: 종류). 수정 = 색 'w'(아무 색과 짝), 쿠키·방해 거품 = 색 없는 solid
  cell(color, kind) {
    if (kind === 'c') return { c: 'w', k: 'c' };
    if (kind === 'z' || kind === 'q') return { c: kind, k: kind };   // 폭탄·랜덤: 색이 없어 짝이 안 되고, 쏜 거품이 닿으면 발동
    if (kind === 'k' || kind === 'n') return { c: kind, k: kind, solid: true };
    const cell = { c: color };
    if (kind && kind !== '.') cell.k = kind;
    return cell;
  },
  fromRows(strs, y0, kinds, palette) {
    const b = { rows: [], parity: 0, y0, friendCount: 0, palette: palette || 'rybgp' };
    strs.forEach((s, r) => {
      const row = new Array(Board.cols(b, r)).fill(null);
      [...s].forEach((ch, c) => {
        if (ch === '.' || c >= row.length) return;
        const kind = kinds && kinds[r] ? kinds[r][c] : '.';
        const lower = ch.toLowerCase();
        if (ch !== lower) row[c] = { c: lower, friend: b.friendCount++ };
        else row[c] = Board.cell(lower, kind);
      });
      b.rows.push(row);
    });
    return b;
  },
  // 짝이 될 수 있는 칸: 같은 색이거나 수정. 쿠키·얼음은 짝이 안 됨
  matches(n, color) { return !!n && !n.solid && n.k !== 'i' && !Board.trigger(n) && (n.c === color || n.c === 'w'); },
  trigger(n) { return !!n && (n.k === 'z' || n.k === 'q'); },
  group(b, r, c) {
    const start = Board.get(b, r, c); if (!start || start.solid || start.k === 'i' || Board.trigger(start)) return [];
    const color = start.c;
    const seen = new Set([r + ',' + c]), out = [[r, c]], stack = [[r, c]];
    while (stack.length) {
      const [y, x] = stack.pop();
      for (const [ny, nx] of Board.neighbors(b, y, x)) {
        const k = ny + ',' + nx, n = Board.get(b, ny, nx);
        if (!seen.has(k) && Board.matches(n, color)) { seen.add(k); out.push([ny, nx]); stack.push([ny, nx]); }
      }
    }
    return out;
  },
  // 천장(0번 줄)과 이어지지 않은 거품 목록
  floating(b) {
    const seen = new Set(), stack = [];
    for (let c = 0; c < Board.cols(b, 0); c++) if (Board.get(b, 0, c)) { seen.add('0,' + c); stack.push([0, c]); }
    while (stack.length) {
      const [y, x] = stack.pop();
      for (const [ny, nx] of Board.neighbors(b, y, x)) {
        const k = ny + ',' + nx;
        if (!seen.has(k) && Board.get(b, ny, nx)) { seen.add(k); stack.push([ny, nx]); }
      }
    }
    const out = [];
    b.rows.forEach((row, r) => row.forEach((cell, c) => { if (cell && !seen.has(r + ',' + c)) out.push([r, c]); }));
    return out;
  },
  // 판에 남은 "쏠 수 있는 색" (수정·쿠키·방해 거품은 빼고)
  colorsOnBoard(b) { const s = new Set(); b.rows.forEach(row => row.forEach(cell => cell && !cell.solid && cell.c !== 'w' && !Board.trigger(cell) && s.add(cell.c))); return s; },
  count(b) { let n = 0; b.rows.forEach(row => row.forEach(cell => cell && n++)); return n; },
  lowestY(b) { let y = -1; b.rows.forEach((row, r) => row.forEach((cell, c) => { if (cell) y = Math.max(y, Board.pos(b, r, c).y); })); return y; },
  // 붙을 칸 찾기: 부딪힌 자리에서 가장 가까운 빈칸 (천장 줄이거나 이웃이 있는 칸)
  snap(b, x, y) {
    const r0 = Math.max(0, Math.round((y - b.y0 - R) / ROW_H));
    let best = null, bd = Infinity;
    for (let r = Math.max(0, r0 - 1); r <= r0 + 1; r++) {
      for (let c = 0; c < Board.cols(b, r); c++) {
        if (Board.get(b, r, c)) continue;
        const p = Board.pos(b, r, c), d = (p.x - x) ** 2 + (p.y - y) ** 2;
        const ok = r === 0 || Board.neighbors(b, r, c).some(([ny, nx]) => Board.get(b, ny, nx));
        if (ok && d < bd) { bd = d; best = [r, c]; }
      }
    }
    return best;
  },
  // 발사 길 따라가기: 벽·장애물에 튕기고, 천장이나 거품에 닿으면 멈춤 → 멈춘 자리, 지나간 점들, 처음 튕긴 점 번호
  // 거미줄에 걸리면 web, 장애물에 튕겨 바닥 선 아래로 돌아오면 lost (둘 다 판에 안 붙음)
  trace(b, angle, maxLen = 2400, from) {
    let x = from ? from.x : PIVOT.x + Math.cos(angle) * 34, y = from ? from.y : PIVOT.y + Math.sin(angle) * 34;
    let vx = Math.cos(angle), vy = Math.sin(angle), len = 0, bounceAt = -1;
    const pts = [], hitR2 = (D * 0.82) ** 2;
    const bubbles = [];
    b.rows.forEach((row, r) => row.forEach((cell, c) => cell && bubbles.push(Board.pos(b, r, c))));
    while (len < maxLen) {
      x += vx * 3; y += vy * 3; len += 3;
      if (x < R) { x = 2 * R - x; vx = -vx; if (bounceAt < 0) bounceAt = pts.length; }
      if (x > W - R) { x = 2 * (W - R) - x; vx = -vx; if (bounceAt < 0) bounceAt = pts.length; }
      const oh = Obs.hit(b.obs, x, y);
      if (oh && oh.o.t === 'web') { pts.push({ x, y }); return { x, y, pts, bounceAt, web: oh.o }; }
      if (oh) { const p = { x, y }, v = { x: vx, y: vy }; Obs.bounce(p, v, oh); x = p.x; y = p.y; vx = v.x; vy = v.y; if (bounceAt < 0) bounceAt = pts.length; }
      if (vy > 0 && y > DEADLINE) { pts.push({ x, y }); return { x, y, pts, bounceAt, lost: true }; }
      if (len % 15 < 3) pts.push({ x, y });
      if (y - R <= b.y0) return { x, y, pts, bounceAt };
      for (const p of bubbles) if ((p.x - x) ** 2 + (p.y - y) ** 2 < hitR2) return { x, y, pts, bounceAt };
    }
    return { x, y, pts, bounceAt };
  },
  clone(b) { return { rows: b.rows.map(row => row.map(c => c && { ...c })), parity: b.parity, y0: b.y0, friendCount: b.friendCount, palette: b.palette, obs: b.obs }; },
  // 무지개 거품: 붙은 자리에서 가장 크게 이어지는 이웃 색으로 바뀐다 (이웃에 색이 없으면 수정으로 남음)
  bestColor(b, r, c) {
    let best = 'w', size = 0;
    const cand = new Set(Board.neighbors(b, r, c).map(([y, x]) => Board.get(b, y, x)).filter(n => n && !n.solid && n.c !== 'w' && !Board.trigger(n)).map(n => n.c));
    for (const col of cand) {
      b.rows[r][c] = { c: col };
      const n = Board.group(b, r, c).length;
      if (n > size) { size = n; best = col; }
    }
    b.rows[r][c] = null;
    return best;
  },
  // 놓기 + 터뜨리기 + 떨어뜨리기 (판을 바꾸고 결과를 돌려줌)
  // 폭탄 터뜨리기: 폭탄 자리에서 1.8칸 안의 칸 전부(색·종류 상관없이). 범위 안 폭탄은 이어서 터진다 → 터질 칸 'r,c' 집합
  blast(b, starts) {
    const hit = new Set(), queue = [...starts], done = new Set();
    while (queue.length) {
      const [r, c] = queue.shift(), key = r + ',' + c;
      if (done.has(key)) continue;
      done.add(key); hit.add(key);
      const p = Board.pos(b, r, c);
      b.rows.forEach((row, y) => row.forEach((cell, x) => {
        if (!cell) return;
        const q = Board.pos(b, y, x);
        if ((q.x - p.x) ** 2 + (q.y - p.y) ** 2 > BLAST2) return;
        hit.add(y + ',' + x);
        if (cell.k === 'z' && !done.has(y + ',' + x)) queue.push([y, x]);
      }));
    }
    return hit;
  },
  place(b, r, c, color) {
    Board.ensureRow(b, r);
    if (color === 'w') color = Board.bestColor(b, r, c);
    b.rows[r][c] = color === 'w' ? { c: 'w', k: 'c' } : color === 'z' ? { c: 'z', k: 'z' } : { c: color };
    const group = color === 'z' ? [] : Board.group(b, r, c);
    const out = { popped: [], dropped: [], unstuck: [], thawed: [], recolored: [], wobbled: [], color, bombs: 0, randoms: [] };
    // 쏜 거품이 닿은 폭탄(쏜 거품이 폭탄이면 그 자리)과 랜덤 거품
    const near0 = Board.neighbors(b, r, c).filter(([y, x]) => Board.trigger(Board.get(b, y, x)));
    const bombs = near0.filter(([y, x]) => b.rows[y][x].k === 'z');
    if (color === 'z') bombs.push([r, c]);
    const blast = bombs.length ? Board.blast(b, bombs) : new Set();
    near0.filter(([y, x]) => b.rows[y][x].k === 'q').forEach(([y, x]) => blast.add(y + ',' + x));
    if (group.length >= 3 || blast.size) {
      const seen = new Set();
      // 끈적 거품은 시럽만 벗겨지고 남는다 (폭탄에는 시럽째 터짐)
      if (group.length >= 3) group.forEach(([y, x]) => {
        const cell = b.rows[y][x];
        if (blast.has(y + ',' + x)) return;
        seen.add(y + ',' + x);
        if (cell.k === 's') { delete cell.k; out.unstuck.push({ r: y, c: x }); }
        else out.popped.push({ r: y, c: x, cell });
      });
      blast.forEach(k => {
        if (seen.has(k)) return;
        const [y, x] = k.split(',').map(Number), cell = b.rows[y][x];
        if (cell) out.popped.push({ r: y, c: x, cell });
      });
      out.bombs = out.popped.filter(p => p.cell.k === 'z').length;
      out.popped.forEach(p => { b.rows[p.r][p.c] = null; });
      // 터진 자리 옆: 얼음은 녹고, 버섯은 이웃 색을 바꾼다
      const near = new Set();
      out.popped.forEach(p => Board.neighbors(b, p.r, p.c).forEach(([y, x]) => near.add(y + ',' + x)));
      near.forEach(k => { const [y, x] = k.split(',').map(Number), n = Board.get(b, y, x); if (n && n.k === 'i') { delete n.k; out.thawed.push({ r: y, c: x }); } });
      out.popped.filter(p => p.cell.k === 'm').forEach(p => Board.neighbors(b, p.r, p.c).forEach(([y, x]) => {
        const n = Board.get(b, y, x);
        if (n && !n.solid && n.c !== 'w' && n.friend === undefined && n.k !== 'i' && !Board.trigger(n) && n.c !== p.cell.c) { n.c = p.cell.c; out.recolored.push({ r: y, c: x }); }
      }));
      out.dropped = Board.floating(b).map(([y, x]) => ({ r: y, c: x, cell: b.rows[y][x] }));
      out.dropped.forEach(d => { b.rows[d.r][d.c] = null; });
    } else {
      // 안 터지면 옆 흔들 푸딩이 출렁이며 다음 색으로
      Board.neighbors(b, r, c).forEach(([y, x]) => {
        const n = Board.get(b, y, x);
        if (n && n.k === 'u') { const pal = b.palette; n.c = pal[(pal.indexOf(n.c) + 1) % pal.length]; out.wobbled.push({ r: y, c: x }); }
      });
    }
    out.gifts = [...out.popped, ...out.dropped].filter(p => p.cell.k === 'g').length;
    out.randoms = [...out.popped, ...out.dropped].filter(p => p.cell.k === 'q').map(p => ({ r: p.r, c: p.c }));
    out.fireflies = [...out.popped, ...out.dropped].filter(p => p.cell.k === 'f').length;
    out.bonus = [...out.popped, ...out.dropped].filter(p => p.cell.k === 'h').length;
    while (b.rows.length && b.rows[b.rows.length - 1].every(x => !x)) b.rows.pop();
    return out;
  },
  // 맨 위에 새 줄 추가 (보스가 던지는 거품). kindOf(i) → 특수 종류
  pushTop(b, colors, kindOf) {
    b.parity ^= 1;
    const row = new Array(Board.cols(b, 0)).fill(null).map((_, i) => Board.cell(colors[Math.floor(rand() * colors.length)], kindOf ? kindOf(i) : null));
    b.rows.unshift(row);
  },
  // 아래에서 곧장 위로 올라가 붙기 (캐러멜 방울·방해 거품). 터뜨리지 않고 붙기만 한다
  stickFrom(b, x, cell) {
    const tr = Board.trace({ ...b, obs: null }, -Math.PI / 2, 2400, { x, y: DEADLINE - R });   // 장애물은 무시하고 곧장 위로
    const at = Board.snap(b, tr.x, tr.y);
    if (!at) return null;
    Board.ensureRow(b, at[0]);
    b.rows[at[0]][at[1]] = cell;
    return at;
  },
  // 한 줄을 dir(+1 오른쪽 / -1 왼쪽)으로 한 칸 돌리기 (컨베이어)
  shiftRow(b, r, dir) {
    const row = b.rows[r]; if (!row) return false;
    if (dir > 0) row.unshift(row.pop()); else row.push(row.shift());
    return true;
  },
  // 놈놈이 훔쳐도 다른 거품이 떨어지지 않는 칸 (친구·쿠키 제외)
  stealable(b) {
    const out = [];
    b.rows.forEach((row, r) => row.forEach((cell, c) => {
      if (!cell || cell.solid || cell.friend !== undefined || Board.trigger(cell) || cell.k === 'h') return;   // 폭탄·랜덤·보너스는 안 훔침
      b.rows[r][c] = null;
      if (!Board.floating(b).length) out.push([r, c]);
      b.rows[r][c] = cell;
    }));
    return out;
  },
};

// 지형 장애물 (0.14.0): 판 아래 빈 곳에 놓여 날아가는 거품을 방해한다. 친구·판 칸은 건드리지 않는다
//   branch 나뭇가지(닿으면 튕김) · web 솜사탕 거미줄(한 발을 붙잡고 찢어짐) · fan 풍차 날개(빙글빙글 돌며 튕김)
// 판이 내려와 닿으면 부서져 없어진다 (Obs.crush)
const OBS_T = { branch: 7, web: 5, fan: 6 };   // 굵기(반지름 px)
const Obs = {
  // stages.js 의 obs 칸 → 판 위 장애물 (a: 기울기°, spin: 초당 도는 각도°)
  make(list) { return (list || []).map(o => ({ t: o.t, x: o.x, y: o.y, len: o.len, a: (o.a || 0) * Math.PI / 180, spin: (o.spin || 0) * Math.PI / 180, hitT: 9, gone: false })); },
  ends(o) { const h = o.len / 2, cx = Math.cos(o.a) * h, cy = Math.sin(o.a) * h; return [o.x - cx, o.y - cy, o.x + cx, o.y + cy]; },
  // 거품 중심 (x, y)가 장애물에 닿았나 → 닿은 장애물과 바깥쪽 방향(nx, ny), 파고든 깊이
  hit(obs, x, y) {
    if (!obs) return null;
    for (const o of obs) {
      if (o.gone) continue;
      const [x1, y1, x2, y2] = Obs.ends(o), dx = x2 - x1, dy = y2 - y1;
      const k = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy)));
      const px = x1 + dx * k, py = y1 + dy * k, d = Math.hypot(x - px, y - py), lim = R * .8 + OBS_T[o.t];
      if (d < lim) return { o, nx: d ? (x - px) / d : 0, ny: d ? (y - py) / d : 1, push: lim - d };
    }
    return null;
  },
  // 튕기기: 들어오던 방향만 거울처럼 뒤집고, 파고든 만큼 밖으로 밀어낸다.
  // 아래쪽으로 튕기게 되면 대신 가지 끝 쪽 위로 비스듬히 미끄러져 나간다 (아래에서 맞혀도 거품을 잃지 않음)
  bounce(p, v, h) {
    const dot = v.x * h.nx + v.y * h.ny;
    if (dot < 0) { v.x -= 2 * dot * h.nx; v.y -= 2 * dot * h.ny; }
    const sp = Math.hypot(v.x, v.y);
    if (v.y > -.4 * sp) { const side = Math.sign(p.x - h.o.x) || Math.sign(v.x) || 1; v.x = side * .87 * sp; v.y = -.5 * sp; }
    p.x += h.nx * (h.push + .5); p.y += h.ny * (h.push + .5);
  },
  // 판이 닿으면 부서지는 높이 (도는 풍차는 날개가 그리는 원 전체)
  top(o) { if (o.spin) return o.y - o.len / 2 - OBS_T[o.t]; const [, y1, , y2] = Obs.ends(o); return Math.min(y1, y2) - OBS_T[o.t]; },
};
