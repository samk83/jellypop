// 게임 상태
// ============================================================
let G = null;
function newGame(stageNo) {
  const st = STAGES[stageNo - 1];
  const b = Board.fromRows(st.rows, st.boss ? 84 : 10, st.kinds, st.colors);
  b.obs = Obs.make(st.obs);
  G = {
    st, b, fired: 0, queue: [], angle: -Math.PI / 2, crank: 0, aiming: false,
    state: 'aim', moving: null, fx: [], falls: [], pops: [], texts: [], rescues: [], wobbles: [],
    saved: 0, need: st.boss ? 1 : b.friendCount, bossHp: st.boss ? st.boss.hp : 0, bossHit: 0,
    shotCount: 0, score: 0, settleT: 0, queueShift: 0, y0Target: b.y0, y0Start: b.y0, continues: 0, swapT: 0, outcome: null, time: 0,
    paused: false, hz: makeHz(st),
    tally: { pop: 0, popPts: 0, drop: 0, dropPts: 0, nom: 0, nomPts: 0 }, cameo: null, cameoAt: -99,
    jigs: [], face: null, mood0: 'happy', streak: 0, bonusTicket: false,
  };
  fillQueue();
  gaugeLast = '';
}
// 조준선 길이(px): 월드(테마)마다 한 단계씩 뚜렷하게 짧아진다. 월드 1은 끝까지 (0.14.0 Owner: "다음 테마로 갈수록 짧게")
const AIM_BY_WORLD = [Infinity, 400, 300, 210, 140];
function aimLimit(st) { return AIM_BY_WORLD[st.world - 1]; }
// 방해 요소 상태 (설정 cfg 는 보스 단계가 바뀌면 늘어난다)
function makeHz(st) {
  const cfg = { ...st.hz };
  if (st.boss && st.boss.minions && !cfg.nom) cfg.nom = st.boss.minions;   // 부두목전: 처음부터 놈놈 부하가 나온다
  const h = { cfg, misses: 0, cloud: null, nom: null, aimBoost: 0, warn: null, ceilWarn: 0, phase: 0, red: false,
    clock: cfg.clock ? cfg.clock.sec : null, shotT: cfg.shotTimer || 0, dropT: 0,
    cloudNext: cfg.cloud ? cfg.cloud.first : -1, nomNext: cfg.nom ? cfg.nom.first : -1, nomIdx: 0, caramelX: null, convWarn: false, timeUp: false };
  // 타임어택: 모든 스테이지는 시간이 지나면 천장이 한 칸씩 내려온다 (dropSec 가 있으면 그 스테이지만 더 빠르게)
  cfg.dropSec = Math.min(st.fall || 18, cfg.dropSec || Infinity); h.dropT = cfg.dropSec;
  return h;
}
function boardColors() { const s = Board.colorsOnBoard(G.b); const arr = [...s]; return arr.length ? arr : [...G.st.colors]; }
function randomColor() { const a = boardColors(); return a[Math.floor(rand() * a.length)]; }
function fillQueue() { const want = 6; while (G.queue.length < want) G.queue.push(randomColor()); G.queue.length = Math.min(G.queue.length, want); }
function refreshQueueColors() {
  const s = Board.colorsOnBoard(G.b); if (!s.size) return;
  G.queue = G.queue.map(c => c === 'w' || c === 'z' || s.has(c) ? c : randomColor());
}
function warn(text) { G.hz.warn = { text, t: 0 }; }
const nomActive = act => { const n = G && G.hz.nom; return !!n && n.act === act && (n.state === 'block' || n.state === 'hover' || n.state === 'fly'); };

function shoot() {
  if (G && G.mode === 'bonus') return bonusShoot();
  if (!G || G.state !== 'aim' || G.paused || !G.queue.length) return false;
  const color = G.queue.shift();
  G.fired++;
  G.hz.started = true;   // 천장 시계는 첫 발부터 (팁을 읽는 동안은 안 흐름)
  fillQueue();
  if (G.hz.aimBoost > 0) G.hz.aimBoost--;
  G.queueShift = 1;
  hideTip();
  sfx('shoot');
  if (nomActive('block')) {
    // 놈놈이 대포 앞을 막고 있으면 거품이 막힌다
    const n = G.hz.nom; n.state = 'leave'; n.t = 0;
    burst(PIVOT.x, PIVOT.y - 60, color, 8);
    G.texts.push({ x: 180, y: 470, text: T('막혔어요!'), life: 1.1, color: '#d9c8ff' });
    showToast(T('놈놈이 막았어요!')); sfx('boss');
    G.state = 'settle'; G.settleT = .35;
    return true;
  }
  const a = G.angle;
  G.moving = { x: PIVOT.x + Math.cos(a) * 34, y: PIVOT.y + Math.sin(a) * 34, vx: Math.cos(a) * SPEED, vy: Math.sin(a) * SPEED, c: color };
  G.state = 'flying';
  return true;
}
function swapQueue() {
  if (!G || G.state !== 'aim' || G.paused) return false;
  if (nomActive('block')) {
    // 간지럼 공격: 대포를 막은 놈놈을 쫓아낸다
    const n = G.hz.nom; n.state = 'leave'; n.t = 0; n.hit = true;
    G.score += 30; G.tally.nom++; G.tally.nomPts += 30; G.texts.push({ x: PIVOT.x, y: PIVOT.y - 70, text: '+30', life: 1 });
    showToast(T('간지럼 공격! 놈놈이 도망갔어요')); sfx('rescue');
    return true;
  }
  if (G.queue.length < 2) return false;
  [G.queue[0], G.queue[1]] = [G.queue[1], G.queue[0]];
  G.swapT = 1; sfx('swap');
  return true;
}
function setAngle(a) {
  if (!G) return;
  a = Math.max(MIN_A, Math.min(MAX_A, a));
  G.crank += (a - G.angle) * 6;   // 말랑이가 핸들을 돌린 만큼 대포가 돈다
  G.angle = a;
}

function stepMoving(dt) {
  const m = G.moving, b = G.b, steps = Math.ceil(SPEED * dt / 3), hitR2 = (D * 0.82) ** 2;
  for (let i = 0; i < steps; i++) {
    m.x += m.vx * dt / steps; m.y += m.vy * dt / steps;
    if (m.x < R) { m.x = 2 * R - m.x; m.vx = -m.vx; sfx('bounce'); }
    if (m.x > W - R) { m.x = 2 * (W - R) - m.x; m.vx = -m.vx; sfx('bounce'); }
    const oh = Obs.hit(b.obs, m.x, m.y);
    if (oh && oh.o.t === 'web') { catchWeb(m, oh.o); return; }
    if (oh) { const v = { x: m.vx, y: m.vy }; Obs.bounce(m, v, oh); m.vx = v.x; m.vy = v.y; if (m.obsT === undefined) m.obsT = 0; if (oh.o.hitT > .15) obsBump(oh.o, m); }
    if (m.vy > 0 && m.y > DEADLINE) { lostShot(m); return; }
    if (m.obsT !== undefined && (m.obsT += dt / steps) > 3) { lostShot(m); return; }   // 장애물에 튕긴 뒤 3초 넘게 오가면 사라짐 (장애물 없는 긴 발사는 그대로)
    const n = G.hz.nom;
    if (n && !n.hit && (n.state === 'hover' || n.state === 'fly') && (n.x - m.x) ** 2 + (n.y - m.y) ** 2 < 28 * 28) nomHit();
    let hit = m.y - R <= b.y0;
    if (!hit) for (let r = 0; r < b.rows.length && !hit; r++) for (let c = 0; c < b.rows[r].length; c++) {
      if (!b.rows[r][c]) continue;
      const p = Board.pos(b, r, c);
      if ((p.x - m.x) ** 2 + (p.y - m.y) ** 2 < hitR2) { hit = true; break; }
    }
    if (hit) { land(m); return; }
  }
}

function land(m) {
  const b = G.b;
  const cell = Board.snap(b, m.x, m.y) || Board.snap(b, m.x, m.y + ROW_H);
  G.moving = null;
  if (!cell) { G.state = 'settle'; G.settleT = .2; return; }
  const [r, c] = cell;
  const res = Board.place(b, r, c, m.c);
  const n = res.popped.length, d = res.dropped.length, u = res.unstuck.length;
  const at0 = Board.pos(b, r, c);
  jiggle(at0.x, at0.y, n ? .2 : .13);
  G.streak = n ? G.streak + 1 : 0;
  if (n) {
    // 연속으로 잘 터뜨리면 젤리들이 활짝 (2연속부터 글자, 3연속부터 말랑이도 신남)
    if (G.streak >= 2) { G.texts.push({ x: at0.x, y: at0.y - 30, text: T('{n}연속!', { n: G.streak }), life: 1.1, color: '#9ff0ff' }); if (G.streak >= 3) jellyVoice('yay'); }
    if (G.streak >= 2 || n + d >= 6) setFace('joy', 1.5, at0);
  }
  if (n || u) {
    G.score += n * 10 + d * 20 + u * 10;
    G.tally.pop += n; G.tally.popPts += n * 10 + u * 10; G.tally.drop += d; G.tally.dropPts += d * 20;
    res.popped.forEach((p, i) => { const q = Board.pos(b, p.r, p.c); G.pops.push({ x: q.x, y: q.y, c: p.cell.c, t: -i * .03 }); burst(q.x, q.y, p.cell.c, 6); punchCloud(q.x, q.y); });
    res.dropped.forEach(p => { const q = Board.pos(b, p.r, p.c); G.falls.push({ x: q.x, y: q.y, vy: -60 - rand() * 80, vx: (rand() - .5) * 60, c: p.cell.c, friend: p.cell.friend }); punchCloud(q.x, q.y); });
    res.unstuck.forEach((p, i) => { const q = Board.pos(b, p.r, p.c); burst(q.x, q.y, '#ffb347', 8); if (i < 2) G.texts.push({ x: q.x, y: q.y - 6, text: T('시럽 벗김!'), life: 1, color: '#ffc24a' }); });
    res.thawed.forEach(p => { const q = Board.pos(b, p.r, p.c); burst(q.x, q.y, '#dff4ff', 6); });
    res.recolored.forEach(p => { const q = Board.pos(b, p.r, p.c); burst(q.x, q.y, '#fff', 3); });
    [...res.popped, ...res.dropped].forEach(p => { if (p.cell.friend !== undefined) rescue(p.cell.friend, Board.pos(b, p.r, p.c)); });
    if (G.st.boss && n + d) {
      const dmg = n + d; G.bossHp = Math.max(0, G.bossHp - dmg); G.bossHit = 1; G.texts.push({ x: 180, y: 122, text: '-' + dmg, life: 1, color: '#ff8ab8' });
      bossPhases();
    }
    const p0 = Board.pos(b, r, c);
    G.texts.push({ x: p0.x, y: p0.y, text: '+' + (n * 10 + d * 20 + u * 10), life: 1 });
    if (u && !n) showToast(T('시럽이 벗겨졌어요!'));
    else if (d >= 4) showToast(T('우르르 쿵!')); else if (n >= 6) showToast(T('굉장해요!'));
    // 선물 상자: 다음 거품이 무지개(60%) 또는 폭탄(40%)
    if (res.gifts && G.queue.length) { const bomb = rand() < .4; G.queue[0] = bomb ? 'z' : 'w'; showToast(bomb ? T('선물 상자! 폭탄 거품') : T('선물 상자! 무지개 거품')); }
    if (res.fireflies) { G.hz.aimBoost = 3; showToast(T('반딧불! 3발 동안 조준선이 길어요')); }
    if (res.bonus && !G.bonusTicket) { G.bonusTicket = true; G.texts.push({ x: at0.x, y: at0.y - 50, text: T('보너스!'), life: 1.5, color: '#ffe27a' }); showToast(T('보너스 젤리! 판을 깨면 보너스 스테이지')); sfx('rescue'); }
    if (res.bombs) {
      res.popped.filter(p => p.cell.k === 'z').forEach(p => { const q = Board.pos(b, p.r, p.c); burst(q.x, q.y, '#ffb347', 18); burst(q.x, q.y, '#ff5f3a', 10); });
      G.impact = Math.max(G.impact || 0, .4); showToast(res.bombs > 1 ? T('연쇄 폭발! 펑펑!') : T('폭탄 펑!')); sfx('boom', res.bombs);
    }
    res.randoms.forEach(p => applyLucky(pickLucky(), Board.pos(b, p.r, p.c)));
    sfx('pop', n); if (d) setTimeout(() => sfx('drop', d), 120);
    try { navigator.vibrate && navigator.vibrate(n >= 5 ? 30 : 12); } catch (e) {}
  } else {
    G.hz.misses++;
    res.wobbled.forEach(p => G.wobbles.push({ r: p.r, c: p.c, t: 0 }));
    if (res.wobbled.length) showToast(T('푸딩이 출렁! 색이 바뀌었어요'));
    sfx('stick');
  }
  G.state = 'settle'; G.settleT = n ? .45 : .12;
  updateHud();
}

// ---------- 지형 장애물 ----------
// 나뭇가지·풍차에 튕김: 흔들림 + 나뭇잎/사탕 가루 + 통 소리
function obsBump(o, m) {
  o.hitT = 0;
  burst(m.x, m.y, o.t === 'branch' ? '#7bd36a' : '#ffd1e8', 5);
  sfx(o.t === 'branch' ? 'branch' : 'fan');
  if (o.t === 'branch' && !G.hz.seenBump) { G.hz.seenBump = true; G.texts.push({ x: m.x, y: m.y - 20, text: T('통!'), life: .8, color: '#c8f5b0' }); }
}
// 솜사탕 거미줄: 거품이 걸려 대롱대롱 흔들리다 거미줄과 함께 떨어진다 (헛방 1번)
function catchWeb(m, o) {
  G.moving = null;
  o.gone = true;
  G.webCatch = { x: m.x, y: m.y, c: m.c, o, t: 0 };
  G.hz.misses++;
  G.texts.push({ x: m.x, y: m.y - 24, text: T('거미줄에 걸렸어요!'), life: 1.1, color: '#ffe0f0' });
  sfx('web');
  G.state = 'settle'; G.settleT = .7;
  updateHud();
}
// 장애물에 튕겨 바닥 쪽으로 돌아온 거품: 판에 못 붙고 사라진다 (헛방 1번)
function lostShot(m) {
  G.moving = null;
  G.falls.push({ x: m.x, y: m.y, vy: 120, vx: m.vx * .2, c: m.c });
  G.hz.misses++;
  showToast(T('튕겨 나갔어요!'));
  sfx('stick');
  G.state = 'settle'; G.settleT = .3;
  updateHud();
}
// 판이 내려와 장애물에 닿으면 부서져 없어진다
function obsCrush() {
  const b = G.b, low = Board.lowestY(b) + R;
  (b.obs || []).forEach(o => {
    if (o.gone || low < Obs.top(o)) return;
    o.gone = true;
    const [x1, y1, x2, y2] = Obs.ends(o);
    for (let i = 0; i <= 4; i++) burst(x1 + (x2 - x1) * i / 4, y1 + (y2 - y1) * i / 4, o.t === 'branch' ? '#9a6232' : o.t === 'web' ? '#fff' : '#ff8fb1', 4);
    G.texts.push({ x: o.x, y: o.y - 16, text: T('와작!'), life: .9, color: '#fff' });
    sfx('stick');
  });
}

// 랜덤 거품: 좋은 효과 4가지(60%) · 나쁜 효과 3가지(40%) 중 하나가 나온다
const LUCKY = [
  { id: 'bomb', good: true, text: T('랜덤알: 다음 거품이 폭탄!') },
  { id: 'rainbow', good: true, text: T('랜덤알: 다음 거품이 무지개!') },
  { id: 'firefly', good: true, text: T('랜덤알: 반딧불! 3발 동안 조준선이 길어요') },
  { id: 'time', good: true, text: T('랜덤알: 시간 충전!') },
  { id: 'fog', good: false, text: T('랜덤알: 앗, 안개가 꼈어요!') },
  { id: 'ceil', good: false, text: T('랜덤알: 앗, 천장이 한 칸!') },
  { id: 'mix', good: false, text: T('랜덤알: 앗, 주변 색이 뒤섞였어요!') },
];
function pickLucky() { const good = rand() < .6, list = LUCKY.filter(e => e.good === good); return list[Math.floor(rand() * list.length)]; }
function applyLucky(e, at) {
  const h = G.hz;
  if (e.id === 'bomb' && G.queue.length) G.queue[0] = 'z';
  else if (e.id === 'rainbow' && G.queue.length) G.queue[0] = 'w';
  else if (e.id === 'firefly') h.aimBoost = 3;
  else if (e.id === 'time') { h.dropT = h.cfg.dropSec; if (h.clock !== null && h.clock > 0 && !h.timeUp) h.clock += 5; }
  else if (e.id === 'fog') { if (h.cloud && !h.cloud.leaving) h.cloud.left = Math.max(h.cloud.left, 5); else spawnCloud({ last: 5, rows: 3 }); }   // 이번 발 끝에서 1 줄어 4발
  else if (e.id === 'ceil') lowerCeiling(1, e.text);
  else if (e.id === 'mix') {
    // 터진 자리 주변 보통 거품만 색이 바뀐다 (갇힌 친구·특수 거품은 그대로)
    const pal = boardColors();
    G.b.rows.forEach((row, r) => row.forEach((cell, c) => {
      if (!cell || cell.k || cell.solid || cell.friend !== undefined) return;
      const q = Board.pos(G.b, r, c);
      if ((q.x - at.x) ** 2 + (q.y - at.y) ** 2 > BLAST2) return;
      cell.c = pal[Math.floor(rand() * pal.length)]; burst(q.x, q.y, '#fff', 3);
    }));
    refreshQueueColors();
  }
  burst(at.x, at.y, e.good ? '#ffe27a' : '#a99bd0', 14);
  G.texts.push({ x: at.x, y: at.y - 14, text: e.good ? T('행운!') : T('꽝!'), life: 1.2, color: e.good ? '#ffe27a' : '#d9c8ff' });
  if (e.id !== 'ceil') showToast(e.text);
  if (e.good) sfx('rescue'); else nomCameo(e.id, at, true);
  G.lucky = (G.lucky || []).concat(e.id);   // 테스트용 기록
}

function rescue(idx, at) {
  const f = G.st.friends[idx] || G.st.friends[0];
  G.saved++;
  setFace('joy', 1.6, at);
  // 거품에서 풀려나 위로 톡 튀어 오른 뒤 떨어진다 → 땅에서 통통 → 데굴데굴 → 말랑이 옆 자리로 폴짝 (stepRescue)
  const slot = RESCUE_SLOTS[G.rescues.length % RESCUE_SLOTS.length];
  G.rescues.push({ x: at.x, y: at.y, vx: (at.x < W / 2 ? 1 : -1) * (40 + Math.random() * 50), vy: -260, rot: 0, sq: 0, t: 0, phase: 'fall', bounces: 0, slot, color: f.color, name: f.name });
  if (f.name) showToast(f.name + T(' 구출!'));
  sfx('rescue');
}

// 천장 내리기 (조준 중이면 바로, 아니면 정리할 때)
function lowerCeiling(rows, text, kind = 'ceil') {
  G.y0Target += rows * ROW_H;
  setFace('o', 1.1, { x: W / 2, y: G.b.y0 });
  jiggle(W / 2, G.b.y0, .12);
  showToast(text || T('천장이 내려와요!'));
  sfx('boss');
  if (G.state === 'aim') {
    G.b.y0 = G.y0Target;
    if (loseIfTouching()) return;   // 생명을 잃었거나 게임 오버: 심술 놈놈은 안 나옴
    obsCrush(); checkWarn();
  }
  nomCameo(kind);
}

// 보스 체력이 줄면 다음 단계 (방해 요소가 늘어난다)
function bossPhases() {
  const bs = G.st.boss, h = G.hz;
  (bs.phases || []).forEach((ph, i) => {
    if (i < h.phase || G.bossHp / bs.hp > ph.at) return;
    h.phase = i + 1;
    if (ph.nom) { h.cfg.nom = ph.nom; h.nomNext = G.shotCount + 1 + ph.nom.first; }
    if (ph.cloud) { h.cfg.cloud = ph.cloud; h.cloudNext = G.shotCount + 2; }
    if (ph.dropSec) { h.cfg.dropSec = ph.dropSec; h.dropT = ph.dropSec; }
    if (ph.aim) h.cfg.aim = ph.aim;
    if (ph.red) h.red = true;
    // 마지막 단계는 방해를 바꿔 끼운다 (동시에 3개까지)
    (ph.off || []).forEach(k => { h.cfg[k] = null; if (k === 'nom' && h.nom && h.nom.state !== 'gone') { h.nom.state = 'leave'; h.nom.t = 0; } if (k === 'cloud' && h.cloud) h.cloud.leaving = true; });
    G.texts.push({ x: 180, y: 150, text: ph.say || (bs.name + T('이(가) 화났어요!')), life: 1.6, color: '#ffb3d4' });
    setFace('worried', 1.8, { x: W / 2, y: G.b.y0 });
    sfx('boss');
  });
}

// 한 발이 끝날 때마다: 천장·구름·놈놈·캐러멜·컨베이어·보스 공격
function hazardsAfterShot() {
  const h = G.hz, cfg = h.cfg, b = G.b, n = G.shotCount, st = G.st;
  h.ceilWarn = 0;
  if (cfg.drop) { if (n % cfg.drop === 0) lowerCeiling(1); else if ((n + 1) % cfg.drop === 0) h.ceilWarn = 1; }
  if (cfg.miss) { if (h.misses >= cfg.miss) { h.misses = 0; lowerCeiling(1, T('헛방 3번! 천장이 내려와요')); } else if (h.misses === cfg.miss - 1) h.ceilWarn = 1; }
  // 구름: 오는 중이면 하나 줄이고, 때가 되면 새로 덮는다
  if (h.cloud && !h.cloud.leaving && --h.cloud.left <= 0) h.cloud.leaving = true;
  if (cfg.cloud) {
    if (n === h.cloudNext) { spawnCloud(cfg.cloud); h.cloudNext = n + cfg.cloud.every; }
    else if (n + 1 === h.cloudNext) warn(cfg.cloud.look === 'frost' ? T('서리가 끼려 해요!') : T('구름이 몰려와요!'));
  }
  // 꼬마 놈놈: 한 발 전에 빼꼼 → 행동
  if (h.nom && h.nom.shots !== undefined && (h.nom.state === 'hover' || h.nom.state === 'fly') && --h.nom.shots <= 0) { h.nom.state = 'leave'; h.nom.t = 0; }
  if (cfg.nom) {
    if (n === h.nomNext) { nomAct(cfg.nom.acts[h.nomIdx++ % cfg.nom.acts.length]); h.nomNext = n + cfg.nom.every; }
    else if (n + 1 === h.nomNext && (!h.nom || h.nom.state === 'gone' || h.nom.state === 'leave')) nomPeek(cfg.nom.acts[h.nomIdx % cfg.nom.acts.length]);
  }
  // 캐러멜 방울
  if (cfg.caramel) {
    if (n % cfg.caramel === 0 && h.caramelX !== null) {
      const at = Board.stickFrom(b, h.caramelX, Board.cell(randomColor(), '.'));
      h.caramelLast = at;
      if (at) { const q = Board.pos(b, at[0], at[1]); burst(q.x, q.y, '#e8912f', 6); showToast(T('캐러멜 방울이 떨어졌어요!')); }
      h.caramelX = null;
    } else if ((n + 1) % cfg.caramel === 0) { h.caramelX = 40 + rand() * 280; warn(T('캐러멜 방울이 떨어지려 해요!')); }
  }
  // 컨베이어: 정해진 줄이 한 칸씩 (줄마다 방향 반대)
  if (cfg.conveyor) {
    const cv = cfg.conveyor; h.convWarn = false;
    if (n % cv.every === 0) {
      cv.rows.forEach((r, i) => Board.shiftRow(b, r, i % 2 ? -1 : 1));
      const fl = Board.floating(b);
      fl.forEach(([y, x]) => { const cell = b.rows[y][x], q = Board.pos(b, y, x); b.rows[y][x] = null; G.falls.push({ x: q.x, y: q.y, vy: -40, vx: 0, c: cell.c, friend: cell.friend }); if (cell.friend !== undefined) rescue(cell.friend, q); if (cell.k === 'h') G.bonusTicket = true; });
      showToast(T('컨베이어가 움직여요!')); sfx('swap');
    } else if ((n + 1) % cv.every === 0) { h.convWarn = true; }
  }
  // 보스의 거품 공격
  if (st.boss && n % st.boss.every === 0) {
    // lucky: 던지는 줄에 랜덤 거품 1개가 섞일 확률 (18·24·30 보스)
    const qi = st.boss.lucky && rand() < st.boss.lucky ? Math.floor(rand() * 9) : -1;   // 9칸 줄이어도 들어가게
    Board.pushTop(b, [...st.colors], i => (i === qi ? 'q' : st.boss.sticky && rand() < st.boss.sticky ? 's' : null));
    if (qi >= 0) G.texts.push({ x: 180, y: 172, text: T('랜덤알도 섞였어요!'), life: 1.2, color: '#ffe27a' });
    G.texts.push({ x: 180, y: 150, text: st.boss.name + T('의 거품 공격!'), life: 1.2, color: '#ffb3d4' }); sfx('boss');
    setFace('o', 1.2, { x: W / 2, y: G.b.y0 }); jiggle(W / 2, G.b.y0, .16);
  } else if (st.boss && (n + 1) % st.boss.every === 0) h.ceilWarn = 1;
  if (st.boss && Board.count(b) === 0) { Board.pushTop(b, [...st.colors]); Board.pushTop(b, [...st.colors]); }
}

function afterSettle() {
  const st = G.st, b = G.b;
  G.shotCount++;
  if (st.boss && G.bossHp <= 0) {
    G.bossDown = G.time; sfx('boss');
    rescue(0, { x: 180, y: 60 });
    return finish(true);
  }
  if (!st.boss && G.saved >= G.need) return finish(true);
  if (G.hz.timeUp) return finish(false, 'time');
  hazardsAfterShot();
  if (G.state === 'done') return;
  if (!st.boss && G.saved >= G.need) return finish(true);   // 컨베이어로 떨어진 친구
  b.y0 = G.y0Target;
  if (loseIfTouching()) return;
  obsCrush(); checkWarn();
  refreshQueueColors();
  G.hz.shotT = G.hz.cfg.shotTimer || 0;
  G.state = 'aim';
}

// 시간으로 움직이는 방해 요소 (타임 어택·한 발 초침·시간 천장). 설명 카드·결과 창·숨은 탭에서는 멈춘다
function tickHazards(dt) {
  const h = G.hz, cfg = h.cfg;
  if (h.warn && (h.warn.t += dt) > 1.8) h.warn = null;
  if (G.state === 'done' || G.state === 'hit' || G.paused || document.hidden) return;   // 닿은 자리 보여 주는 0.9초도 멈춤
  h.elapsed = (h.elapsed || 0) + dt;   // 판이 실제로 흐른 시간
  if (h.clock !== null) {
    const before = h.clock;
    h.clock = Math.max(0, h.clock - dt);
    if (before > 0 && h.clock === 0) {
      if (cfg.clock.hard) { if (G.state === 'aim') return finish(false, 'time'); h.timeUp = true; }
      else { cfg.dropSec = Math.max(4, Math.round(cfg.dropSec / 2)); h.dropT = cfg.dropSec; lowerCeiling(2, T('시간 끝! 천장이 쿵!'), 'time'); }
    }
    if (before > 10 && h.clock <= 10) warn(T('10초 남았어요!'));
  }
  if (cfg.dropSec && h.started) {
    h.dropT -= dt;
    if (h.dropT <= 0) { h.dropT = cfg.dropSec; lowerCeiling(1); }
    else if (h.dropT < 3 && h.dropT + dt >= 3) sfx('tick');
  }
  if (cfg.shotTimer && G.state === 'aim') {
    h.shotT -= dt;
    if (h.shotT <= 0) { h.shotT = cfg.shotTimer; G.aiming = false; showToast(T('시간 초과! 자동 발사')); shoot(); }
  }
}

// ---------- 구름 ----------
function spawnCloud(cfg) {
  const rows = cfg.rows || 3, wisps = [];
  for (let i = 0; i < 9; i++) wisps.push({ x: rand() * W, w: 70 + rand() * 60, ph: rand() * 6, sp: (rand() < .5 ? -1 : 1) * (6 + rand() * 8) });
  // a: 짙기(0→1로 스며들고, 떠날 때 1→0으로 걷힘). depth: 거품 몇 줄 아래까지 덮는지
  G.hz.cloud = { holes: [], wisps, left: cfg.last, leaving: false, a: 0, look: cfg.look || 'cotton', rows, depth: R * 2 + rows * ROW_H + 40 };
  showToast(cfg.look === 'frost' ? T('서리가 꼈어요!') : T('구름이 덮였어요!'));
  nomCameo('fog');
}
function punchCloud(x, y) {
  const cl = G.hz.cloud; if (!cl || cl.leaving) return;
  if (y - G.b.y0 < cl.depth) cl.holes.push({ dx: x, dy: y - G.b.y0, r: 0, to: 40 });
}

// ---------- 꼬마 놈놈 ----------
const NOM_SAY = { steal: T('놈놈이 거품을 노려요!'), take: T('놈놈이 친구를 노려요!'), block: T('놈놈이 대포로 와요!'), junk: T('놈놈이 거품을 던지려 해요!') };
function nomPeek(act) {
  const side = rand() < .5 ? -1 : 1;
  setFace('o', .9, { x: side < 0 ? 0 : W, y: 330 });
  G.hz.nom = { act, state: 'peek', side, x: side < 0 ? -6 : W + 6, y: 330, tx: side < 0 ? 16 : W - 16, ty: 330, t: 0 };
  warn(NOM_SAY[act]);
}
function nomAct(act) {
  const h = G.hz, b = G.b;
  const prev = h.nom && h.nom.state === 'peek' ? h.nom : null;
  const side = prev ? prev.side : (rand() < .5 ? -1 : 1);
  const n = { act, side, x: prev ? prev.x : (side < 0 ? -20 : W + 20), y: prev ? prev.y : 330, t: 0, hit: false };
  const hoverAt = () => ({ tx: 60 + rand() * 240, ty: Math.min(DEADLINE - 50, Math.max(Board.lowestY(b) + 60, 300)) });
  if (act === 'steal') {
    const list = Board.stealable(b);
    if (!list.length) { h.nom = null; return; }
    const [r, c] = list[Math.floor(rand() * list.length)], cell = b.rows[r][c], q = Board.pos(b, r, c);
    b.rows[r][c] = null;
    while (b.rows.length && b.rows[b.rows.length - 1].every(x => !x)) b.rows.pop();
    Object.assign(n, { state: 'fly', carry: cell.c, shots: 2, x: q.x, y: q.y }, hoverAt());
    showToast(T('놈놈이 거품을 훔쳤어요!'));
  } else if (act === 'take') {
    const taken = G.queue.pop(); fillQueue();
    h.dropT = Math.max(1, h.dropT - 4);
    Object.assign(n, { state: 'fly', carryFriend: COLORS[taken] ? COLORS[taken].base : AC.pink, shots: 3, x: queuePos(2).x, y: queuePos(2).y }, hoverAt());
    showToast(T('놈놈이 친구를 데려갔어요! 천장 -4초')); updateHud();
  } else if (act === 'block') {
    Object.assign(n, { state: 'block', tx: PIVOT.x, ty: PIVOT.y - 74 });
    showToast(T('놈놈이 대포를 막았어요! 맨 앞 친구를 눌러요'));
  } else if (act === 'junk') {
    const x = 40 + rand() * 280;
    const at = Board.stickFrom(b, x, Board.cell(null, 'n'));
    if (at) { const q = Board.pos(b, at[0], at[1]); burst(q.x, q.y, '#8e84a8', 6); }
    Object.assign(n, { state: 'leave', t: 0 });
    showToast(T('놈놈이 회색 거품을 던졌어요!'));
  }
  sfx('boss');
  h.nom = n;
}
function nomHit() {
  const n = G.hz.nom; n.hit = true; n.state = 'leave'; n.t = 0;
  setFace('joy', 1.4, { x: n.x, y: n.y });
  G.score += 50; G.tally.nom++; G.tally.nomPts += 50; G.texts.push({ x: n.x, y: n.y - 10, text: '+50', life: 1 });
  burst(n.x, n.y, '#b8a6ff', 10);
  if (n.act === 'take') { G.hz.dropT = Math.min(G.hz.cfg.dropSec, G.hz.dropT + 4); showToast(T('친구를 되찾았어요! +4초')); }
  else if (n.carry) { G.falls.push({ x: n.x, y: n.y, vy: -80, vx: 0, c: n.carry }); showToast(T('놈놈을 쫓아냈어요!')); }
  else showToast(T('놈놈을 쫓아냈어요!'));
  sfx('rescue'); updateHud();
}
function stepNom(dt) {
  const n = G.hz.nom; if (!n) return;
  n.t += dt;
  if (n.state === 'leave') { n.tx = n.side < 0 ? -60 : W + 60; n.ty = n.hit ? n.y - 120 : n.y - 40; if (n.t > 1.2) { G.hz.nom = null; return; } }
  const k = Math.min(1, dt * (n.state === 'leave' ? 3 : 4));
  if (n.tx !== undefined) { n.x += (n.tx - n.x) * k; n.y += (n.ty - n.y) * k; }
  if (n.state === 'fly' && Math.hypot(n.tx - n.x, n.ty - n.y) < 3) n.state = 'hover';
}

function finish(win, reason) {
  if (!win && (reason === 'line' || reason === 'time') && G.state !== 'done' && P.lives > 1) return loseLife(reason);
  if (!win && (reason === 'line' || reason === 'time')) { P.lives = 0; saveP(); updateLives(); }
  G.state = 'done';
  G.outcome = { win, reason };
  const st = G.st;
  let stars = 0, newSticker = false;
  if (win) {
    let ratio = 1 - G.fired / st.shots;   // 기준 발 수보다 적게 쏠수록 별이 많다
    if (G.hz.cfg.clock) ratio += (G.hz.clock / G.hz.cfg.clock.sec) * .3;   // 남은 시간 보너스
    stars = ratio >= .35 ? 3 : ratio >= .15 ? 2 : 1;
    P.stars[st.id - 1] = Math.max(P.stars[st.id - 1] || 0, stars);
    if (!P.stickers[st.id]) { P.stickers[st.id] = true; newSticker = true; }
    // 점수표: 판에서 얻은 점수 + 끝난 뒤 보너스(구출·남은 시간·아낀 거품)를 더해 최종 점수
    G.outcome.rows = scoreRows(st);
    G.score = G.outcome.rows.reduce((a, r) => a + r.pts, 0);
    P.best = P.best || {};
    G.outcome.best = G.score > (P.best[st.id] || 0) && !!P.best[st.id];   // 처음 깬 판은 '최고 기록' 표시 안 함
    P.best[st.id] = Math.max(P.best[st.id] || 0, G.score);
    saveP();
    sfx('win');
  } else gameOver(reason);
  G.outcome.stars = stars; G.outcome.newSticker = newSticker;
  const game = G;
  // 이기면 구출된 친구가 말랑이 옆에 도착할 때까지 조금 더 기다린다 (최대 2.6초)
  const t0 = performance.now();
  const wait = () => {
    if (G !== game) return;
    const dt = performance.now() - t0, landed = game.rescues.every(r => r.phase === 'stay');
    if (!win ? dt >= (game.loseHit ? 1300 : 600) : (dt >= 1100 && landed) || dt >= 2600) showResult(); else setTimeout(wait, 100);
  };
  setTimeout(wait, win ? 1100 : G.loseHit ? 1300 : 600);   // 닿아서 졌으면 닿은 자리를 먼저 보여 준다
}
// 점수표 줄: 판에서 얻은 점수(터뜨림·떨어뜨림·놈놈) + 보너스(구출·보스·남은 시간·아낀 거품)
function scoreRows(st) {
  const t = G.tally, h = G.hz, rows = [];
  const other = G.score - t.popPts - t.dropPts - t.nomPts;   // 혹시 다른 곳에서 들어온 점수는 터뜨림에 합친다
  rows.push({ label: T('터뜨린 거품 ×{n}', { n: t.pop }), pts: t.popPts + other });
  if (t.drop) rows.push({ label: T('떨어뜨린 거품 ×{n}', { n: t.drop }), pts: t.dropPts });
  if (t.nom) rows.push({ label: T('놈놈 쫓아내기 ×{n}', { n: t.nom }), pts: t.nomPts });
  if (st.boss) rows.push({ label: T('보스 물리침'), pts: 1000 });
  else rows.push({ label: T('구출한 친구 ×{n}', { n: G.saved }), pts: G.saved * 100 });
  if (h.cfg.clock && h.clock > 0) { const s = Math.ceil(h.clock); rows.push({ label: T('남은 시간 {n}초', { n: s }), pts: s * 20 }); }
  const spare = Math.max(0, st.shots - G.fired);
  if (spare) rows.push({ label: T('아낀 거품 ×{n}', { n: spare }), pts: spare * 30 });
  return rows;
}

// ---------- 게임 오버: 그 판 화면 그대로 위에 GAME OVER 글자 + 놈놈이 깔깔 ----------

// ---------- 게임 오버 판정 (0.15.1 Owner): 선이 아니라 거품이 진짜로 닿을 때 ----------
// 말랑이 · 대포(몸통·바퀴) · 기다리는 젤리 · 맨 바닥(땅). 경고 선(DEADLINE)을 넘으면 강한 경고만 준다
function touchTargets() {
  const L = [{ what: 'mascot', x: MASCOT.x, y: MASCOT.y + 2, r: MASCOT.r },
    { what: 'cannon', x: PIVOT.x, y: PIVOT.y, r: 19 * CK },
    { what: 'cannon', x: CANNON.wheel.x, y: CANNON.wheel.y, r: CANNON.wheel.r },
    { what: 'cannon', x: CANNON.front.x, y: CANNON.front.y, r: CANNON.front.r },
    { what: 'cannon', x: PIVOT.x + Math.cos(G.angle) * 44 * CK, y: PIVOT.y + Math.sin(G.angle) * 44 * CK, r: 13 }];   // 대포 속 준비된 젤리
  for (let i = 1; i <= Math.min(3, G.queue.length - 1); i++) { const q = queuePos(i); L.push({ what: 'queue', x: q.x, y: q.y, r: 10 }); }
  return L;
}
function touchHit(b) {
  if (Board.lowestY(b) + R <= DEADLINE) return null;   // 경고 선 위쪽이면 닿을 일이 없다
  const T2 = touchTargets(), ground = RESCUE_GROUND - 4;
  for (let r = b.rows.length - 1; r >= 0; r--) for (let c = 0; c < b.rows[r].length; c++) {
    if (!b.rows[r][c]) continue;
    const p = Board.pos(b, r, c);
    if (p.y + R <= DEADLINE) continue;
    for (const o of T2) if ((p.x - o.x) ** 2 + (p.y - o.y) ** 2 < (R + o.r - 2) ** 2) return { what: o.what, x: p.x, y: p.y, tx: o.x, ty: o.y, tr: o.r };
    if (p.y + R >= ground) return { what: 'ground', x: p.x, y: p.y, tx: p.x, ty: ground + 6, tr: 6 };
  }

}

  G.loseHit = hit; finish(false, 'line'); return true;
}
// 경고 선을 넘은 순간: 경고음 + 진동 + 걱정 얼굴 (넘어 있는 동안은 drawWarn 이 화면을 빨갛게)

// 말풍선 꼬리가 캐릭터를 가리키게: 그림은 390×844를 화면에 cover(가운데, 세로 60%)로 깔았으니 같은 계산으로 화면 좌표를 구한다
function placeSay() {
  const s = SLIDES[slideIdx], el = $('slideSay'), box = $('slideBox');
  if (el && !s.at) el.classList.add('on');
  if (!el || !box || !s.at) return;
  const w = box.clientWidth, h = box.clientHeight, k = Math.max(w / 390, h / 844);
  const x = (w - 390 * k) / 2 + s.at[0] * k, y = (h - 844 * k) * 0.6 + s.at[1] * k;
  const bw = el.offsetWidth, bh = el.offsetHeight, left = Math.min(Math.max(12, x - Math.min(60, bw / 2)), w - bw - 12);
  el.style.left = left + 'px';
  el.style.top = (s.below ? y + 10 : y - bh - 10) + 'px';
  el.style.setProperty('--tx', Math.min(Math.max(18, x - left), bw - 18) + 'px');
  el.style.transformOrigin = `${x - left}px ${s.below ? '0' : '100%'}`;
  el.classList.add('on');
}

  // 일정: 줄마다 (나타남 0.15초 + 올라감 0.25~0.7초 + 쉼 0.12초) → 합계 짠 → 별 0.3초 간격
  const plan = []; let at = .25;
  rows.forEach((r, i) => { const dur = r.pts ? Math.min(.7, .25 + r.pts / 2500) : .1; plan.push({ i, start: at + .15, dur }); at += .15 + dur + .12; });
  const totalAt = at, starAt = at + .35, endAt = starAt + o.stars * .3 + .1;
  const t0 = performance.now(), state = { shown: -1, done: new Set(), stars: 0, total: false, ticks: 0 };
  const sum = upto => rows.slice(0, upto).reduce((a, r) => a + r.pts, 0);
  const finishAll = () => {
    rowEls.forEach((e, i) => { e.classList.add('in'); e.lastChild.textContent = rows[i].pts.toLocaleString(); });
    totEl.textContent = total.toLocaleString(); totEl.parentNode.classList.add('done');
    stars.forEach((s, i) => s.className = i < o.stars ? 'on' : '');
    if (o.best && !el.querySelector('.tbest')) { sfx('rescue'); el.querySelector('.tally').insertAdjacentHTML('beforeend', `<div class="tbest">${T('최고 기록!')}</div>`); }
    el.setAttribute('data-done', '1');
    stopTally();
  };
  const step = now => {
    if ($('result').hidden) return stopTally();
    const t = (now - t0) / 1000;
    let running = 0;
    plan.forEach(p => {
      const e = rowEls[p.i], r = rows[p.i];
      if (t >= p.start - .15 && !e.classList.contains('in')) e.classList.add('in');
      const k = Math.max(0, Math.min(1, (t - p.start) / p.dur)), v = Math.round(r.pts * k);
      e.lastChild.textContent = v.toLocaleString(); running += v;
      if (k > 0 && k < 1 && t * 30 > state.ticks) { state.ticks = Math.ceil(t * 30); if (state.ticks % 2) sfx('count', p.i * 6 + Math.round(k * 6)); }
      if (k >= 1 && !state.done.has(p.i)) { state.done.add(p.i); sfx('ding'); }
    });
    totEl.textContent = running.toLocaleString();
    if (t >= totalAt && !state.total) { state.total = true; totEl.textContent = total.toLocaleString(); totEl.parentNode.classList.add('done'); sfx('total'); }
    while (state.stars < o.stars && t >= starAt + state.stars * .3) { stars[state.stars].className = 'on'; sfx('star', state.stars); state.stars++; }
    if (t >= endAt) return finishAll();
    tally.raf = requestAnimationFrame(step);
  };
  tally = { raf: requestAnimationFrame(step), skip: finishAll };
  // 카드 아무 데나 눌러도 바로 끝까지 (버튼은 원래 일)
  $('result').querySelector('.result-card').onclick = e => { if (!e.target.closest('button') && tally) tally.skip(); };
}
// ---------- 이어하기 (보상형 광고 · 후원 팩, monetize.js) ----------
function canRevive() {
  if (!G || !G.outcome || G.outcome.win || !window.JellyMonetize) return false;
  if ((G.continues || 0) >= JellyMonetize.continuePerStage) return false;
  return JellyMonetize.canContinue();
}
// 같은 판 이어하기: 천장 3칸 올리기(바닥 선과 3칸 여유가 생길 때까지 더, 단 시작 높이까지만)
// → 그래도 바닥 선 근처면 아래쪽 거품만 걷어 낸다(갇힌 친구는 구출). 시간 끝이면 +20초
function revive() {
  G.continues = (G.continues || 0) + 1;
  P.lives = Math.max(P.lives, 1); saveP(); updateLives();   // 이어하기 = 마지막 생명 1개로 계속
  pushBack(G.outcome && G.outcome.reason);
  G.cameo = null; G.face = null;
  $('result').hidden = true; $('app').inert = false;
  if (G.state === 'done') return;
  showToast(T('이어서 해 봐요!'));
  setTimeout(() => canvas.focus({ preventScroll: true }), 50);
}
// 생명 하나를 쓰고 같은 판을 계속: 판이 위로 밀려 올라가고 말랑이가 "으쌰!"
function loseLife(reason) {
  P.lives--; saveP();
  G.lifeLost = { t: 0 }; G.cameo = null;
  updateLives(true);
  sfx('stick'); setTimeout(() => sfx('boing', 2), 160);
  try { navigator.vibrate && navigator.vibrate([30, 40, 30]); } catch (e) {}
  setFace('worried', 2.2); hideTip();
  // 0.15.1: 무엇에 닿았는지 보이게 0.9초 멈춘 뒤 판을 밀어 올린다 (시간 끝은 바로)
  if (reason === 'line' && G.loseHit) { G.state = 'hit'; G.hitT = .9; G.hitReason = reason; G.aiming = false; return; }
  pushBack(reason);
  if (G.state === 'done') return;
  showToast(T('생명 -1! 남은 생명 {n}', { n: P.lives }));
}
// 판을 밀어 올리기 (생명 쓰기 · 이어하기 공통)
function pushBack(reason) {
  const b = G.b, h = G.hz;
  const safe = LOSE_Y - 3 * ROW_H;
  G.y0Target = Math.max(G.y0Start, G.y0Target - 3 * ROW_H); b.y0 = G.y0Target;
  while (Board.lowestY(b) + R > safe && G.y0Target > G.y0Start) { G.y0Target = Math.max(G.y0Start, G.y0Target - ROW_H); b.y0 = G.y0Target; }
  b.rows.forEach((row, r) => row.forEach((cell, c) => {
    if (!cell) return;
    const q = Board.pos(b, r, c);
    if (q.y + R <= safe) return;
    row[c] = null; G.falls.push({ x: q.x, y: q.y, vy: -40, vx: 0, c: cell.c, friend: cell.friend });
    if (cell.friend !== undefined) rescue(cell.friend, q);
    if (cell.k === 'h') G.bonusTicket = true;   // 치워진 보너스 젤리도 받은 것으로
  }));
  Board.floating(b).forEach(([y, x]) => { const cell = b.rows[y][x], q = Board.pos(b, y, x); b.rows[y][x] = null; G.falls.push({ x: q.x, y: q.y, vy: -40, vx: 0, c: cell.c, friend: cell.friend }); if (cell.friend !== undefined) rescue(cell.friend, q); if (cell.k === 'h') G.bonusTicket = true; });
  if (reason === 'time' && h.clock !== null) h.clock += 20;
  h.timeUp = false;
  h.shotT = h.cfg.shotTimer || 0; G.aiming = false;   // 한 발 초침도 처음부터
  if (h.cfg.dropSec) h.dropT = h.cfg.dropSec;
  G.outcome = null; G.state = 'aim'; G.over = null; G.moving = null; G.loseHit = null; G.warnOn = false;
  obsCrush();
  if (G.st.boss && Board.count(b) === 0) { Board.pushTop(b, [...G.st.colors]); Board.pushTop(b, [...G.st.colors]); }
  if (!G.st.boss && G.saved >= G.need) return finish(true);
  refreshQueueColors();
  updateHud();
}
// 광고 보는 동안은 게임 소리를 멈춘다 (스토어·토스 심사 기준)
async function withAdPause(fn) {
  const wasRunning = audio && audio.state === 'running';
  if (wasRunning) { adPaused = true; try { await audio.suspend(); } catch (e) {} }
  // resume 는 기다리지 않는다: 휴대폰은 터치 밖에서 resume 가 끝나지 않을 때가 있음 (그래도 다음 터치 때 다시 깨움)
  try { return await fn(); } finally { adPaused = false; if (wasRunning && audio) { try { const r = audio.resume(); if (r && r.catch) r.catch(() => {}); } catch (e) {} } }
}
$('resultAd').onclick = async () => {
  const btn = $('resultAd'); if (btn.disabled || !G) return;
  btn.disabled = true;
  const ok = await withAdPause(() => JellyMonetize.rewarded('continue'));
  btn.disabled = false;
  if (ok && G && G.outcome && !G.outcome.win) revive();
  else if (!ok) { btn.hidden = true; showToast(JellyMonetize.t('adFail')); $('resultMain').focus({ preventScroll: true }); }
};
// ---------- 후원 팩 (인앱 구매) ----------
let shopBusy = false;
async function renderShop() {
  const list = await JellyMonetize.products();
  $('shopList').innerHTML = list.map(p => `<div class="shop-item"><b>${p.title}</b><small>${p.desc}</small>` +
    (p.owned ? `<button class="btn light" disabled>${T('구매했어요')} ✓</button>` : `<button class="btn" data-buy="${p.id}">${T('구매하기')} · ${p.price}</button>`) + '</div>').join('');
  $('shopList').querySelectorAll('[data-buy]').forEach(b => b.onclick = async () => {
    if (shopBusy) return; shopBusy = true; b.disabled = true;
    const ok = await withAdPause(() => JellyMonetize.buy(b.dataset.buy));
    shopBusy = false;
    alertNote(ok === 'pending' ? JellyMonetize.t('pending') : ok ? JellyMonetize.t('bought') : JellyMonetize.t('buyFail'));

}
function alertNote(text) { $('shopMsg').textContent = text; }
function updateShopBtn() { $('shopBtn').hidden = !(window.JellyMonetize && JellyMonetize.canShop()); }
$('shopBtn').onclick = () => { $('shop').hidden = false; $('app').inert = true; alertNote(''); renderShop().catch(() => alertNote(JellyMonetize.t('buyFail'))); setTimeout(() => $('shopClose').focus({ preventScroll: true }), 50); };

$('shop').addEventListener('keydown', e => { if (e.key === 'Escape') $('shopClose').click(); });

  // 구매가 들어오면 상점 버튼·열린 상점 창을 갱신하고, 후원 팩이면 배너 광고를 바로 내린다
  JellyMonetize.onChange(() => { updateShopBtn(); if (JellyMonetize.has('noads')) JellyMonetize.hideBanner(); if (!$('shop').hidden) renderShop().catch(() => {}); });
}
// 스테이지를 처음 깨면 그 스테이지 이야기 컷신 (story.js). 본 컷신은 다시 안 나온다
function playStory(id, then) {
  if (!window.JellyStory || !JellyStory.has(id) || P.seenStory[id]) return then();

$('playMap').onclick = () => { if (G && G.mode === 'bonus') return endBonus(); G = null; $('result').hidden = true; go('map'); };   // 보너스 중이면 이야기 컷신까지 원래 흐름대로
// 결과 창: 포커스를 창 안에 가두고, Esc는 지도로
$('result').addEventListener('keydown', e => {
  const btns = [$('resultAd'), $('resultMain'), $('resultSub')].filter(b => !b.hidden);
  if (e.key === 'Tab') {
    const i = btns.indexOf(document.activeElement);

    $('result').hidden = true; G = null;
    if (win) { const id = Number($('resultMain').dataset.stage); walkFrom = id - 1; playStory(id, () => go('map')); }   // Esc로 나가도 처음 깬 이야기는 보여 준다
    else go('map');
  }
});

// 테스트용 손잡이 (화면에는 영향 없음)
window.__jp = {
  get G() { return G; }, lowerCeiling, touchHit, touchTargets, showBanner, P, STAGES, Board, R, ROW_H, W, H, PIVOT, DEADLINE, LOSE_Y,
  startStage, rescue, showResult, revive, canRevive, finish, land, hazardsAfterShot, unlockAudio, boom, audioReady: () => !!audio, audioState: () => audio && audio.state, soundHint: () => !$('soundHint').hidden, LUCKY, pickLucky, applyLucky, seenHz: () => P.seenHz, aimLimit, music: () => Music.info(), audioMade: () => audioMade, audioBroken: () => audioBroken, musicTrack: n => Music.setTrack(n), fakeStall() { clockSeen.n = 2; lastMade = -1e9; checkAudioClock(true); }, voices: () => voiceCount, soundMode: () => soundMode, sfx, CS, shoot, swapQueue, setAngle, go, seedRandom,
  reset() { Object.assign(P, { stars: new Array(NST).fill(0), stickers: {}, seenIntro: false, at: 0, seenHz: {}, seenStory: {}, best: {}, lives: START_LIVES }); saveP(); },
  story: () => window.JellyStory,
  mapScene: wi => Jelly3D.scene().then(() => mapArtWorld(wi, true)),   // 지도 그림 굽기 도구용 (design/forest/bake-map.mjs)
  // 설명 카드 닫기 · 생각하는 시간 흘려보내기(조준 중 시계가 흐름) · 놈놈이 대포를 막았는지
  closeCard() { if (!$('hzCard').hidden) $('hzOk').click(); },

  blocked() { return nomActive('block'); },
  keysOf, NST, save: saveP, update: dt => update(dt), baseMood: () => baseMood(),

  advance() { let n = 0; while (G && (G.state === 'flying' || G.state === 'settle' || G.state === 'hit') && n++ < 2000) update(1 / 60); return G && G.state; },
  // 이 각도로 쏘면 어디에 붙고 몇 개가 터지는지 (판은 바꾸지 않음)
  evalShot(angle, color) {
    const b = Board.clone(G.b), tr = Board.trace(b, angle);
    if (tr.web || tr.lost) return { cell: null, popped: 0, dropped: 0, friends: 0, lowest: Board.lowestY(b), web: !!tr.web, lost: !!tr.lost };

    if (!cell) return null;

    return { cell, popped: res.popped.length, dropped: res.dropped.length, friends, lowest: Board.lowestY(b) };
  },
};
