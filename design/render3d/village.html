<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>젤리마을 3D 렌더링</title>
<style>
:root{
  --ink:#2b1650;
  --panel:rgba(43,22,80,.78);
  --text:#ffffff;
  --text-muted:#eadfff;
  --star:#ffc93c;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;color:var(--text);font-family:var(--font-display)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);display:flex;gap:8px;align-items:center;pointer-events:none}
.chip{background:var(--panel);border-radius:16px;padding:6px 12px;line-height:1.15}
.chip small{display:block;font-size:12px;color:var(--text-muted)}
.chip b{font-weight:400;font-size:20px}
.grow{flex:1}
.note{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--panel);border-radius:14px;padding:8px 12px;font-size:14px;text-align:center}
.err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:#2a1660;font-size:18px;line-height:1.5}
@media (max-width:360px){.chip b{font-size:17px}}
</style>
</head>
<body>
<canvas id="c" aria-label="말랑이와 친구들이 젤리마을 길을 걸어가는 3D 장면"></canvas>
<div class="hud" aria-hidden="true">
  <div class="chip grow"><small>월드 1</small><b>젤리마을 길</b></div>
  <div class="chip"><small>렌더링</small><b id="fps">—</b></div>
</div>
<div class="note">3D 렌더링 시험 장면 · 그림자·반사·안개를 실시간으로 계산해요</div>
<div class="err" id="err">이 기기에서는 3D 그래픽(WebGL)을 쓸 수 없어요.<br>다른 브라우저(Chrome·Safari)에서 열어 주세요.</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;

// ---------- 공통 ----------
float hash(float n){ return fract(sin(n*127.1)*43758.5453); }
float roadX(float z){ return 2.2*sin(z*0.16) + 0.9*sin(z*0.061+1.3); }
float smin(float a, float b, float k){ float h = clamp(.5+.5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q = abs(p)-b+r; return length(max(q,0.)) + min(max(q.x,max(q.y,q.z)),0.) - r; }
float sdEllipsoid(vec3 p, vec3 r){ float k0 = length(p/r); float k1 = length(p/(r*r)); return k0*(k0-1.)/k1; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p-a, ba = b-a; float h = clamp(dot(pa,ba)/dot(ba,ba), 0., 1.); return length(pa-ba*h) - r; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c,-s,s,c); }

// 말랑이와 친구들 위치 (걷는 속도 = 1.5)
float walkZ(){ return uTime*1.5; }
vec3 jellyPos(float back, float phase){
  float z = walkZ() - back;
  float hop = abs(sin(uTime*6.0 + phase));
  return vec3(roadX(z) + (back < 0.1 ? 0.0 : (back < 2.0 ? -0.55 : 0.55)), 0.02 + hop*0.32, z);
}
float squash(float phase){ return 1.0 - 0.18*(1.0-abs(sin(uTime*6.0 + phase))); }

float groundH(vec3 p){
  float off = abs(p.x - roadX(p.z));
  float hills = 0.35*smoothstep(4.0, 14.0, off) * (0.6 + 0.4*sin(p.x*0.35)*sin(p.z*0.21));
  float curb = 0.045*smoothstep(1.25, 1.45, off);
  return hills + curb;
}

// ---------- 장면 ----------
// 돌려주는 값: x = 거리, y = 재질 번호
float gStep = 1.0;   // 1 = 화면 광선, 0 = 그림자·주변 가림 계산
vec2 map(vec3 p){
  vec2 res = vec2((p.y - groundH(p))*0.7, 1.0);

  // 집: 길 양쪽, z 방향으로 7칸마다 반복
  float cell = floor(p.z/7.0);
  float cz = (cell+0.5)*7.0;
  for (int i = 0; i < 2; i++){
    float s = i == 0 ? -1.0 : 1.0;
    float h = hash(cell*3.1 + s*7.7);
    if (h > 0.82) continue;                                  // 가끔 빈 터
    vec3 q = p - vec3(roadX(cz) + s*(4.3 + h*1.2), 0.0, cz + (h-0.5)*0.8);
    q.xz *= rot(s*0.18*(h-0.5));
    float sc = 0.85 + h*0.25;
    q /= sc;
    float body = sdRoundBox(q - vec3(0., 0.95, 0.), vec3(1.15, 0.95, 1.05), 0.18);
    float roof = sdEllipsoid(q - vec3(0., 1.85, 0.), vec3(1.45, 1.05, 1.32));
    roof = max(roof, -(q.y - 1.82));
    float chimney = sdRoundBox(q - vec3(0.55*s, 2.55, -0.3), vec3(0.16, 0.3, 0.16), 0.05);
    float d = min(body, min(roof, chimney)) * sc;
    if (d < res.x) res = vec2(d, roof < body && roof < chimney ? 4.0 + h : 3.0);
  }
  // 나무: 집 사이, 조금 더 바깥쪽
  float tcell = floor((p.z+3.5)/7.0);
  float tz = tcell*7.0;
  for (int i = 0; i < 2; i++){
    float s = i == 0 ? -1.0 : 1.0;
    float h = hash(tcell*5.3 + s*2.9);
    vec3 q = p - vec3(roadX(tz) + s*(3.4 + h*2.5), 0.0, tz);
    float sc = 0.8 + h*0.5;
    q /= sc;
    float trunk = sdCapsule(q, vec3(0.), vec3(0., 1.3, 0.), 0.16);
    float leaf = smin(length(q - vec3(0., 2.0, 0.)) - 0.85, length(q - vec3(0.45, 1.6, 0.2)) - 0.6, 0.3);
    leaf = smin(leaf, length(q - vec3(-0.45, 1.65, -0.15)) - 0.6, 0.3);
    if (trunk*sc < res.x) res = vec2(trunk*sc, 6.0);
    if (leaf*sc < res.x) res = vec2(leaf*sc, h > 0.55 ? 7.5 : 7.0);
  }
  // 가로등
  float lcell = floor((p.z+1.75)/7.0);
  float lz = lcell*7.0 - 1.75;
  {
    float s = mod(lcell, 2.0) < 1.0 ? -1.0 : 1.0;
    vec3 q = p - vec3(roadX(lz) + s*1.75, 0.0, lz);
    float post = sdCapsule(q, vec3(0.), vec3(0., 1.7, 0.), 0.05);
    float bulb = length(q - vec3(0., 1.85, 0.)) - 0.17;
    if (post < res.x) res = vec2(post, 6.5);
    if (bulb < res.x) res = vec2(bulb, 11.0);
  }

  // 말랑이(분홍, 귀) + 친구 둘
  for (int k = 0; k < 3; k++){
    float back = k == 0 ? 0.0 : (k == 1 ? 1.5 : 2.8);
    float ph = float(k)*1.3;
    float sz = k == 0 ? 1.0 : 0.72;
    vec3 c = jellyPos(back, ph);
    vec3 q = p - c;
    float sq = squash(ph);
    q.y /= sq; q.xz /= (1.0 + (1.0-sq)*0.6);
    q /= sz;
    float body = sdEllipsoid(q - vec3(0., 0.5, 0.), vec3(0.58, 0.52, 0.52));
    body = max(body, -(q.y + 0.0));
    float d = body;
    float mat = 8.0 + float(k);
    if (k == 0){
      vec3 e = q - vec3(0., 0.62, 0.); e.x = abs(e.x) - 0.6; e.xy *= rot(-0.5 + 0.15*sin(uTime*12.0));
      float ear = sdEllipsoid(e, vec3(0.16, 0.36, 0.14));
      d = smin(d, ear, 0.06);
    }
    vec3 eq = q - vec3(0., 0.6, 0.45); eq.x = abs(eq.x) - 0.19;
    float eye = sdEllipsoid(eq, vec3(0.065, 0.095, 0.05));
    float mouth = min(sdCapsule(q, vec3(-0.09, 0.47, 0.49), vec3(0.0, 0.42, 0.51), 0.022), sdCapsule(q, vec3(0.09, 0.47, 0.49), vec3(0.0, 0.42, 0.51), 0.022));
    d *= sz * min(sq, 1.0);
    float ed = min(eye, mouth) * sz * sq;
    if (d < res.x) res = vec2(d, mat);
    if (ed < res.x) res = vec2(ed, 12.0);
  }
  // 반복 칸 경계를 한 번에 건너뛰지 않게 (옆 칸 물건을 뚫고 지나가는 것 방지, 표면으로는 잡히지 않음)
  float b1 = min(p.z - cell*7.0, (cell+1.0)*7.0 - p.z);
  float b2 = min(p.z + 3.5 - tcell*7.0, (tcell+1.0)*7.0 - p.z - 3.5);
  if (gStep > 0.5) res.x = min(res.x, min(b1, b2) + 0.35);
  return res;
}

vec3 normal(vec3 p){
  vec2 e = vec2(0.0015, 0.);
  return normalize(vec3(map(p+e.xyy).x - map(p-e.xyy).x, map(p+e.yxy).x - map(p-e.yxy).x, map(p+e.yyx).x - map(p-e.yyx).x));
}
float softShadow(vec3 ro, vec3 rd){
  gStep = 0.0;
  float r = 1.0, t = 0.12;
  for (int i = 0; i < 40; i++){
    float h = map(ro + rd*t).x;
    r = min(r, 10.0*h/t);
    t += clamp(h, 0.03, 0.6);
    if (r < 0.01 || t > 18.0) break;
  }
  gStep = 1.0;
  return clamp(r, 0., 1.);
}
float ao(vec3 p, vec3 n){
  gStep = 0.0;
  float o = 0.0, s = 1.0;
  for (int i = 1; i <= 5; i++){ float h = 0.06*float(i); o += (h - map(p + n*h).x)*s; s *= 0.7; }
  gStep = 1.0;
  return clamp(1.0 - 2.2*o, 0., 1.);
}

vec3 sky(vec3 rd){
  vec3 top = vec3(0.45, 0.72, 1.0), hor = vec3(1.0, 0.86, 0.93);
  vec3 c = mix(hor, top, pow(max(rd.y, 0.0), 0.55));
  vec3 sun = normalize(vec3(-0.45, 0.55, 0.7));
  c += vec3(1.0, 0.85, 0.6) * pow(max(dot(rd, sun), 0.0), 64.0) * 0.8;
  // 구름
  if (rd.y > 0.0){
    vec2 uv = rd.xz / rd.y * 0.35 + vec2(uTime*0.02, 0.);
    float cl = smoothstep(0.55, 0.9, sin(uv.x*3.1)*sin(uv.y*2.3 + sin(uv.x*1.7)) * 0.5 + 0.5);
    c = mix(c, vec3(1.0), cl * smoothstep(0.0, 0.25, rd.y) * 0.7);
  }
  return c;
}

vec3 jellyColor(float m){
  if (m < 8.5) return vec3(1.0, 0.42, 0.68);   // 말랑이
  if (m < 9.5) return vec3(0.25, 0.66, 1.0);   // 파랑 친구
  return vec3(1.0, 0.8, 0.2);                  // 노랑 친구
}
vec3 roofColor(float h){
  vec3 a = vec3(1.0, 0.43, 0.68), b = vec3(0.65, 0.42, 1.0), c = vec3(1.0, 0.7, 0.25), d = vec3(0.25, 0.75, 0.95);
  return h < 0.25 ? a : h < 0.5 ? b : h < 0.75 ? c : d;
}

vec3 render(vec3 ro, vec3 rd){
  float t = 0.0; vec2 h = vec2(0.);
  bool hit = false;
  for (int i = 0; i < 180; i++){
    h = map(ro + rd*t);
    if (h.x < 0.0008*t + 0.0004){ hit = true; break; }
    t += min(h.x*0.8, 0.9);
    if (t > 70.0) break;
  }
  vec3 bg = sky(rd);
  if (!hit) return bg;
  vec3 p = ro + rd*t, n = normal(p);
  vec3 sun = normalize(vec3(-0.45, 0.55, 0.7));
  float m = h.y;
  vec3 col; float spec = 0.0, gloss = 16.0, jelly = 0.0;
  if (m < 1.5){
    float off = abs(p.x - roadX(p.z));
    vec3 grass = mix(vec3(0.55, 0.85, 0.45), vec3(0.72, 0.93, 0.55), 0.5 + 0.5*sin(p.x*1.7)*sin(p.z*1.3));
    // 길: 둥근 돌 무늬
    vec2 st = vec2(p.x - roadX(p.z), p.z) * 2.2;
    vec2 cid = floor(st), f = fract(st) - 0.5;
    float stone = smoothstep(0.5, 0.36, max(abs(f.x), abs(f.y)) + 0.06*hash(cid.x*13.0 + cid.y));
    vec3 road = mix(vec3(0.78, 0.6, 0.42), mix(vec3(0.97, 0.86, 0.68), vec3(1.0, 0.8, 0.72), hash(cid.x*3.0 + cid.y*7.0)), stone);
    float edge = smoothstep(1.3, 1.2, off);
    col = mix(grass, road, edge);
    // 꽃
    vec2 fl = floor(p.xz*1.6);
    float fh = hash(fl.x*7.0 + fl.y*31.0);
    if (off > 1.6 && fh > 0.93 && length(fract(p.xz*1.6) - 0.5) < 0.18) col = fh > 0.965 ? vec3(1.0, 0.55, 0.75) : vec3(1.0, 0.9, 0.35);
    spec = 0.05;
  } else if (m < 3.5){
    vec3 wall = vec3(1.0, 0.95, 0.9);
    col = wall;
    // 문·창문: 길 쪽 면에 그리기
    float cell = floor(p.z/7.0); float cz = (cell+0.5)*7.0;
    float side = sign(p.x - roadX(cz));
    float hh = hash(cell*3.1 + side*7.7);
    vec3 q = p - vec3(roadX(cz) + side*(4.3 + hh*1.2), 0.0, cz + (hh-0.5)*0.8);
    float sc = 0.85 + hh*0.25; q /= sc;
    if (abs(n.x) > 0.6 && sign(n.x) == -side){
      float door = step(abs(q.z), 0.32) * step(q.y, 1.05);
      float win = step(abs(abs(q.z) - 0.72), 0.2) * step(abs(q.y - 1.25), 0.22);
      col = mix(col, vec3(0.55, 0.32, 0.25), door);
      col = mix(col, vec3(1.0, 0.92, 0.55), win);
    }
    spec = 0.15;
  } else if (m < 5.5){
    col = roofColor(m - 4.0); spec = 0.9; gloss = 60.0; jelly = 0.6;
  } else if (m < 6.25){
    col = vec3(0.6, 0.4, 0.27);
  } else if (m < 6.75){
    col = vec3(0.45, 0.32, 0.6); spec = 0.4;
  } else if (m < 7.25){
    col = vec3(0.35, 0.75, 0.38); spec = 0.25; gloss = 24.0; jelly = 0.25;
  } else if (m < 7.75){
    col = vec3(1.0, 0.62, 0.8); spec = 0.25; gloss = 24.0; jelly = 0.25;
  } else if (m < 10.5){
    col = jellyColor(m); spec = 1.0; gloss = 90.0; jelly = 1.0;
    // 볼터치
    int k = m < 8.5 ? 0 : (m < 9.5 ? 1 : 2);
    float back = k == 0 ? 0.0 : (k == 1 ? 1.5 : 2.8);
    float sz = k == 0 ? 1.0 : 0.72;
    vec3 q = (p - jellyPos(back, float(k)*1.3)) / sz;
    float cheek = smoothstep(0.12, 0.05, length(vec2(abs(q.x) - 0.32, q.y - 0.47))) * step(0.2, q.z);
    col = mix(col, vec3(1.0, 0.45, 0.55), cheek*0.6);
  } else if (m < 11.5){
    return mix(vec3(1.0, 0.93, 0.6)*1.4, bg, 1.0 - exp(-0.0012*t*t));
  } else {
    col = vec3(0.12, 0.06, 0.2); spec = 0.9; gloss = 120.0;
  }

  float dif = clamp(dot(n, sun), 0., 1.);
  float sh = softShadow(p + n*0.04, sun);
  float occ = ao(p, n);
  float wrap = clamp((dot(n, sun) + 0.5)/1.5, 0., 1.);
  vec3 hal = normalize(sun - rd);
  float sp = pow(clamp(dot(n, hal), 0., 1.), gloss) * spec;
  float fre = pow(1.0 - clamp(dot(n, -rd), 0., 1.), 3.0);
  float skyAmt = clamp(0.5 + 0.5*n.y, 0., 1.);

  vec3 lin = vec3(0.);
  lin += mix(dif, wrap, jelly*0.7) * sh * vec3(1.25, 1.1, 0.95);
  lin += skyAmt * occ * vec3(0.45, 0.55, 0.75) * 0.6;
  lin += clamp(dot(n, normalize(vec3(-sun.x, 0., -sun.z))), 0., 1.) * occ * vec3(0.35, 0.25, 0.3) * 0.4; // 되비침
  col *= lin;
  // 젤리: 안에서 빛이 퍼지는 느낌 + 가장자리 반사
  col += jelly * jellyColor(m) * 0.18 * (1.0 - dif) * occ;
  col += sp * sh * vec3(1.0);
  col += fre * occ * (0.15 + jelly*0.35) * sky(reflect(rd, n));
  // 안개 (멀수록 하늘색)
  col = mix(col, bg, 1.0 - exp(-0.00035*t*t));
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  // 카메라: 말랑이 앞쪽 비스듬히 위에서, 걸어오는 모습을 바라봄
  float z = walkZ();
  vec3 target = vec3(roadX(z - 0.6), 0.75, z - 0.6);
  vec3 ro = vec3(roadX(z + 5.5) + 2.2, 2.6, z + 5.5);
  vec3 fw = normalize(target - ro), rt = normalize(cross(fw, vec3(0., 1., 0.))), up = cross(rt, fw);
  float zoom = uRes.x < uRes.y ? 1.25 : 1.6;
  vec3 rd = normalize(uv.x*rt + uv.y*up + zoom*fw);
  vec3 col = render(ro, rd);
  col = pow(col, vec3(0.4545));
  col = col*col*(3.0 - 2.0*col)*0.35 + col*0.65;             // 살짝 대비
  col = mix(vec3(dot(col, vec3(0.299, 0.587, 0.114))), col, 1.3); // 채도
  col *= 1.0 - 0.25*dot(uv*0.9, uv*0.9);                       // 비네트
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { document.getElementById('err').style.display = 'grid'; return; }
  const vsSrc = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  try {
    gl.attachShader(prog, mk(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(prog);
  } catch (e) { console.error(e); document.getElementById('err').style.display = 'grid'; return; }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(prog, 'uRes'), uTime = gl.getUniformLocation(prog, 'uTime');

  // ?t=초 → 그 순간 한 장만 그림 (캡처용), ?q=0.5 → 화질 배율
  const qs = new URLSearchParams(location.search);
  const still = qs.has('t') ? Number(qs.get('t')) : null;
  let quality = qs.has('q') ? Number(qs.get('q')) : 0.6;   // 휴대폰에서도 부드럽게: 처음엔 60% 해상도
  function size() {
    const d = Math.min(window.devicePixelRatio || 1, 2) * quality;
    canvas.width = Math.round(innerWidth * d); canvas.height = Math.round(innerHeight * d);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  size(); addEventListener('resize', size);
  const draw = t => { gl.uniform2f(uRes, canvas.width, canvas.height); gl.uniform1f(uTime, t); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  if (still !== null) { draw(still); window.__rendered = true; document.getElementById('fps').textContent = '정지 화면'; return; }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = performance.now(), frames = 0, last = t0;
  function loop(now) {
    draw(reduce ? 4 : (now - t0) / 1000);
    frames++;
    if (now - last > 1000) {
      const fps = frames * 1000 / (now - last);
      document.getElementById('fps').textContent = Math.round(fps) + ' fps';
      // 느리면 해상도를 낮추고, 여유 있으면 올림
      if (fps < 24 && quality > 0.35) { quality -= 0.1; size(); }
      else if (fps > 50 && quality < 1) { quality += 0.1; size(); }
      frames = 0; last = now;
    }
    if (!reduce) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
