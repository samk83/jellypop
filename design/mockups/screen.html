<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>젤리팝 렌더링 시안</title>
<style>
:root{
  --ink:#2b1650;
  --ink-soft:#5e4a86;
  --panel:rgba(43,22,80,.8);
  --text:#ffffff;
  --text-muted:#eadfff;
  --brand:#7b3fe4;
  --brand-deep:#4b1fa8;
  --pink:#ff5fa8;
  --pink-dark:#c8246b;
  --star:#ffc93c;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1660;color:var(--text);font-family:var(--font-display)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center}
.ib{width:48px;height:48px;border-radius:14px;background:var(--panel);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ib svg{width:24px;height:24px}
.chip{background:var(--panel);border-radius:16px;padding:6px 12px;min-height:48px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.chip small{font-size:12px;color:var(--text-muted)}
.chip b{font-weight:400;font-size:19px;white-space:nowrap}
.grow{flex:1}
.btn{display:grid;place-items:center;min-height:56px;padding:0 28px;border-radius:99px;font-size:22px;color:#fff;
  background:linear-gradient(180deg,#ff8cc4,var(--pink) 55%,#f2408f);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 6px 0 var(--pink-dark),0 12px 22px rgba(0,0,0,.3)}
.btn.light{background:linear-gradient(180deg,#fff,#f1eaff);color:var(--brand-deep);box-shadow:inset 0 3px 0 #fff,0 6px 0 #c9b6ff,0 12px 22px rgba(0,0,0,.25)}
.foot{position:absolute;left:16px;right:16px;bottom:22px;display:flex;gap:12px;justify-content:center}
.logo{position:absolute;top:56px;left:0;right:0;text-align:center}
.logo h1{margin:0;font-weight:400;font-size:86px;line-height:.88;letter-spacing:1px;
  background:linear-gradient(180deg,#fff 0%,#ffe0f2 35%,#ff7fc0 70%,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #6a2bb8) drop-shadow(0 12px 22px rgba(60,10,90,.45))}
.logo .sub{margin-top:10px;font-size:27px;color:var(--star);text-shadow:0 3px 0 #8a3d00,0 6px 14px rgba(0,0,0,.35)}
.tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap}
.num{font-size:26px;color:var(--brand-deep);text-shadow:0 1px 0 #fff}
.num.light{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.name{font-size:12px;background:rgba(43,22,80,.82);border-radius:99px;padding:2px 9px}
.stars{font-size:15px;color:var(--star);text-shadow:0 1px 0 #8a3d00,0 0 4px #fff;letter-spacing:-1px}
.bubble-say{background:#fff;color:var(--brand);border-radius:10px;padding:2px 9px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.shots{background:rgba(20,8,48,.7);border-radius:99px;padding:3px 12px;font-size:14px}
.more{font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
svg.aim{position:absolute;inset:0;width:100%;height:100%}
.card{position:absolute;left:18px;right:18px;bottom:22px;background:#fff;color:var(--ink);border-radius:28px;padding:20px 18px 18px;text-align:center;box-shadow:0 16px 40px rgba(40,10,70,.35)}
.card h2{margin:0;font-weight:400;font-size:32px;color:var(--brand-deep)}
.card p{margin:8px 0 14px;color:var(--ink-soft);font-size:16px;line-height:1.45;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.card p b{color:var(--ink)}
.card .btns{display:grid;gap:12px}
.sticker{width:84px;height:84px;margin:10px auto 0;border-radius:50%;background:#fff;display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 0 0 5px var(--star),0 8px 18px rgba(43,22,80,.3)}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:30px;color:#ffb3d4;text-shadow:0 3px 0 #5a1040,0 6px 16px rgba(0,0,0,.5);white-space:nowrap}
.hp{position:absolute;left:12px;right:12px;top:70px;display:flex;align-items:center;gap:10px;background:rgba(20,8,48,.72);border-radius:14px;padding:8px 12px}
.hp b{font-weight:400;color:#ffb3d4;font-size:16px;white-space:nowrap}
.hp .bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.hp .bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#ff4f8f,#ff9ac4);border-radius:99px}
.hp span{font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="ui"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="j" viewBox="0 0 40 36">
    <path d="M4 24C4 8 12 3 20 3s16 5 16 21c0 8-6 10-16 10S4 32 4 24z" fill="currentColor"/>
    <ellipse cx="13" cy="11" rx="5" ry="2.8" fill="#fff" opacity=".75" transform="rotate(-20 13 11)"/>
    <circle cx="15" cy="20" r="2.3" fill="#2b1650"/><circle cx="25" cy="20" r="2.3" fill="#2b1650"/>
    <path d="M17.5 24.5q2.5 2.6 5 0" stroke="#2b1650" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </symbol>
</defs></svg>
<script src="render.js"></script>
<script>
setTimeout(() => {
  const qs = new URLSearchParams(location.search);
  const S = Number(qs.get('s') || 1), q = Number(qs.get('q') || 1);
  const ok = window.JellyRender.render(document.getElementById('c'), S, q);
  const W = innerWidth, H = innerHeight, ui = document.getElementById('ui');
  const P = (x, y, z) => window.JellyRender.project(S, [x, y, z], W, H);
  const at = ([x, y], html, cls = '') => `<div class="tag ${cls}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px">${html}</div>`;
  const icon = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  };
  let html = '';
  if (qs.get('ui') !== '0') {
    if (S === 1) {
      html = `<div class="logo"><h1>JELLY<br>POP!</h1><div class="sub">젤리마을 대소동</div></div>
        <div class="foot" style="flex-direction:column;align-items:center"><div class="btn" style="width:min(100%,300px)">모험 시작!</div><div class="btn light" style="width:min(100%,300px)">스티커 북</div></div>`;
    } else if (S === 2) {
      const R = window.JellyRender, names = ['마을 광장', '젤리 분수', '꽃밭 언덕', '폭포 다리', '노을 지붕', '마을 입구'];
      html = `<div class="hud"><div class="ib">${icon.home}</div><div class="chip grow"><small>월드 1</small><b>젤리마을</b></div><div class="chip"><small>스티커</small><b>2 / 30</b></div></div>`;
      names.forEach((n, i) => {
        const z = R.nodeZ(i), x = R.roadX(z);
        const c = P(x, .3, z), lab = P(x, .1, z + .85);
        html += at(c, i === 5 ? '보스' : i + 1, 'num' + (i === 5 || i > 2 ? ' light' : ''));
        if (i !== 2) html += at([lab[0], lab[1] + 6], n, 'name');
        if (i < 2) html += at([c[0], c[1] - 30], i === 0 ? '★★★' : '★★☆', 'stars');
      });
      const m = P(R.roadX(R.nodeZ(2)), 1.2, R.nodeZ(2));
      html += at([m[0], m[1] - 40], '다음은 여기!', 'bubble-say');
      html += `<div class="foot"><div class="btn" style="font-size:19px;padding:0 20px">스테이지 3 시작</div><div class="btn light" style="font-size:19px;padding:0 20px">스티커 북</div></div>`;
    } else if (S === 3 || S === 5) {
      const boss = S === 5;
      html = `<div class="hud"><div class="ib">${icon.map}</div><div class="chip grow"><small>스테이지 ${boss ? 6 : 1}</small><b>${boss ? '마을 입구' : '마을 광장'}</b></div><div class="chip"><small>${boss ? '보스 체력' : '구할 친구'}</small><b style="color:var(--star)">${boss ? '22' : '0 / 1'}</b></div><div class="ib">${icon.sound}</div></div>`;
      if (boss) html += `<div class="hp"><b>보스 뭉치</b><div class="bar"><i></i></div><span>22 / 36</span></div>`;
      // 조준선
      const m0 = P(.2 - Math.sin(.38) * 2.6, 2.05 + Math.cos(.38) * 2.6, .9);
      const tgt = boss ? P(1.6, 9.6, 0) : P(-2.1, 11.2, 0);
      const wallX = P(-5.0, 0, 0)[0];
      let pts = [];
      if (boss) { for (let k = 0; k <= 1; k += 1 / 14) pts.push([m0[0] + (tgt[0] - m0[0]) * k, m0[1] + (tgt[1] - m0[1]) * k]); }
      else {
        const hit = [wallX + 12, m0[1] + (tgt[1] - m0[1]) * .55];
        for (let k = 0; k <= 1; k += 1 / 9) pts.push([m0[0] + (hit[0] - m0[0]) * k, m0[1] + (hit[1] - m0[1]) * k]);
        for (let k = 0; k <= 1; k += 1 / 6) pts.push([hit[0] + (tgt[0] - hit[0]) * k, hit[1] + (tgt[1] - hit[1]) * k]);
      }
      const dl = P(0, 5.0, 0)[1];
      html += `<svg class="aim"><line x1="0" x2="${W}" y1="${dl}" y2="${dl}" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-dasharray="7 7"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${3.6 - i * .08}" fill="#fff" opacity="${1 - i * .035}"/>`).join('')}</svg>`;
      const n1 = P(1.95, 3.2, 1.3);
      html += at([n1[0], n1[1] - 8], '다음!', 'bubble-say');
      html += at(P(4.5, 2.7, 1.0), '+14', 'more');
      html += at([W / 2, H - 18], `남은 ${boss ? 18 : 20}`, 'shots');
      if (boss) html += `<div class="toast">뭉치의 거품 공격!</div>`;
    } else if (S === 4) {
      html = `<div class="card"><h2>스테이지 클리어!</h2>
        <div class="sticker"><svg viewBox="0 0 40 36" width="58" height="52" style="color:#4fb4ff"><use href="#j"/></svg></div>
        <p><b>퐁당</b> 스티커를 받았어요!<br>스티커 북 2 / 30</p>
        <div class="btns"><div class="btn">다음 스테이지</div><div class="btn light">다시 하기</div></div></div>`;
    }
  }
  ui.innerHTML = html;
  window.__rendered = ok;
}, 30);
</script>
</body>
</html>
